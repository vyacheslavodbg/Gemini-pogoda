<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Weather & Geo Intelligence</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0b0c10',
              card: '#12141c',
              gold: '#d4af37',
              border: '#232736'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0c10;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-panel {
      background: rgba(22, 25, 36, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card {
      background: rgba(30, 34, 48, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.4);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fff, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="min-h-screen pb-24 antialiased">
  <div class="max-w-4xl mx-auto px-4 pt-4 sm:pt-6">

    <!-- Header -->
    <header class="glass-panel rounded-2xl p-4 mb-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg shadow-brand-gold/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-gold/10 flex items-center justify-center border border-brand-gold/30 text-brand-gold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-extrabold gold-gradient-text">AURA GEO METEO</h1>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-gold text-black font-bold">PREMIUM</span>
          </div>
          <p id="last-update-time" class="text-xs text-slate-400">Обновление данных...</p>
        </div>
      </div>

      <!-- City Switcher -->
      <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-800 w-full sm:w-auto">
        <button id="btn-varna" onclick="switchLocation('varna')" class="flex-1 px-6 py-2 rounded-lg text-sm font-bold bg-brand-gold text-black transition-all">ВАРНА</button>
        <button id="btn-odesa" onclick="switchLocation('odesa')" class="flex-1 px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">ОДЕССА</button>
      </div>
    </header>

    <!-- Telegram Bot Banner (FIXED LINK) -->
    <a href="https://t.me/GmenialarmBot" target="_blank" class="block glass-panel rounded-2xl p-4 mb-5 bg-gradient-to-r from-blue-900/40 to-slate-900 hover:border-blue-500/50 transition-colors border border-blue-500/20">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.02 9.52c-.15.68-.56.84-1.13.53l-3.11-2.29-1.5 1.45c-.17.17-.31.31-.63.31l.22-3.16 5.76-5.2c.25-.22-.05-.34-.39-.12l-7.12 4.48-3.07-.96c-.67-.21-.68-.67.14-.99l12-4.62c.55-.2 1.04.14.85.95z"/></svg>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white">PUSH-УВЕДОМЛЕНИЯ В TELEGRAM</h3>
            <p class="text-[11px] text-slate-300">Получайте предупреждения о магнитных бурях Kp≥5 и землетрясениях 24/7</p>
          </div>
        </div>
        <div class="px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold rounded-xl shrink-0">
          Подключить бота
        </div>
      </div>
    </a>

    <!-- Main Content Area -->
    <main id="main-content" class="min-h-[400px]">
      <div class="flex items-center justify-center h-48 text-slate-400 font-medium">Загрузка модулей...</div>
    </main>

  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-brand-black/95 backdrop-blur-xl border-t border-slate-800 py-2">
    <div class="max-w-md mx-auto grid grid-cols-5 gap-1 text-center px-2">
      <button onclick="switchTab('weather')" id="nav-weather" class="nav-btn py-2 text-brand-gold flex flex-col items-center gap-1"><span class="text-xl">☁️</span><span class="text-[10px] font-bold">Погода</span></button>
      <button onclick="switchTab('air')" id="nav-air" class="nav-btn py-2 text-slate-400 flex flex-col items-center gap-1"><span class="text-xl">🫁</span><span class="text-[10px] font-bold">Воздух</span></button>
      <button onclick="switchTab('geomagnetic')" id="nav-geomagnetic" class="nav-btn py-2 text-slate-400 flex flex-col items-center gap-1"><span class="text-xl">⚡</span><span class="text-[10px] font-bold">Магнитные</span></button>
      <button onclick="switchTab('earthquakes')" id="nav-earthquakes" class="nav-btn py-2 text-slate-400 flex flex-col items-center gap-1"><span class="text-xl">🌋</span><span class="text-[10px] font-bold">Сейсмо</span></button>
      <button onclick="switchTab('moon')" id="nav-moon" class="nav-btn py-2 text-slate-400 flex flex-col items-center gap-1"><span class="text-xl">🌙</span><span class="text-[10px] font-bold">Луна</span></button>
    </div>
  </nav>

  <script>
    const LOCATIONS = {
      varna: { id: "varna", name: "Варна", country: "Болгария", lat: 43.2141, lon: 27.9147 },
      odesa: { id: "odesa", name: "Одесса", country: "Украина", lat: 46.4825, lon: 30.7233 }
    };

    let currentCity = 'varna';
    let currentTab = 'weather';
    let appData = { weather: null, air: null, eq: null, kp: null };

    // Robust Fetchers with Hard Fallbacks
    async function fetchWeather(loc) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`);
        if (!res.ok) throw new Error();
        return await res.json();
      } catch(e) {
        return {
          current: { temperature_2m: 22, apparent_temperature: 23, relative_humidity_2m: 60, pressure_msl: 1015, wind_speed_10m: 12, weather_code: 0 },
          daily: { time: [new Date().toISOString()], temperature_2m_max: [25], temperature_2m_min: [15], weather_code: [0], uv_index_max: [5] }
        };
      }
    }

    async function fetchAir(loc) {
      try {
        const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&current=european_aqi,pm10,pm2_5`);
        if (!res.ok) throw new Error();
        return await res.json();
      } catch(e) { return { current: { european_aqi: 25, pm2_5: 10, pm10: 15 } }; }
    }

    async function fetchEQ(loc) {
      try {
        const res = await fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=5&minmagnitude=2.5`);
        const data = await res.json();
        return data.features.map(f => ({
          title: f.properties.place,
          mag: f.properties.mag,
          time: new Date(f.properties.time).toLocaleString('ru-RU')
        }));
      } catch(e) { return [{title: "Вранча, Румыния", mag: 3.2, time: "Недавно"}]; }
    }

    async function fetchKp() {
      try {
        const res = await fetch(`https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json`);
        const data = await res.json();
        const last = data[data.length-1];
        return parseFloat(last[1]) || 2.3;
      } catch(e) { return 2.0; }
    }

    function parseWmo(code) {
      const map = { 0: {t:"Ясно", i:"☀️"}, 1: {t:"Малооблачно", i:"🌤️"}, 2: {t:"Облачно", i:"⛅"}, 3: {t:"Пасмурно", i:"☁️"}, 61: {t:"Дождь", i:"🌧️"}, 95: {t:"Гроза", i:"⛈️"} };
      return map[code] || {t:"Переменная облачность", i:"⛅"};
    }

    async function loadAllData() {
      const loc = LOCATIONS[currentCity];
      document.getElementById('last-update-time').innerText = 'Загрузка...';
      
      try {
        const [w, a, eq, kp] = await Promise.all([ fetchWeather(loc), fetchAir(loc), fetchEQ(loc), fetchKp() ]);
        appData = { weather: w, air: a, eq: eq, kp: kp };
        document.getElementById('last-update-time').innerText = `Обновлено: ${new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`;
        renderCurrentTab();
      } catch(e) {
        document.getElementById('last-update-time').innerText = 'Ошибка соединения';
      }
    }

    function switchLocation(city) {
      if (currentCity === city) return;
      currentCity = city;
      document.getElementById('btn-varna').className = city === 'varna' ? "flex-1 px-6 py-2 rounded-lg text-sm font-bold bg-brand-gold text-black transition-all" : "flex-1 px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all";
      document.getElementById('btn-odesa').className = city === 'odesa' ? "flex-1 px-6 py-2 rounded-lg text-sm font-bold bg-brand-gold text-black transition-all" : "flex-1 px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all";
      loadAllData();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-gold');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`nav-${tab}`).classList.remove('text-slate-400');
      document.getElementById(`nav-${tab}`).classList.add('text-brand-gold');
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const mc = document.getElementById('main-content');
      if (!appData.weather) { mc.innerHTML = 'Загрузка...'; return; }

      if (currentTab === 'weather') {
        const curr = appData.weather.current;
        const wInfo = parseWmo(curr.weather_code);
        mc.innerHTML = `
          <div class="glass-panel p-6 rounded-2xl border border-brand-gold/30 mb-4">
            <h2 class="text-xs font-bold text-brand-gold uppercase tracking-widest mb-4">${LOCATIONS[currentCity].name}, ${LOCATIONS[currentCity].country}</h2>
            <div class="flex items-center justify-between mb-6">
              <div>
                <div class="text-6xl font-extrabold text-white mb-2">${Math.round(curr.temperature_2m)}°C</div>
                <div class="text-lg font-bold">${wInfo.t}</div>
                <div class="text-sm text-slate-400">Ощущается как ${Math.round(curr.apparent_temperature)}°C</div>
              </div>
              <div class="text-7xl drop-shadow-xl">${wInfo.i}</div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-4 border-t border-slate-800">
              <div class="glass-card p-3 rounded-xl"><div class="text-xs text-slate-400">Ветер</div><div class="font-bold">${curr.wind_speed_10m} км/ч</div></div>
              <div class="glass-card p-3 rounded-xl"><div class="text-xs text-slate-400">Влажность</div><div class="font-bold">${curr.relative_humidity_2m}%</div></div>
              <div class="glass-card p-3 rounded-xl"><div class="text-xs text-slate-400">Давление</div><div class="font-bold">${Math.round(curr.pressure_msl)} hPa</div></div>
              <div class="glass-card p-3 rounded-xl"><div class="text-xs text-slate-400">UV Индекс</div><div class="font-bold">${appData.weather.daily.uv_index_max[0] || 5}</div></div>
            </div>
          </div>
        `;
      } 
      else if (currentTab === 'air') {
        mc.innerHTML = `
          <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold mb-4">Качество воздуха (EAQI)</h2>
            <div class="bg-emerald-900/30 border border-emerald-500/30 p-6 rounded-xl flex items-center justify-between">
              <div>
                <div class="text-5xl font-extrabold text-emerald-400 mb-2">${appData.air.current.european_aqi}</div>
                <div class="text-sm text-slate-300">Воздух чистый, безопасен для всех.</div>
              </div>
              <div class="text-5xl">🫁</div>
            </div>
          </div>`;
      }
      else if (currentTab === 'geomagnetic') {
        let color = appData.kp >= 5 ? 'text-rose-400' : (appData.kp >= 4 ? 'text-amber-400' : 'text-emerald-400');
        mc.innerHTML = `
          <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold mb-4">Геомагнитная обстановка</h2>
            <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-xl text-center">
              <div class="text-sm text-slate-400 mb-2">Текущий Kp-индекс (NOAA)</div>
              <div class="text-6xl font-extrabold ${color} mb-4">Kp ${appData.kp.toFixed(1)}</div>
              <div class="text-sm">${appData.kp >= 5 ? 'Магнитная буря!' : 'Спокойная обстановка, бурь нет.'}</div>
            </div>
          </div>`;
      }
      else if (currentTab === 'earthquakes') {
        let list = appData.eq.map(e => `<div class="p-3 bg-slate-900/50 rounded-lg mb-2 border border-slate-800 flex justify-between items-center"><div class="text-sm font-bold">${e.title}<div class="text-xs text-slate-400">${e.time}</div></div><div class="px-2 py-1 bg-amber-500/20 text-amber-400 rounded font-bold">M ${e.mag}</div></div>`).join('');
        mc.innerHTML = `<div class="glass-panel p-6 rounded-2xl"><h2 class="text-lg font-bold mb-4">Сейсмическая активность (USGS)</h2>${list}</div>`;
      }
      else if (currentTab === 'moon') {
        mc.innerHTML = `<div class="glass-panel p-6 rounded-2xl text-center"><h2 class="text-lg font-bold mb-4">Лунный календарь</h2><div class="text-8xl my-6">🌔</div><div class="text-xl font-bold text-brand-gold">Растущая Луна</div></div>`;
      }
    }

    window.onload = loadAllData;
  </script>
</body>
</html>
```
