<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>AURA GEO METEO</title>

<style>
:root{
--bg:#090b10;
--surface:#10141b;
--surface2:#151a22;
--line:#29313d;
--text:#f7f8fb;
--muted:#9da7b6;
--gold:#e7ca72;
--blue:#79aaff;
--green:#65d58a;
--orange:#ffb45e;
--red:#ff7373
}

*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
-webkit-text-size-adjust:100%
}

button,a{
font:inherit
}

button{
border:0;
cursor:pointer
}

.app{
width:100%;
height:100dvh;
padding:env(safe-area-inset-top) 16px calc(70px + env(safe-area-inset-bottom));
overflow:hidden
}

/* ---------- TOP ---------- */

.top{
height:74px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid var(--line)
}

.logo{
font-size:28px;
line-height:1;
font-weight:900;
letter-spacing:-1.3px;
white-space:nowrap
}

.logo .gold{
color:var(--gold)
}

.updated{
margin-top:5px;
color:var(--muted);
font-size:12px
}

.city-switch{
display:flex;
gap:5px;
padding:4px;
border:1px solid var(--line);
border-radius:999px;
background:#0e1218
}

.city-btn{
background:transparent;
color:var(--muted);
padding:7px 11px;
border-radius:999px;
font-size:13px;
font-weight:800
}

.city-btn.active{
background:var(--gold);
color:#111318
}

/* ---------- MAIN ---------- */

.screen{
height:calc(
100dvh -
74px -
70px -
env(safe-area-inset-top) -
env(safe-area-inset-bottom)
);
padding-top:8px;
min-height:0
}

.page{
display:none;
width:100%;
height:100%;
min-height:0;
overflow:hidden
}

.page.active{
display:block
}

/* ---------- WEATHER ---------- */

.weather-page{
height:100%;
display:flex;
flex-direction:column;
overflow:hidden
}

.weather-current{
height:142px;
flex:0 0 142px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--line)
}

.temperature{
font-size:68px;
line-height:.9;
font-weight:900;
letter-spacing:-4px
}

.condition{
margin-top:9px;
font-size:23px;
font-weight:850
}

.feels{
margin-top:5px;
color:var(--muted);
font-size:16px
}

.current-meta{
text-align:right;
color:#c1c8d3;
font-size:15px;
line-height:1.85
}

.current-meta b{
color:var(--text);
font-weight:750
}

/* ---------- QUICK DATA ---------- */

.quick{
height:70px;
flex:0 0 70px;
display:grid;
grid-template-columns:repeat(4,1fr);
border-bottom:1px solid var(--line)
}

.quick-item{
display:flex;
flex-direction:column;
justify-content:center;
padding-left:10px;
border-left:1px solid var(--line)
}

.quick-item:first-child{
border-left:0;
padding-left:0
}

.quick-label{
color:var(--muted);
font-size:12px
}

.quick-value{
margin-top:4px;
font-size:18px;
font-weight:850;
white-space:nowrap
}

/* ---------- 7 DAYS ---------- */

.forecast-head{
height:36px;
flex:0 0 36px;
display:flex;
align-items:end;
color:var(--muted);
font-size:13px;
font-weight:850;
letter-spacing:.09em;
text-transform:uppercase
}

.forecast{
flex:1;
min-height:0;
display:grid;
grid-template-rows:repeat(7,minmax(0,1fr))
}

.day{
width:100%;
min-height:0;
display:grid;
grid-template-columns:78px 40px 1fr 82px 58px;
align-items:center;
background:transparent;
color:var(--text);
text-align:left;
border-bottom:1px solid #222a35;
padding:0 2px
}

.day:last-child{
border-bottom:0
}

.day.active{
background:linear-gradient(
90deg,
rgba(231,202,114,.10),
transparent
);
border-radius:9px
}

.day-name{
font-size:16px;
font-weight:850
}

.day-date{
margin-top:2px;
color:var(--muted);
font-size:12px
}

.day-icon{
font-size:25px;
text-align:center
}

.day-temp{
text-align:right;
font-size:16px;
font-weight:850;
white-space:nowrap
}

.day-rain{
text-align:right;
color:var(--blue);
font-size:13px;
white-space:nowrap
}

/* ---------- BOTTOM NAV ---------- */

.nav{
position:fixed;
z-index:20;
left:0;
bottom:0;
width:100%;
height:calc(65px + env(safe-area-inset-bottom));
padding:4px 8px env(safe-area-inset-bottom);
background:rgba(9,11,16,.98);
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(5,1fr)
}

.nav button{
background:transparent;
color:#8e98a7;
font-size:12px;
font-weight:750;
padding:2px 0
}

.nav-icon{
display:block;
font-size:22px;
line-height:23px;
margin-bottom:2px
}

.nav button.active{
color:var(--gold)
}

/* ---------- OTHER PAGES ---------- */

.simple-page{
height:100%;
border-top:1px solid var(--line);
padding-top:4px;
overflow:hidden
}

.page-title{
height:42px;
display:flex;
align-items:center;
justify-content:space-between;
font-size:22px;
font-weight:900
}

.action{
background:transparent;
color:var(--blue);
font-size:14px;
font-weight:800
}

/* ---------- AIR ---------- */

.big-row{
display:flex;
align-items:center;
gap:20px;
padding:12px 0 16px;
border-bottom:1px solid var(--line)
}

.big-number{
font-size:62px;
font-weight:900;
line-height:.9
}

.big-label{
font-size:23px;
font-weight:900
}

.sub{
margin-top:5px;
color:var(--muted);
font-size:14px
}

.good{
color:var(--green)
}

.warn{
color:var(--orange)
}

.bad{
color:var(--red)
}

.pollutants{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:0;
border-bottom:1px solid var(--line);
padding:13px 0
}

.pollutant{
background:transparent;
color:var(--text);
text-align:left;
border-left:1px solid var(--line);
padding:0 8px
}

.pollutant:first-child{
border-left:0;
padding-left:0
}

.pollutant b{
font-size:16px
}

.pollutant span{
display:block;
margin-top:3px;
color:var(--muted);
font-size:11px
}

.clean-list{
display:grid;
gap:0
}

.clean-row{
min-height:46px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #222a35;
font-size:15px
}

.clean-row b{
font-size:16px
}

/* ---------- MAGNETIC ---------- */

.kp-row{
height:125px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.kp{
font-size:72px;
font-weight:900;
line-height:.9
}

.kp-status{
text-align:right
}

.kp-status strong{
font-size:23px
}

.kp-status span{
display:block;
margin-top:5px;
color:var(--muted);
font-size:14px
}

.kp-list{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:0
}

.kp-item{
text-align:center;
padding:14px 3px;
border-left:1px solid var(--line)
}

.kp-item:first-child{
border-left:0
}

.kp-item time{
display:block;
color:var(--muted);
font-size:11px
}

.kp-item b{
display:block;
margin-top:5px;
font-size:17px
}

.warning{
margin-top:12px;
padding:10px 0;
color:#ffd1d1;
font-size:14px;
border-top:1px solid rgba(255,115,115,.35);
border-bottom:1px solid rgba(255,115,115,.35)
}

/* ---------- EARTHQUAKES ---------- */

.quake-top{
display:flex;
align-items:center;
gap:16px;
height:100px;
border-bottom:1px solid var(--line)
}

.quake-count{
font-size:62px;
font-weight:900
}

.quake-list{
display:grid
}

.quake{
height:49px;
background:transparent;
color:var(--text);
border-bottom:1px solid #222a35;
display:grid;
grid-template-columns:1fr 52px 65px;
align-items:center;
text-align:left;
padding:0
}

.quake-place{
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.quake b{
text-align:right;
font-size:16px
}

.quake small{
text-align:right;
color:var(--muted);
font-size:11px
}

/* ---------- MOON ---------- */

.moon{
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.moon-icon{
font-size:100px
}

.moon-name{
margin-top:15px;
font-size:29px;
font-weight:900
}

.moon-data{
margin-top:8px;
color:var(--muted);
font-size:16px;
line-height:1.65
}

/* ---------- MODAL ---------- */

.modal{
position:fixed;
z-index:50;
inset:0;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
padding:12px
}

.modal.show{
display:flex
}

.sheet{
width:100%;
max-width:600px;
background:#10151d;
border:1px solid #354050;
border-radius:24px;
padding:15px
}

.sheet-head{
height:45px;
display:flex;
align-items:center;
justify-content:space-between
}

.sheet h2{
margin:0;
font-size:25px
}

.close{
width:40px;
height:40px;
border-radius:50%;
background:#202733;
color:white;
font-size:27px
}

.detail-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:0;
border-top:1px solid var(--line);
border-left:1px solid var(--line)
}

.detail{
padding:10px;
border-right:1px solid var(--line);
border-bottom:1px solid var(--line)
}

.detail small{
display:block;
color:var(--muted);
font-size:13px
}

.detail b{
display:block;
margin-top:3px;
font-size:18px
}

/* ---------- INTERACTIVE CHART ---------- */

.chart-title{
margin:12px 0 7px;
color:var(--muted);
font-size:13px;
font-weight:850;
text-transform:uppercase;
letter-spacing:.08em
}

.chart-wrap{
position:relative;
width:100%
}

.temp-chart{
display:block;
width:100%;
height:220px;
background:#121922;
border-radius:18px;
border:1px solid #293443;
touch-action:none
}

.chart-readout{
margin-top:8px;
padding:10px 12px;
background:#151c25;
border-radius:14px;
font-size:14px;
line-height:1.45
}

.chart-readout strong{
font-size:19px;
color:var(--gold)
}

.chart-range{
width:100%;
height:30px;
margin:2px 0 0;
accent-color:var(--gold);
touch-action:pan-x
}

.chart-help{
text-align:center;
color:var(--muted);
font-size:12px;
margin-top:2px
}

/* ---------- MOBILE ---------- */

@media(max-width:430px){

.app{
padding-left:14px;
padding-right:14px
}

.top{
height:68px
}

.logo{
font-size:25px
}

.city-btn{
font-size:12px;
padding:7px 9px
}

.screen{
height:calc(
100dvh -
68px -
70px -
env(safe-area-inset-top) -
env(safe-area-inset-bottom)
)
}

.weather-current{
height:128px;
flex-basis:128px
}

.temperature{
font-size:61px
}

.condition{
font-size:21px
}

.feels{
font-size:15px
}

.current-meta{
font-size:14px;
line-height:1.8
}

.quick{
height:66px;
flex-basis:66px
}

.quick-label{
font-size:11px
}

.quick-value{
font-size:16px
}

.forecast-head{
height:34px;
flex-basis:34px;
font-size:12px
}

.day{
grid-template-columns:69px 36px 1fr 76px 50px
}

.day-name{
font-size:15px
}

.day-date{
font-size:11px
}

.day-icon{
font-size:23px
}

.day-temp{
font-size:15px
}

.day-rain{
font-size:12px
}

.page-title{
font-size:21px
}

.big-number{
font-size:57px
}

.big-label{
font-size:21px
}

.pollutant b{
font-size:14px
}

.pollutant span{
font-size:9px
}

.kp{
font-size:62px
}

.kp-status strong{
font-size:20px
}

.quake-count{
font-size:56px
}

.moon-icon{
font-size:82px
}

.moon-name{
font-size:26px
}

.sheet{
padding:13px;
border-radius:21px
}

.sheet h2{
font-size:23px
}

.detail{
padding:8px
}

.detail small{
font-size:12px
}

.detail b{
font-size:16px
}

.temp-chart{
height:205px
}

.chart-readout{
font-size:13px
}

.chart-readout strong{
font-size:18px
}
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div>
<div class="logo">
AURA <span class="gold">GEO METEO</span>
</div>

<div id="status" class="updated">
Обновление...
</div>
</div>

<div class="city-switch">

<button class="city-btn active" data-city="varna">
ВАРНА
</button>

<button class="city-btn" data-city="odesa">
ОДЕССА
</button>

</div>

</header>


<main class="screen">

<!-- WEATHER -->

<section class="page active" id="page-weather">

<div class="weather-page">

<div class="weather-current" id="weather-current">
Загрузка...
</div>

<div class="quick" id="quick">
</div>

<div class="forecast-head">
7 дней · выберите день
</div>

<div class="forecast" id="forecast">
</div>

</div>

</section>


<!-- AIR -->

<section class="page" id="page-air">

<div class="simple-page">

<div class="page-title">
Воздух
<button class="action" onclick="openAirGuide()">
Шкала AQI
</button>
</div>

<div id="air">
Загрузка...
</div>

</div>

</section>


<!-- MAGNETIC -->

<section class="page" id="page-magnetic">

<div class="simple-page">

<div class="page-title">
Магнитные бури
<button class="action" onclick="openKpGuide()">
Шкала Kp
</button>
</div>

<div id="magnetic">
Загрузка...
</div>

</div>

</section>


<!-- EARTHQUAKES -->

<section class="page" id="page-seismo">

<div class="simple-page">

<div class="page-title">
Землетрясения
<button class="action" onclick="loadQuakes()">
Обновить
</button>
</div>

<div id="seismo">
Загрузка...
</div>

</div>

</section>


<!-- MOON -->

<section class="page" id="page-moon">

<div class="simple-page">

<div class="moon" id="moon">
Загрузка...
</div>

</div>

</section>

</main>

</div>


<!-- NAVIGATION -->

<nav class="nav">

<button class="active" data-page="weather">
<span class="nav-icon">☁</span>
Погода
</button>

<button data-page="air">
<span class="nav-icon">◉</span>
Воздух
</button>

<button data-page="magnetic">
<span class="nav-icon">⚡</span>
Магнитные
</button>

<button data-page="seismo">
<span class="nav-icon">⌁</span>
Сейсмо
</button>

<button data-page="moon">
<span class="nav-icon">☾</span>
Луна
</button>

</nav>


<!-- MODAL -->

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

<div class="sheet">

<div class="sheet-head">

<h2 id="modalTitle">
Подробно
</h2>

<button class="close" onclick="closeModal()">
×
</button>

</div>

<div id="modalBody">
</div>

</div>

</div>


<script>
"use strict";


/* =========================
   CITIES
========================= */

const CITIES={
varna:{
name:"Варна",
country:"Болгария",
lat:43.21,
lon:27.91
},

odesa:{
name:"Одесса",
country:"Украина",
lat:46.48,
lon:30.72
}
};


/* =========================
   STATE
========================= */

const state={
city:"varna",
weather:null,
air:null,
kp:null,
kpForecast:null,
quakes:[]
};


/* =========================
   WEATHER CODES
========================= */

const WMO={

0:["Ясно","☀"],
1:["Преимущественно ясно","🌤"],
2:["Переменная облачность","⛅"],
3:["Пасмурно","☁"],

45:["Туман","🌫"],
48:["Изморозь/туман","🌫"],

51:["Морось","🌦"],
53:["Морось","🌦"],
55:["Сильная морось","🌧"],

56:["Ледяная морось","🌧"],
57:["Ледяная морось","🌧"],

61:["Небольшой дождь","🌦"],
63:["Дождь","🌧"],
65:["Сильный дождь","🌧"],

66:["Ледяной дождь","🌧"],
67:["Сильный ледяной дождь","🌧"],

71:["Небольшой снег","🌨"],
73:["Снег","🌨"],
75:["Сильный снег","❄"],
77:["Снежные зерна","❄"],

80:["Ливни","🌦"],
81:["Сильные ливни","🌧"],
82:["Очень сильные ливни","⛈"],

85:["Снегопад","🌨"],
86:["Сильный снегопад","❄"],

95:["Гроза","⛈"],
96:["Гроза с градом","⛈"],
99:["Сильная гроза с градом","⛈"]

};


/* =========================
   AIR
========================= */

const AQI_BANDS=[

{
max:20,
label:"Хорошо",
cls:"good"
},

{
max:40,
label:"Удовлетворительно",
cls:"good"
},

{
max:60,
label:"Умеренно",
cls:"warn"
},

{
max:80,
label:"Плохо",
cls:"warn"
},

{
max:100,
label:"Очень плохо",
cls:"bad"
},

{
max:Infinity,
label:"Крайне плохо",
cls:"bad"
}

];


const POLLUTANTS={

pm2_5:{
label:"PM2.5",
unit:"µg/m³"
},

pm10:{
label:"PM10",
unit:"µg/m³"
},

nitrogen_dioxide:{
label:"NO₂",
unit:"µg/m³"
},

ozone:{
label:"O₃",
unit:"µg/m³"
},

sulphur_dioxide:{
label:"SO₂",
unit:"µg/m³"
}

};


/* =========================
   HELPERS
========================= */

function city(){
return CITIES[state.city];
}


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"

}[m]));

}


function num(v,d=0){

const n=Number(v);

return Number.isFinite(n)
?n.toFixed(d)
:"—";

}


function weatherInfo(code){

return WMO[code]||[
"Неизвестно",
"•"
];

}


function formatTime(iso){

const m=
String(iso??"")
.match(/T(\d{2}):(\d{2})/);

return m
?m[1]+":"+m[2]
:"—";

}


function formatDate(iso){

return iso
?new Date(
iso+"T12:00:00"
).toLocaleDateString(
"ru-RU",
{
day:"2-digit",
month:"2-digit"
}
)
:"—";

}


function dayName(iso){

return new Date(
iso+"T12:00:00"
)
.toLocaleDateString(
"ru-RU",
{
weekday:"short"
}
)
.replace(".","");

}


function setStatus(t){

document.getElementById(
"status"
).textContent=t;

}


/* =========================
   API
========================= */

async function getJSON(url){

const r=
await fetch(
url,
{
cache:"no-store"
}
);

if(!r.ok){

throw new Error(
"HTTP "+r.status
);

}

return r.json();

}


/* =========================
   WEATHER URL
========================= */

function weatherURL(c){

const p=new URLSearchParams({

latitude:c.lat,

longitude:c.lon,

timezone:"auto",

forecast_days:"7",

current:
"temperature_2m,"+
"relative_humidity_2m,"+
"apparent_temperature,"+
"weather_code,"+
"pressure_msl,"+
"wind_speed_10m,"+
"wind_gusts_10m,"+
"is_day",

hourly:
"temperature_2m,"+
"apparent_temperature,"+
"precipitation_probability,"+
"precipitation,"+
"rain,"+
"snowfall,"+
"weather_code,"+

/* =========================
   KP
========================= */

function parseKpRows(data){

if(!Array.isArray(data))
return [];

return data
.map(row=>{

let time=null;
let kp=null;
let observed=null;
let scale=null;

if(Array.isArray(row)){

time=row[0];
kp=Number(row[1]);
observed=row[2];
scale=row[3];

}

else if(
row &&
typeof row==="object"
){

time=
row.time_tag ??
row.observation_time ??
row.time ??
row.valid_time ??
null;

kp=
Number(
row.kp ??
row.kp_index ??
row.planetary_k_index ??
row.Kp
);

observed=row.observed;

scale=
row.noaa_scale ??
row.scale ??
null;

}

return(
time &&
Number.isFinite(kp)
)
?
{
time,
kp,
observed,
scale
}
:null;

})
.filter(Boolean)
.sort(
(a,b)=>
new Date(a.time)-
new Date(b.time)
);

}

try{

const[
current,
forecast
]=await Promise.all([

getJSON(
"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"

getJSON(
"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"
)

]);

state.kp=
parseKpRows(current);

state.kpForecast=

renderMagnetic();

}catch(e){

document.getElementById(
"magnetic"
).innerHTML=
'<div class="sub">Данные NOAA недоступны.</div>';

function kpLevel(kp){

if(kp>=9)
return[
"G5",
"Экстремальная буря",
"bad"
];

if(kp>=8)
return[
"G4",
"Очень сильная буря",
"bad"
];

if(kp>=7)
return[
"G3",
"Сильная буря",
"bad"
];

if(kp>=6)
return[
"G2",
"Умеренная буря",
"warn"
];

if(kp>=5)

"warn"
];

if(kp>=4)
return[

"Возмущённая обстановка",
"warn"
];

return[
"Kp 0–3",
"Спокойная обстановка",
"good"
];

}

/* =========================
   BUILD INTERACTIVE CHART
========================= */

function buildChart(h,rows){

const pts=

rows
.map(j=>({

temp:Number(
h.temperature_2m?.[j]
),

feels:Number(
h.apparent_temperature?.[j]
),

time:
formatTime(
h.time?.[j]
),

rain:Number(
h.precipitation_probability?.[j] ??
0
),

precip:Number(
h.precipitation?.[j] ??
0
),

wind:Number(
h.wind_speed_10m?.[j] ??
0
),

gust:Number(
h.wind_gusts_10m?.[j] ??
0
),

code:Number(
h.weather_code?.[j] ??
-1
)

}))
.filter(
p=>Number.isFinite(p.temp)
);


if(!pts.length){

return(
'<div class="sub">'+
'Почасовые данные недоступны.'+
'</div>'
);

}


/* GRAPH COORDINATES */

const W=720;
const H=300;

const L=52;
const R=18;
const T=28;
const B=42;

const PW=W-L-R;
const PH=H-T-B;

const minT=
Math.floor(
Math.min(
...pts.map(p=>p.temp)
)-1
);

const maxT=
Math.ceil(
Math.max(
...pts.map(p=>p.temp)
)+1
);

const tempRange=
Math.max(
1,
maxT-minT
);


const x=i=>

L+
(
pts.length===1
?
PW/2
:
i*PW/(pts.length-1)
);


const y=t=>

T+
(
maxT-t
)*
PH/
tempRange;


/* TEMPERATURE PATH */

const path=

pts
.map(
(p,i)=>

(i?"L":"M")+
x(i).toFixed(1)+
" "+
y(p.temp).toFixed(1)

)
.join(" ");


/* AREA */

const area=

path+
" L "+
x(pts.length-1)+
" "+
(H-B)+

" L "+
x(0)+
" "+
(H-B)+

" Z";


/* GRID */

const mid=
Math.round(
(minT+maxT)/2
);


const grid=

[
maxT,
mid,
minT
]
.map(
t=>

'<line '+
'x1="'+L+'" '+
'y1="'+y(t)+'" '+
'x2="'+(W-R)+'" '+
'y2="'+y(t)+'" '+
'stroke="#293443"/>'+

'<text '+
'x="'+(L-8)+'" '+
'y="'+(y(t)+5)+'" '+
'text-anchor="end" '+
'fill="#d5dce6" '+
'font-size="16">'+
t+
'°'+
'</text>'

)
.join("");


/* TIME LABELS */

const every=
pts.length>18
?
4
:
pts.length>10
?
2
:
1;


const labels=

pts
.map(
(p,i)=>

(
i%every===0 ||
i===pts.length-1
)

?

'<text '+
'x="'+x(i)+'" '+
'y="'+(H-14)+'" '+
'text-anchor="middle" '+
'fill="#c8d0db" '+
'font-size="14">'+
p.time+
'</text>'

:""

)
.join("");


/* POINTS */

const dots=

pts
.map(
(p,i)=>

'<circle '+
'class="chart-dot" '+
'data-i="'+i+'" '+
'cx="'+x(i)+'" '+
'cy="'+y(p.temp)+'" '+
'r="5" '+
'fill="#e7ca72" '+
'stroke="#0f141b" '+
'stroke-width="3"/>'+

''
)
.join("");


const uid=
"g"+
Date.now();


/* COMPLETE SVG */

return

'<div '+
'class="chart-wrap" '+
'data-points="'+
encodeURIComponent(
JSON.stringify(pts)
)+
'" '+
'data-l="'+L+'" '+
'data-r="'+R+'" '+
'data-w="'+W+'">'+


'<svg '+
'class="temp-chart" '+
'viewBox="0 0 '+W+' '+H+'" '+
'preserveAspectRatio="none" '+
'aria-label="Интерактивный график температуры">'+


'<defs>'+

'<linearGradient '+
'id="'+uid+'" '+
'x1="0" y1="0" '+
'x2="0" y2="1">'+

'<stop '+
'offset="0%" '+
'stop-color="#e7ca72" '+
'stop-opacity=".25"/>'+

'<stop '+
'offset="100%" '+
'stop-color="#e7ca72" '+
'stop-opacity="0"/>'+

'</linearGradient>'+

'</defs>'+


grid+


'<path '+
'd="'+area+'" '+
'fill="url(#'+uid+')"/>'+


'<path '+
'd="'+path+'" '+
'fill="none" '+
'stroke="#e7ca72" '+
'stroke-width="4" '+
'stroke-linecap="round" '+
'stroke-linejoin="round"/>'+


dots+
labels+


'<line '+
'class="chart-marker" '+
'x1="'+x(0)+'" '+
'y1="'+T+'" '+
'x2="'+x(0)+'" '+
'y2="'+(H-B)+'" '+
'stroke="#ffffff" '+
'stroke-width="2" '+
'opacity=".8"/>'+


'</svg>'+


'<input '+
'class="chart-range" '+
'type="range" '+
'min="0" '+
'max="'+(pts.length-1)+'" '+
'value="0" '+
'step="1" '+
'aria-label="Выбор часа">'+


'<div class="chart-readout"></div>'+


'<div class="chart-help">'+
'Нажимай на график или двигай ползунок'+
'</div>'+


'</div>';

}


/* =========================
   BIND INTERACTIVE CHART
========================= */

function bindChart(){

document
.querySelectorAll(
".chart-wrap"
)
.forEach(
w=>{

if(w.dataset.bound)
return;

w.dataset.bound="1";


const pts=

JSON.parse(
decodeURIComponent(
w.dataset.points
)
);


const svg=
w.querySelector("svg");


const range=
w.querySelector(
".chart-range"
);


const read=
w.querySelector(
".chart-readout"
);


const marker=
w.querySelector(
".chart-marker"
);


const W=
Number(
w.dataset.w
);

const L=
Number(
w.dataset.l
);

const R=
Number(
w.dataset.r
);


/* SELECT HOUR */

const show=i=>{

i=
Math.max(
0,
Math.min(
pts.length-1,
Number(i)
)
);


const p=
pts[i];


const left=

L+
(
pts.length===1
?
(W-L-R)/2
:
i*
(W-L-R)/
(pts.length-1)
);


range.value=i;


/* MOVE MARKER */

marker.setAttribute(
"x1",
left
);

marker.setAttribute(
"x2",
left
);


/* SELECTED DOT */

w
.querySelectorAll(
".chart-dot"
)
.forEach(
(d,n)=>

d.setAttribute(
"r",
n===i
?
9
:
5
)
);


/* LIVE DATA */

read.innerHTML=

'<strong>'+
esc(p.time)+
' · '+
num(p.temp)+
'°C</strong><br>'+

'Ощущается '+
num(p.feels)+
'°C · '+

'осадки '+
num(p.rain)+
'% ('+
num(p.precip,1)+
' мм)<br>'+

'Ветер '+
num(p.wind)+
' км/ч · '+

'порывы '+
num(p.gust)+
' км/ч · '+

weatherInfo(p.code)[0];

};


/* SLIDER */

range.addEventListener(
"input",
()=>{

show(
range.value
);

}
);


/* TOUCH / MOUSE */

const pick=e=>{

const r=
svg.getBoundingClientRect();


const px=
e.clientX-
r.left;


const ratio=
Math.max(
0,
Math.min(
1,
px/r.width
)
);


const i=
Math.round(
ratio*
(pts.length-1)
);


show(i);

};


/* TOUCH */

svg.addEventListener(
"pointerdown",
e=>{

svg.setPointerCapture?.(
e.pointerId
);

pick(e);

}
);


/* DRAG */

svg.addEventListener(
"pointermove",
e=>{

if(e.buttons)
pick(e);

}
);


/* DIRECT POINT TAP */

w
.querySelectorAll(
".chart-dot"
)
.forEach(
d=>

d.addEventListener(
"click",
()=>{

show(
d.dataset.i
);

}
)
);


/* INITIAL */

show(0);

}
);

}

/* =========================
   EARTHQUAKES
========================= */

function distanceKm(
a,
b,
c,
d
){

const R=6371;

const r=
Math.PI/180;

const p1=
a*r;

const p2=
c*r;

const dp=
(c-a)*r;

const dl=
(d-b)*r;

const x=

Math.sin(dp/2)**2+

Math.cos(p1)*
Math.cos(p2)*
Math.sin(dl/2)**2;

return(
2*
R*
Math.asin(
Math.sqrt(x)
)
);

}


async function loadQuakes(){

try{

const data=
await getJSON(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
);

const c=
city();


state.quakes=

(data.features||[])

.map(
f=>{

const[
lon,
lat,
depth
]=
f.geometry.coordinates;

return{

mag:
Number(
f.properties.mag
),

place:
f.properties.place||
"Неизвестно",

time:
f.properties.time,

depth,

distance:
distanceKm(
c.lat,
c.lon,
lat,
lon
)

};

}
)

.filter(
q=>
Number.isFinite(q.mag)&&
q.distance<=500
)

.sort(
(a,b)=>
b.time-a.time
)

.slice(
0,
8
);


renderEarthquakes();

}

catch(e){

document.getElementById(
"seismo"
).innerHTML=
'<div class="sub">Данные USGS недоступны.</div>';

}

}

/* =========================
   MOON
========================= */

function calculateMoon(
date=new Date()
){

const syn=
29.530588853;

const known=
new Date(
Date.UTC(
2000,
0,
6,
18,
14
)
);

const age=
(
(date-known)/
86400000
)
%
syn;

const a=
(age+syn)%
syn;

const p=
a/syn;

let name;
let icon;


if(a<1.85){

name="Новолуние";
icon="🌑";

}

else if(a<7.38){

name="Растущий серп";
icon="🌒";

}

else if(a<9.22){

name="Первая четверть";
icon="🌓";

}

else if(a<14.76){

name="Растущая Луна";
icon="🌔";

}

else if(a<16.61){

name="Полнолуние";
icon="🌕";

}

else if(a<22.15){

name="Убывающая Луна";
icon="🌖";

}

else if(a<23.99){

name="Последняя четверть";
icon="🌗";

}

else{

name="Убывающий серп";
icon="🌘";

}


return{

name,
icon,
age:a,

illumination:
.5*
(
1-
Math.cos(
2*
Math.PI*
p
)
)*
100

};

}

   MOON RENDER
========================= */

function renderMoon(){

const m=

document.getElementById(

'Освещённость: '+

'%<br>'+

city().name+

'</div>';

}

return;

refreshing=true;

setStatus(
"Обновление..."
);


await Promise.allSettled([

loadWeather(),

loadAir(),

loadKp(),

loadQuakes()

]);


renderMoon();


setStatus(

"Обновлено "+
new Date()
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
)

);


refreshing=false;

}


/* =========================

========================= */

function openPage(page){

document
.querySelectorAll(".page")
.forEach(
p=>
p.classList.remove(
"active"
)
);


document
.getElementById(
"page-"+page
)
.classList.add(
"active"
);


document
.querySelectorAll(
".nav button"
)
.forEach(
b=>
b.classList.toggle(
"active",
b.dataset.page===page
)
);


closeModal();

}

========================= */

)

b=>

"click",
()=>openPage(

)
)

);

".city-btn"
)
.forEach(

);
