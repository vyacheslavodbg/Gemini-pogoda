<script>

/* =========================================================
   ГОРОДА
========================================================= */

const CITIES = {

  varna: {
    name: "Варна",
    country: "Болгария",
    lat: 43.21,
    lon: 27.91
  },

  odesa: {
    name: "Одесса",
    country: "Украина",
    lat: 46.48,
    lon: 30.72
  }

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let state = {
  city: "varna",
  tab: "weather",
  data: null
};


/* =========================================================
   WEATHER CODES
========================================================= */

const WMO = {

  0:  { t: "Ясно", i: "☀️" },
  1:  { t: "Преимущественно ясно", i: "🌤️" },
  2:  { t: "Переменная облачность", i: "⛅" },
  3:  { t: "Пасмурно", i: "☁️" },

  45: { t: "Туман", i: "🌫️" },
  48: { t: "Изморозь / туман", i: "🌫️" },

  51: { t: "Слабая морось", i: "🌧️" },
  53: { t: "Морось", i: "🌧️" },
  55: { t: "Сильная морось", i: "🌧️" },

  56: { t: "Ледяная морось", i: "🌧️" },
  57: { t: "Сильная ледяная морось", i: "🌧️" },

  61: { t: "Небольшой дождь", i: "🌧️" },
  63: { t: "Дождь", i: "🌧️" },
  65: { t: "Сильный дождь", i: "🌧️" },

  66: { t: "Ледяной дождь", i: "🌧️" },
  67: { t: "Сильный ледяной дождь", i: "🌧️" },

  71: { t: "Небольшой снег", i: "🌨️" },
  73: { t: "Снег", i: "❄️" },
  75: { t: "Сильный снег", i: "❄️" },

  77: { t: "Снежные зёрна", i: "❄️" },

  80: { t: "Небольшой ливень", i: "🌦️" },
  81: { t: "Ливень", i: "🌧️" },
  82: { t: "Сильный ливень", i: "⛈️" },

  85: { t: "Снегопад", i: "🌨️" },
  86: { t: "Сильный снегопад", i: "❄️" },

  95: { t: "Гроза", i: "⛈️" },
  96: { t: "Гроза с градом", i: "⛈️" },
  99: { t: "Сильная гроза с градом", i: "⛈️" }

};


function getW(code) {

  return WMO[code] || {
    t: "Переменчиво",
    i: "⛅"
  };

}


/* =========================================================
   FETCH DATA
========================================================= */

async function fetchData() {

  const loc = CITIES[state.city];

  document.getElementById("status-text").innerText =
    "Синхронизация...";

  try {

    const weatherURL =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${loc.lat}` +
      `&longitude=${loc.lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m,is_day` +
      `&hourly=temperature_2m,precipitation_probability,precipitation,rain,snowfall,weather_code,is_day` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,uv_index_max,sunrise,sunset` +
      `&timezone=auto` +
      `&forecast_days=5`;

    const airURL =
      `https://air-quality-api.open-meteo.com/v1/air-quality` +
      `?latitude=${loc.lat}` +
      `&longitude=${loc.lon}` +
      `&current=european_aqi` +
      `&timezone=auto`;

    const kpURL =
      `https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json`;

    /*
      Радиус землетрясений:
      примерно 500 км вокруг выбранного города.
    */

    const radiusKm = 500;

    const latDelta = radiusKm / 111;

    const lonDelta =
      radiusKm /
      (111 * Math.cos(loc.lat * Math.PI / 180));

    const eqURL =
      `https://earthquake.usgs.gov/fdsnws/event/1/query` +
      `?format=geojson` +
      `&limit=20` +
      `&orderby=time` +
      `&minmagnitude=2.5` +
      `&minlatitude=${loc.lat - latDelta}` +
      `&maxlatitude=${loc.lat + latDelta}` +
      `&minlongitude=${loc.lon - lonDelta}` +
      `&maxlongitude=${loc.lon + lonDelta}`;


    const results = await Promise.allSettled([

      fetch(weatherURL),

      fetch(airURL),

      fetch(kpURL),

      fetch(eqURL)

    ]);


    /* WEATHER */

    let weather = null;

    if (
      results[0].status === "fulfilled" &&
      results[0].value.ok
    ) {

      weather = await results[0].value.json();

    }


    /* AIR */

    let air = null;

    if (
      results[1].status === "fulfilled" &&
      results[1].value.ok
    ) {

      air = await results[1].value.json();

    }


    /* KP */

    let kp = null;

    if (
      results[2].status === "fulfilled" &&
      results[2].value.ok
    ) {

      const kpJson =
        await results[2].value.json();

      if (Array.isArray(kpJson)) {

        const rows = kpJson.filter((row, index) => {

          if (index === 0) return false;

          return (
            Array.isArray(row) &&
            row.length > 1 &&
            Number.isFinite(parseFloat(row[1]))
          );

        });

        if (rows.length) {

          const last = rows[rows.length - 1];

          kp = parseFloat(last[1]);

        }

      }

    }


    /* EARTHQUAKES */

    let earthquakes = [];

    if (
      results[3].status === "fulfilled" &&
      results[3].value.ok
    ) {

      const eqJson =
        await results[3].value.json();

      if (
        eqJson.features &&
        eqJson.features.length
      ) {

        earthquakes =
          eqJson.features.map(feature => {

            const coords =
              feature.geometry.coordinates;

            const eqLon = coords[0];
            const eqLat = coords[1];
            const depth = coords[2];

            const dist =
              haversine(
                loc.lat,
                loc.lon,
                eqLat,
                eqLon
              );

            return {

              title:
                feature.properties.place ||
                "Землетрясение",

              mag:
                Number(feature.properties.mag) || 0,

              depth:
                Number(depth) || 0,

              dist:
                Math.round(dist),

              time:
                feature.properties.time
                  ? new Date(feature.properties.time)
                  : null

            };

          });

      }

    }


    state.data = {

      weather,
      air,
      kp,
      eq: earthquakes

    };


    document.getElementById("status-text").innerText =
      `Обновлено: ${
        new Date().toLocaleTimeString(
          "ru-RU",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        )
      }`;


    renderTab();

  }

  catch (error) {

    console.error(error);

    state.data = {
      weather: null,
      air: null,
      kp: null,
      eq: []
    };

    document.getElementById("status-text").innerText =
      "Ошибка получения данных";

    renderTab();

  }

}


/* =========================================================
   HAVERSINE
========================================================= */

function haversine(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =========================================================
   CITY
========================================================= */

function setCity(city) {

  if (state.city === city) return;

  state.city = city;

  document.getElementById("btn-varna").className =
    city === "varna"

      ? "flex-1 px-6 py-2 rounded-lg text-sm font-bold bg-brand-gold text-black transition-all"

      : "flex-1 px-6 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";


  document.getElementById("btn-odesa").className =
    city === "odesa"

      ? "flex-1 px-6 py-2 rounded-lg text-sm font-bold bg-brand-gold text-black transition-all"

      : "flex-1 px-6 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";


  fetchData();

}


/* =========================================================
   TABS
========================================================= */

function setTab(tab) {

  state.tab = tab;

  document
    .querySelectorAll(".nav-btn")
    .forEach(button => {

      button.classList.remove(
        "text-brand-gold"
      );

      button.classList.add(
        "text-slate-400"
      );

    });


  const active =
    document.getElementById(
      `nav-${tab}`
    );

  active.classList.remove(
    "text-slate-400"
  );

  active.classList.add(
    "text-brand-gold"
  );


  renderTab();

}


/* =========================================================
   MODAL
========================================================= */

function showModal(
  id,
  val,
  title,
  icon,
  desc,
  status
) {

  document.getElementById("m-title").innerText =
    title;

  document.getElementById("m-icon").innerText =
    icon;

  document.getElementById("m-val").innerHTML =
    val;

  document.getElementById("m-desc").innerText =
    desc;

  document.getElementById("m-status").innerText =
    status;

  document
    .getElementById("modal")
    .classList.remove("hidden");

}


function closeModal(event) {

  event.preventDefault();

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* =========================================================
   WEATHER TAB
========================================================= */

function renderWeather() {

  const c =
    document.getElementById("content");

  const weather =
    state.data.weather;

  if (!weather || !weather.current) {

    c.innerHTML = `
      <div class="glass-panel p-6 rounded-2xl text-center">
        <div class="text-4xl mb-4">⚠️</div>
        <h2 class="text-lg font-bold text-white">
          Данные погоды недоступны
        </h2>
        <p class="text-sm text-slate-400 mt-2">
          Сервер Open-Meteo не ответил.
        </p>
      </div>
    `;

    return;

  }


  const cur =
    weather.current;

  const w =
    getW(cur.weather_code);


  const daily =
    weather.daily;


  let days = "";


  if (daily && daily.time) {

    for (
      let i = 0;
      i < daily.time.length;
      i++
    ) {

      const date =
        new Date(
          daily.time[i] + "T12:00:00"
        );


      const dw =
        getW(
          daily.weather_code[i]
        );


      const precipitation =
        daily.precipitation_sum?.[i] ?? 0;


      const precipProbability =
        daily.precipitation_probability_max?.[i] ?? 0;


      const dayName =
        i === 0
          ? "Сегодня"
          : date.toLocaleDateString(
              "ru-RU",
              {
                weekday: "short"
              }
            );


      days += `

        <div
          onclick="showModal(
            'day${i}',
            '${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°',
            '${dayName}',
            '${dw.i}',
            'Осадки: ${precipitation} мм. Вероятность осадков: ${precipProbability}%.',
            'Прогноз'
          )"
          class="glass-card p-3 rounded-xl text-center cursor-pointer"
        >

          <div class="text-xs text-slate-400 uppercase font-bold">
            ${dayName}
          </div>

          <div class="text-3xl my-2">
            ${dw.i}
          </div>

          <div class="text-sm font-bold text-white">
            ${Math.round(daily.temperature_2m_max[i])}°
            <span class="text-slate-500 font-normal">
              ${Math.round(daily.temperature_2m_min[i])}°
            </span>
          </div>

          <div class="text-[10px] text-sky-400 mt-2">
            ${precipProbability}% · ${precipitation} мм
          </div>

        </div>

      `;

    }

  }


  const uv =
    daily?.uv_index_max?.[0] ?? null;


  const sunrise =
    daily?.sunrise?.[0]
      ? new Date(daily.sunrise[0])
          .toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
      : "--";


  const sunset =
    daily?.sunset?.[0]
      ? new Date(daily.sunset[0])
          .toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
      : "--";


  const isDay =
    cur.is_day === 1;


  c.innerHTML = `

    <div class="glass-panel p-6 rounded-2xl mb-4">

      <div class="text-xs font-bold text-brand-gold uppercase tracking-widest mb-2">
        ${CITIES[state.city].name},
        ${CITIES[state.city].country}
      </div>


      <div class="flex items-center justify-between mb-6">

        <div
          onclick="showModal(
            'temperature',
            '${Math.round(cur.temperature_2m)}°C',
            'Температура',
            '🌡️',
            'Фактическая температура воздуха.',
            'Сейчас'
          )"
          class="cursor-pointer"
        >

          <div class="text-6xl font-extrabold text-white tracking-tighter">
            ${Math.round(cur.temperature_2m)}°
          </div>

          <div class="text-lg font-bold text-white mt-1">
            ${w.t}
          </div>

          <div class="text-sm text-slate-400 mt-1">
            Ощущается как
            ${Math.round(cur.apparent_temperature)}°
          </div>

          <div class="text-xs text-slate-500 mt-2">
            ${isDay ? "День" : "Ночь"}
          </div>

        </div>


        <div class="text-7xl">
          ${w.i}
        </div>

      </div>


      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-4 border-t border-slate-800/80">


        <div
          onclick="showModal(
            'wind',
            '${Math.round(cur.wind_speed_10m)} км/ч',
            'Ветер',

/* =========================================================
   HOURLY WEATHER
========================================================= */

function renderHourly(weather) {

  const hourly =
    weather.hourly;

  if (!hourly || !hourly.time) {

    return `
      <div class="glass-panel p-5 rounded-2xl text-center text-slate-400">
        Почасовые данные недоступны.
      </div>
    `;

  }


  const now =
    new Date();


  let startIndex = 0;


  for (
    let i = 0;
    i < hourly.time.length;
    i++
  ) {

    const t =
      new Date(hourly.time[i]);

    if (t >= now) {

      startIndex = i;
      break;

    }

  }


  let html = `
    <div class="glass-panel rounded-2xl p-4">
      <div class="hour-scroll flex gap-2 pb-2">
  `;


  const end =
    Math.min(
      startIndex + 24,
      hourly.time.length
    );


  for (
    let i = startIndex;
    i < end;
    i++
  ) {

    const time =
      new Date(hourly.time[i]);


    const w =
      getW(
        hourly.weather_code[i]
      );


    const temp =
      Math.round(
        hourly.temperature_2m[i]
      );


    const rainProbability =
      hourly.precipitation_probability?.[i] ?? 0;


    const precipitation =
      hourly.precipitation?.[i] ?? 0;


    const day =
      hourly.is_day?.[i] === 1;


    html += `

      <div
        class="glass-card rounded-xl p-3 min-w-[82px] text-center"
      >

        <div class="text-[11px] font-bold text-slate-400">
          ${time.toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )}
        </div>

        <div class="text-2xl my-2">
          ${day ? w.i : "🌙"}
        </div>

        <div class="text-lg font-extrabold text-white">
          ${temp}°
        </div>

        <div class="text-[10px] text-sky-400 mt-1">
          ${rainProbability}%
        </div>

        <div class="text-[10px] text-slate-500">
          ${precipitation} мм
        </div>

      </div>

    `;

  }


  html += `
      </div>
    </div>
  `;


  return html;

}

/* =========================================================
   MOON
========================================================= */

function calculateMoon(date = new Date()) {

  /*
    Расчёт синодического возраста Луны.
    Используется астрономическая аппроксимация,
    поэтому значение является расчётным, а не API.
  */

  const knownNewMoon =
    new Date(
      "2000-01-06T18:14:00Z"
    );


  const synodicMonth =
    29.530588853;


  const days =
    (date - knownNewMoon) /
    86400000;


  let age =
    days % synodicMonth;


  if (age < 0) {
    age += synodicMonth;
  }


  const illumination =
    (
      (1 - Math.cos(
        2 * Math.PI *
        age /
        synodicMonth
      )) / 2
    ) * 100;


  let phase;
  let icon;


  if (age < 1.84566) {

    phase = "Новолуние";
    icon = "🌑";

  }
  else if (age < 7.38264) {

    phase = "Растущий серп";
    icon = "🌒";

  }
  else if (age < 9.22830) {

    phase = "Первая четверть";
    icon = "🌓";

  }
  else if (age < 14.76529) {

    phase = "Растущая Луна";
    icon = "🌔";

  }
  else if (age < 16.61095) {

    phase = "Полнолуние";
    icon = "🌕";

  }
  else if (age < 22.14793) {

    phase = "Убывающая Луна";
    icon = "🌖";

  }
  else if (age < 23.99359) {

    phase = "Последняя четверть";
    icon = "🌗";

  }
  else if (age < 28.53059) {

    phase = "Убывающий серп";
    icon = "🌘";

  }
  else {

    phase = "Новолуние";
    icon = "🌑";

  }


  return {

    age,
    illumination,
    phase,
    icon

  };

}


function renderMoon() {

/* =========================================================
   ESCAPE TEXT
========================================================= */

function escapeText(text) {

  return String(text)
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");

}


/* =========================================================
   RENDER
========================================================= */

function renderTab() {

  if (!state.data) return;


  if (state.tab === "weather") {

    renderWeather();

  }

  else if (state.tab === "air") {

    renderAir();

  }

  else if (state.tab === "geo") {

    renderGeo();

  }

  else if (state.tab === "eq") {

    renderEarthquakes();

  }

  else if (state.tab === "moon") {

    renderMoon();

  }

}
