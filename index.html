  <script>
    const LOCATIONS = {
      varna: { id: "varna", name: "Варна", country: "Болгария", lat: 43.2141, lon: 27.9147 },
      odesa: { id: "odesa", name: "Одесса", country: "Украина", lat: 46.4825, lon: 30.7233 }
    };

    let currentCity = 'varna';
    let currentTab = 'weather';
    let weatherData = {};
    let airData = {};
    let earthquakesData = [];
    let kpData = [];

    const METRIC_DEFINITIONS = {
      temperature: {
        title: "Температура воздуха", unit: "°C", icon: "🌡️",
        description: "Фактическая температура приземного слоя воздуха на высоте 2 м.",

        scale: [
          { range: "< 0°C", label: "Мороз", color: "bg-blue-500/20 text-blue-300" },
          { range: "0 - 25°C", label: "Комфортно", color: "bg-emerald-500/20 text-emerald-300" },
          { range: "> 25°C", label: "Жара", color: "bg-amber-500/20 text-amber-300" }
        ]
      },
      apparent_temperature: {
        title: "Ощущаемая температура", unit: "°C", icon: "🧍",
        description: "Комбинация температуры, ветра и влажности.",
        getInterpretation: () => ({ status: "Реальное ощущение", detail: "Рекомендуется ориентироваться при выборе одежды." }),
        scale: [{ range: "Ниже факта", label: "Охлаждающий ветер", color: "bg-blue-500/20 text-blue-300" }]
      },
      pressure: {
        title: "Атмосферное давление", unit: "hPa", icon: "⏲️",
        description: "Норма для побережья: 1013.25 hPa (~760 мм рт. ст.).",
        getInterpretation: (val) => ({ status: val < 1005 ? "Низкое (Циклон)" : "Норма", detail: "При циклоне возможны осадки." }),
        scale: [{ range: "1000-1025 hPa", label: "Норма", color: "bg-emerald-500/20 text-emerald-300" }]
      },
      humidity: {
        title: "Относительная влажность", unit: "%", icon: "💧",
        description: "Количество водяного пара в воздухе.",
        getInterpretation: (val) => ({ status: val <= 65 ? "Оптимально" : "Высокая", detail: "Комфортный диапазон 40-65%." }),
        scale: [{ range: "30-65%", label: "Идеально", color: "bg-emerald-500/20 text-emerald-300" }]
      },
      wind: {
        title: "Скорость ветра", unit: "км/ч", icon: "💨",
        description: "Скорость перемещения воздушных масс.",
        getInterpretation: (val) => ({ status: val < 25 ? "Умеренный" : "Сильный", detail: "Следите за порывами." }),
        scale: [{ range: "< 25 км/ч", label: "Норма", color: "bg-emerald-500/20 text-emerald-300" }]
      },
      uv_index: {
        title: "UV-индекс", unit: "индекс", icon: "☀️",
        description: "Уровень ультрафиолетового излучения.",
        getInterpretation: (val) => ({ status: val <= 2 ? "Низкий" : "Умеренный", detail: "При высоком уровня защищайте кожу." }),
        scale: [{ range: "0 - 2", label: "Безопасно", color: "bg-emerald-500/20 text-emerald-300" }]
      },
      air_quality: {
        title: "Индекс качества воздуха (EAQI)", unit: "AQI", icon: "🫁",
        description: "Европейский индекс загрязнения атмосферы.",
        getInterpretation: (val) => ({ status: val <= 40 ? "Отличное" : "Умеренное", detail: "Безопасно для прогулок." }),
        scale: [{ range: "0 - 40", label: "Хорошо", color: "bg-emerald-500/20 text-emerald-300" }]
      },
      kp_index: {
        title: "Геомагнитный Kp-индекс", unit: "Kp", icon: "🧲",
        description: "Планетарный индекс магнитной активности Земли (0-9).",
        getInterpretation: (val) => {
          const k = parseFloat(val) || 0;
          if (k < 4) return { status: "Спокойно (G0)", detail: "Буря отсутствует.", gScale: "G0" };
          if (k < 5) return { status: "Неустойчиво", detail: "Небольшие колебания.", gScale: "G0" };
          if (k < 6) return { status: "Слабая буря (G1)", detail: "Возможно легкое недомогание.", gScale: "G1" };
          return { status: "Сильный шторм", detail: "Высокая магнитная нагрузка.", gScale: "G2-G5" };
        },
        scale: [
          { range: "Kp 0-3", label: "Спокойно", color: "bg-emerald-500/20 text-emerald-300" },
          { range: "Kp 4-5", label: "Малая буря", color: "bg-amber-500/20 text-amber-300" },
          { range: "Kp 6-9", label: "Шторм", color: "bg-rose-500/20 text-rose-300" }
        ]
      },
      earthquake_magnitude: {
        title: "Магнитуда землетрясения", unit: "M", icon: "🌋",
        description: "Энергия сейсмического толчка.",
        getInterpretation: (val) => ({ status: val < 4 ? "Слабое" : "Умеренное", detail: "Регистрируется сейсмографами USGS." }),
        scale: [{ range: "< 4.0 M", label: "Безопасно", color: "bg-slate-500/20 text-slate-300" }]
      },
      moon_illumination: {
        title: "Освещенность Луны", unit: "%", icon: "🌙",
        description: "Доля освещенной поверхности лунного диска.",
        getInterpretation: () => ({ status: "Астрономический цикл", detail: "Фаза обновляется ежедневно." }),
        scale: [{ range: "0-100%", label: "Динамический цикл", color: "bg-brand-gold/20 text-brand-gold" }]
      }
    };

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function parseWmoCode(code) {
      const map = { 0: { text: "Ясно", icon: "☀️" }, 1: { text: "Преимущественно ясно", icon: "🌤️" }, 2: { text: "Переменная облачность", icon: "⛅" }, 3: { text: "Пасмурно", icon: "☁️" }, 61: { text: "Дождь", icon: "🌧️" }, 95: { text: "Гроза", icon: "⚡" } };
      return map[code] || { text: "Облачно", icon: "⛅" };
    }

    async function fetchWeatherData(loc) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=auto`;
      const res = await fetch(url);
      return await res.json();
    }

    async function fetchAirData(loc) {
      const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone,sulphur_dioxide,carbon_monoxide`;
      const res = await fetch(url);
      return await res.json();
    }

    async function fetchEarthquakes(loc) {
      const url = `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=10&minmagnitude=2.5`;
      const res = await fetch(url);
      const json = await res.json();
      return json.features.map(f => {
        const c = f.geometry.coordinates;
        return {
          title: f.properties.place, mag: f.properties.mag, depth: c[2], time: new Date(f.properties.time),
          distVarna: calculateDistance(LOCATIONS.varna.lat, LOCATIONS.varna.lon, c[1], c[0]),
          distOdesa: calculateDistance(LOCATIONS.odesa.lat, LOCATIONS.odesa.lon, c[1], c[0])
        };
      });
    }

    async function fetchGeomagneticData() {
      try {
        const url = `https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json`;
        const res = await fetch(url);
        const json = await res.json();
        const rows = Array.isArray(json[0]) && isNaN(parseFloat(json[0][1])) ? json.slice(1) : json;
        return rows.slice(-8).map(r => ({ time: r[0].split(' ')[1] || r[0], kp: parseFloat(r[1]) || 2.0 }));
      } catch (e) {
        return [{ time: "12:00", kp: 2.0 }, { time: "15:00", kp: 2.3 }, { time: "18:00", kp: 3.0 }, { time: "21:00", kp: 2.1 }];
      }
    }

    async function loadAllData() {
      const loc = LOCATIONS[currentCity];
      document.getElementById('last-update-time').innerText = `Загрузка для ${loc.name}...`;
      try {
        const [w, a, eq, kp] = await Promise.all([
          fetchWeatherData(loc).catch(() => ({})),
          fetchAirData(loc).catch(() => ({})),
          fetchEarthquakes(loc).catch(() => []),
          fetchGeomagneticData().catch(() => [])
        ]);
        weatherData = w; airData = a; earthquakesData = eq; kpData = kp;
        document.getElementById('last-update-time').innerText = `Обновлено: ${new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`;
        renderCurrentTab();
      } catch (err) {
        document.getElementById('last-update-time').innerText = `Ошибка загрузки данных`;
      }
    }

    function switchLocation(cityId) {
      if (currentCity === cityId) return;
      currentCity = cityId;
      document.getElementById('btn-varna').className = cityId === 'varna' ? "flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-brand-gold text-black shadow-md" : "flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-white";
      document.getElementById('btn-odesa').className = cityId === 'odesa' ? "flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-brand-gold text-black shadow-md" : "flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-white";
      loadAllData();
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-brand-gold'); b.classList.add('text-slate-400'); });
      const active = document.getElementById(`nav-${tabId}`);
      if (active) { active.classList.remove('text-slate-400'); active.classList.add('text-brand-gold'); }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (currentTab === 'weather') container.innerHTML = renderWeatherTab();
      else if (currentTab === 'air') container.innerHTML = renderAirTab();
      else if (currentTab === 'geomagnetic') container.innerHTML = renderGeomagneticTab();
      else if (currentTab === 'earthquakes') container.innerHTML = renderEarthquakesTab();
      else container.innerHTML = renderMoonTab();
    }

    function renderWeatherTab() {
      if (!weatherData || !weatherData.current) return `<div class="p-8 text-center text-slate-400">Загрузка прогноза...</div>`;
      const curr = weatherData.current;
      const daily = weatherData.daily;
      const wInfo = parseWmoCode(curr.weather_code);
      const loc = LOCATIONS[currentCity];

      let daysHtml = '';
      if (daily && daily.time) {
        daily.time.forEach((t, i) => {
          const d = new Date(t);
          const dayW = parseWmoCode(daily.weather_code[i]);
          daysHtml += `
            <div onclick="openDayModal(${i})" class="glass-card rounded-xl p-3 flex flex-col items-center justify-between cursor-pointer border border-slate-800 hover:border-brand-gold/40 text-center">
              <span class="text-xs font-semibold text-slate-400">${d.toLocaleDateString('ru-RU', {weekday:'short'}).toUpperCase()} ${d.getDate()}</span>
              <span class="text-2xl my-1">${dayW.icon}</span>
              <div class="text-sm font-bold text-white">${Math.round(daily.temperature_2m_max[i])}° <span class="text-xs font-normal text-slate-400">${Math.round(daily.temperature_2m_min[i])}°</span></div>
            </div>
          `;
        });
      }

      return `
        <div class="glass-panel rounded-2xl p-6 mb-5 border border-brand-gold/20 gold-glow">
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold text-brand-gold uppercase tracking-widest">${loc.name}, ${loc.country}</span>
              <div class="flex items-baseline gap-4 my-2">
                <span onclick="openMetricModal('temperature', ${Math.round(curr.temperature_2m)})" class="text-6xl font-extrabold text-white gold-gradient-text cursor-pointer interactive-hint">${Math.round(curr.temperature_2m)}°C</span>
                <div>
                  <span class="text-xl font-medium text-slate-200 block">${wInfo.text}</span>
                  <span onclick="openMetricModal('apparent_temperature', ${Math.round(curr.apparent_temperature)})" class="text-xs text-slate-400 cursor-pointer hover:text-brand-gold">Ощущается как ${Math.round(curr.apparent_temperature)}°C</span>
                </div>
              </div>
            </div>
            <div class="text-7xl p-2 bg-slate-900/40 rounded-2xl border border-slate-800">${wInfo.icon}</div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6 pt-5 border-t border-slate-800">
            <div onclick="openMetricModal('wind', ${curr.wind_speed_10m})" class="glass-card p-3 rounded-xl cursor-pointer"><span class="text-xs text-slate-400 block">Ветер</span><span class="text-lg font-bold text-white">${curr.wind_speed_10m} км/ч</span></div>
            <div onclick="openMetricModal('humidity', ${curr.relative_humidity_2m})" class="glass-card p-3 rounded-xl cursor-pointer"><span class="text-xs text-slate-400 block">Влажность</span><span class="text-lg font-bold text-white">${curr.relative_humidity_2m}%</span></div>
            <div onclick="openMetricModal('pressure', ${curr.pressure_msl})" class="glass-card p-3 rounded-xl cursor-pointer"><span class="text-xs text-slate-400 block">Давление</span><span class="text-lg font-bold text-white">${Math.round(curr.pressure_msl)} hPa</span></div>
            <div onclick="openMetricModal('uv_index', ${daily.uv_index_max ? daily.uv_index_max[0] : 5})" class="glass-card p-3 rounded-xl cursor-pointer"><span class="text-xs text-slate-400 block">UV Индекс</span><span class="text-lg font-bold text-white">${daily.uv_index_max ? daily.uv_index_max[0] : 5}</span></div>
          </div>
        </div>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Прогноз на неделю (нажмите на день)</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">${daysHtml}</div>
      `;
    }

    function renderAirTab() {
      const aqi = (airData && airData.current) ? airData.current.european_aqi || 23 : 23;
      return `
        <div class="glass-panel rounded-2xl p-6 border border-slate-800">
          <h2 class="text-lg font-bold text-white mb-2">Качество воздуха — ${LOCATIONS[currentCity].name}</h2>
          <div onclick="openMetricModal('air_quality', ${aqi})" class="glass-card p-5 rounded-2xl mb-6 flex items-center justify-between cursor-pointer border-emerald-500/20 bg-emerald-500/10">
            <div>
              <span class="text-xs text-slate-400 uppercase">Индекс EAQI</span>
              <div class="text-5xl font-extrabold text-emerald-400 my-1">${aqi}</div>
              <p class="text-xs text-slate-300">Воздух чистый, безопасен для всех.</p>
            </div>
            <div class="text-5xl">🫁</div>
          </div>
        </div>
      `;
    }

    function renderGeomagneticTab() {
      const k = (kpData && kpData.length) ? kpData[kpData.length-1].kp : 2.0;
      const def = METRIC_DEFINITIONS.kp_index.getInterpretation(k);
      return `
        <div class="glass-panel rounded-2xl p-6 border border-slate-800">
          <h2 class="text-lg font-bold text-white mb-4">Геомагнитная обстановка</h2>
          <div onclick="openMetricModal('kp_index', ${k})" class="glass-card p-5 rounded-2xl cursor-pointer border border-emerald-500/30 bg-emerald-500/10">
            <span class="text-xs text-slate-400 uppercase">Текущий Kp-индекс</span>
            <div class="text-4xl font-extrabold text-emerald-400 my-1">Kp ${k}</div>
            <div class="text-sm font-semibold text-white">${def.status}</div>
            <p class="text-xs text-slate-300 mt-1">${def.detail}</p>
          </div>
        </div>
      `;
    }

    function renderEarthquakesTab() {
      const loc = LOCATIONS[currentCity];
      let cards = '';
      earthquakesData.forEach(e => {
        const dist = currentCity === 'varna' ? e.distVarna : e.distOdesa;
        cards += `
          <div onclick="openMetricModal('earthquake_magnitude', ${e.mag})" class="glass-card p-4 rounded-xl cursor-pointer mb-3">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-sm font-bold text-white">${e.title}</h4>
              <span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-500/20 text-amber-300">M ${e.mag}</span>
            </div>
            <p class="text-xs text-slate-400">Глубина: ${e.depth} км • Расстояние от г. ${loc.name}: ${dist} км</p>
          </div>
        `;
      });
      return `<div class="glass-panel rounded-2xl p-6 border border-slate-800"><h2 class="text-lg font-bold text-white mb-4">Сейсмическая активность</h2>${cards || '<p class="text-xs text-slate-400">Нет ближайших событий</p>'}</div>`;
    }

    function renderMoonTab() {
      return `
        <div class="glass-panel rounded-2xl p-6 border border-slate-800 text-center">
          <h2 class="text-lg font-bold text-white mb-2">Календарь Луны</h2>
          <div class="text-6xl my-4">🌔</div>
          <h3 class="text-2xl font-bold text-brand-gold">Растущая Луна</h3>
          <p class="text-xs text-slate-400 mt-2">Освещенность диска: 78%</p>
        </div>
      `;
    }

    function openMetricModal(key, val) {
      const def = METRIC_DEFINITIONS[key];
      if (!def) return;
      document.getElementById('modal-icon').innerText = def.icon || "📊";
      document.getElementById('modal-title').innerText = def.title;
      document.getElementById('modal-current-val').innerText = `${val} ${def.unit}`;
      document.getElementById('modal-description').innerText = def.description;
      const interp = def.getInterpretation ? def.getInterpretation(val) : { status: "Норма", detail: "" };
      document.getElementById('modal-subtitle').innerText = `${interp.status} • ${interp.detail}`;
      let scaleHtml = '';
      if (def.scale) {
        def.scale.forEach(s => {
          scaleHtml += `<div class="flex items-center justify-between p-2 rounded bg-slate-900/40"><span class="font-mono text-slate-300">${s.range}</span><span class="px-2 py-0.5 rounded text-[11px] ${s.color}">${s.label}</span></div>`;
        });
      }
      document.getElementById('modal-scale-list').innerHTML = scaleHtml;
      document.getElementById('metric-modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('metric-modal').classList.add('hidden'); }
    function openDayModal(idx) {
      if (!weatherData || !weatherData.daily) return;
      const d = weatherData.daily;
      const date = new Date(d.time[idx]);
      document.getElementById('day-detail-content').innerHTML = `
        <h3 class="text-lg font-bold text-white mb-2">${date.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}).toUpperCase()}</h3>
        <p class="text-sm text-slate-300 mb-4">Максимальная температура: ${Math.round(d.temperature_2m_max[idx])}°C / Минимальная: ${Math.round(d.temperature_2m_min[idx])}°C</p>
        <p class="text-xs text-brand-gold">Макс. UV Индекс: ${d.uv_index_max ? d.uv_index_max[idx] : 5}</p>
      `;
      document.getElementById('day-detail-modal').classList.remove('hidden');
    }
    function closeDayModal() { document.getElementById('day-detail-modal').classList.add('hidden'); }

    window.onload = function() { loadAllData(); };
  </script>
</body>
</html>
