<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AURA GEO METEO</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11151d;
  --panel2:#171c26;
  --line:#2b3340;
  --text:#f2f4f7;
  --muted:#9ba5b3;
  --gold:#e7ca72;
  --blue:#78a9ff;
  --green:#6bd58a;
  --red:#ff7373;
  --orange:#ffb45e;
  --shadow:0 14px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif
}
body{
  margin:0;
  background:var(--bg);
  min-height:100vh
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:18px 16px 100px
}
.header{
  background:linear-gradient(145deg,#171c26,#0f131a);
  border:1px solid #353b46;
  border-radius:24px;
  padding:24px 20px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden
}
.header:after{
  content:"";
  position:absolute;
  inset:auto -60px -110px auto;
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(231,202,114,.08);
  filter:blur(5px)
}
.brand{
  position:relative;
  z-index:1
}
.brand-icon{
  font-size:32px;
  line-height:1;
  margin-bottom:16px
}
h1{
  margin:0;
  font-size:clamp(34px,8vw,62px);
  line-height:.98;
  letter-spacing:-2px
}
.gold{
  color:var(--gold)
}
.subtitle{
  margin:12px 0 0;
  color:#d7dce5;
  font-size:18px
}
.status{
  margin-top:18px;
  color:var(--muted);
  font-size:15px
}
.city-tabs{
  display:flex;
  gap:10px;
  margin-top:20px;
  position:relative;
  z-index:1
}
.city-btn{
  border:1px solid #4a5260;
  background:#202631;
  color:#dfe4eb;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700
}
.city-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#101216
}
.telegram{
  margin-top:16px;
  padding:16px 18px;
  border:1px solid #2f3947;
  border-radius:18px;
  background:#10151d
}
.telegram-title{
  font-weight:800;
  font-size:17px
}
.telegram-text{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
  line-height:1.4
}
.telegram-btn{
  display:inline-block;
  margin-top:12px;
  padding:9px 14px;
  border-radius:10px;
  background:#2a75d6;
  color:white;
  text-decoration:none;
  font-weight:700
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:18px
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 26px rgba(0,0,0,.18)
}
.card.full{
  grid-column:1/-1
}
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}
.card-title{
  font-size:14px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em
}
.card-action{
  border:0;
  background:transparent;
  color:var(--blue);
  padding:0;
  font-weight:700
}
.current{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-top:12px
}
.temp{
  font-size:58px;
  font-weight:800;
  letter-spacing:-2px
}
.weather-main{
  font-size:18px;
  font-weight:700
}
.weather-sub{
  color:var(--muted);
  font-size:14px;
  margin-top:5px
}
.metrics{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:16px
}
.metric{
  background:var(--panel2);
  border-radius:14px;
  padding:12px
}
.metric-label{
  font-size:12px;
  color:var(--muted)
}
.metric-value{
  font-size:17px;
  font-weight:700;
  margin-top:4px
}
.forecast{
  display:grid;
  grid-template-columns:repeat(7,minmax(100px,1fr));
  gap:9px;
  overflow-x:auto;
  margin-top:14px;
  padding-bottom:3px
}
.day{
  min-width:100px;
  background:var(--panel2);
  border:1px solid #252d38;
  border-radius:15px;
  padding:11px;
  text-align:left;
  color:var(--text)
}
.day.active{
  border-color:var(--gold)
}
.day-name{
  font-size:13px;
  font-weight:800
}
.day-date{
  font-size:11px;
  color:var(--muted);
  margin-top:2px
}
.day-icon{
  font-size:27px;
  margin:9px 0
}
.day-temp{
  font-weight:800
}
.day-rain{
  font-size:12px;
  color:var(--blue);
  margin-top:5px
}
.air-score{
  font-size:46px;
  font-weight:800;
  margin-top:10px
}
.good{color:var(--green)}
.warn{color:var(--orange)}
.bad{color:var(--red)}
.pollutants{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:14px
}
.pollutant{
  background:var(--panel2);
  border-radius:12px;
  padding:10px;
  text-align:center
}
.pollutant b{
  display:block;
  font-size:16px
}
.pollutant span{
  font-size:11px;
  color:var(--muted)
}
.kp-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-top:10px
}
.kp-number{
  font-size:50px;
  font-weight:900
}
.kp-label{
  font-weight:800
}
.kp-help{
  color:var(--muted);
  font-size:13px;
  margin-top:4px
}
.kp-list,
.quake-list{
  display:grid;
  gap:8px;
  margin-top:14px
}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 12px;
  background:var(--panel2);
  border-radius:12px;
  font-size:14px
}
.row small{
  color:var(--muted)
}
.empty{
  color:var(--muted);
  padding:12px 0
}
.loading{
  color:var(--muted);
  padding:14px 0
}
.error{
  color:var(--red);
  padding:12px 0;
  line-height:1.4
}
.moon{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:10px
}
.moon-icon{
  font-size:55px
}
.moon-name{
  font-size:20px;
  font-weight:800
}
.muted{
  color:var(--muted)
}
.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(980px,100%);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(9,11,16,.92);
  backdrop-filter:blur(18px);
  border-top:1px solid #202632;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  z-index:20
}
.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 2px;
  font-size:12px
}
.nav.active{
  color:var(--gold)
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
  padding:12px
}
.modal.show{
  display:flex
}
.sheet{
  width:min(760px,100%);
  max-height:88vh;
  overflow:auto;
  background:#11151d;
  border:1px solid #333b48;
  border-radius:24px 24px 12px 12px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)
}
.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}
.sheet h2{
  margin:0;
  font-size:24px
}
.close{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #394250;
  background:#1a2029;
  color:white;
  font-size:22px
}
.hour-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:14px
}
.hour{
  background:#181e27;
  border-radius:12px;
  padding:10px;
  text-align:center
}
.hour-time{
  font-size:12px;
  color:var(--muted)
}
.hour-icon{
  font-size:22px;
  margin:4px 0
}
.hour-temp{
  font-weight:800
}
.hour-rain{
  font-size:11px;
  color:var(--blue)
}
.guide{
  display:grid;
  gap:9px;
  margin-top:14px
}
.guide-item{
  background:#181e27;
  border-radius:12px;
  padding:12px
}
@media(max-width:700px){
  .grid{
    grid-template-columns:1fr
  }
  .card.full{
    grid-column:auto
  }
  .pollutants{
    grid-template-columns:repeat(3,1fr)
  }
  .hour-grid{
    grid-template-columns:repeat(3,1fr)
  }
}
@media(max-width:430px){
  .app{
    padding-left:12px;
    padding-right:12px
  }
  .header{
    padding:20px 16px
  }
  h1{
    font-size:38px
  }
  .temp{
    font-size:50px
  }
  .pollutants{
    grid-template-columns:repeat(2,1fr)
  }
  .hour-grid{
    grid-template-columns:repeat(2,1fr)
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div class="brand-icon">☀</div>

    <h1>
      AURA <span class="gold">GEO METEO</span>
    </h1>

    <div class="subtitle">
      Premium геометеорологический мониторинг
    </div>

    <div id="status" class="status">
      Синхронизация...
    </div>

  </div>

  <div class="city-tabs">

    <button class="city-btn active" data-city="varna">
      ВАРНА
    </button>

    <button class="city-btn" data-city="odesa">
      ОДЕССА
    </button>

  </div>

</header>

<section class="telegram">

  <div class="telegram-title">
    Уведомления в Telegram
  </div>

  <div class="telegram-text">
    Предупреждения о магнитных бурях Kp≥5,
    сильной погоде и землетрясениях.
  </div>

  <a class="telegram-btn"
     href="#"
     id="telegramLink"
     aria-disabled="true">
    Подключить
  </a>

</section>

<main class="grid">

<section class="card full" id="weatherCard">

  <div class="card-head">

    <div class="card-title">
      Погода
    </div>

    <button class="card-action"
            onclick="refreshAll()">
      Обновить
    </button>

  </div>

  <div id="weather">
    Загрузка данных...
  </div>

</section>

<section class="card" id="airCard">

  <div class="card-head">

    <div class="card-title">
      Воздух
    </div>

    <button class="card-action"
            onclick="openAirGuide()">
      Что означает
    </button>

  </div>

  <div id="air">
    Загрузка...
  </div>

</section>

<section class="card" id="magneticCard">

  <div class="card-head">

    <div class="card-title">
      Магнитные
    </div>

    <button class="card-action"
            onclick="openKpGuide()">
      Шкала Kp
    </button>

  </div>

  <div id="magnetic">
    Загрузка...
  </div>

</section>

<section class="card full" id="seismoCard">

  <div class="card-head">

    <div class="card-title">
      Сейсмо
    </div>

    <button class="card-action"
            onclick="refreshQuakes()">
      Обновить
    </button>

  </div>

  <div id="seismo">
    Загрузка...
  </div>

</section>

<section class="card full" id="moonCard">

  <div class="card-head">
    <div class="card-title">
      Луна
    </div>
  </div>

  <div id="moon">
    Загрузка...
  </div>

</section>

</main>

</div>

<nav class="bottom">

  <button class="nav active"
          data-target="weatherCard">
    Погода
  </button>

  <button class="nav"
          data-target="airCard">
    Воздух
  </button>

  <button class="nav"
          data-target="magneticCard">
    Kp
  </button>

  <button class="nav"
          data-target="seismoCard">
    Сейсмо
  </button>

  <button class="nav"
          data-target="moonCard">
    Луна
  </button>

</nav>

<div class="modal"
     id="modal"
     onclick="if(event.target===this)closeModal()">

  <div class="sheet">

    <div class="sheet-head">

      <h2 id="modalTitle">
        Подробно
      </h2>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<script>
"use strict";

const CITIES = {

  varna:{
    name:"Варна",
    country:"Болгария",
    lat:43.21,
    lon:27.91
  },

  odesa:{
    name:"Одесса",
    country:"Украина",
    lat:46.48,
    lon:30.72
  }

};

const state = {

  city:"varna",

  weather:null,

  air:null,

  kp:null,

  kpForecast:null,

  quakes:[],

  lastUpdate:null

};

const WMO = {

  0:["Ясно","☀"],

  1:["Преимущественно ясно","🌤"],

  2:["Переменная облачность","⛅"],

  3:["Пасмурно","☁"],

  45:["Туман","🌫"],

  48:["Изморозь/туман","🌫"],

  51:["Морось","🌦"],

  53:["Морось","🌦"],

  55:["Сильная морось","🌧"],

  56:["Ледяная морось","🌧"],

  57:["Ледяная морось","🌧"],

  61:["Небольшой дождь","🌦"],

  63:["Дождь","🌧"],

  65:["Сильный дождь","🌧"],

  66:["Ледяной дождь","🌧"],

  67:["Сильный ледяной дождь","🌧"],

  71:["Небольшой снег","🌨"],

  73:["Снег","🌨"],

  75:["Сильный снег","❄"],

  77:["Снежные зерна","❄"],

  80:["Ливни","🌦"],

  81:["Сильные ливни","🌧"],

  82:["Очень сильные ливни","⛈"],

  85:["Снегопад","🌨"],

  86:["Сильный снегопад","❄"],

  95:["Гроза","⛈"],

  96:["Гроза с градом","⛈"],

  99:["Сильная гроза с градом","⛈"]

};

const AQI_BANDS = [

  {
    max:20,
    label:"Хорошо",
    cls:"good"
  },

  {
    max:40,
    label:"Удовлетворительно",
    cls:"good"
  },

  {
    max:60,
    label:"Умеренно",
    cls:"warn"
  },

  {
    max:80,
    label:"Плохо",
    cls:"warn"
  },

  {
    max:100,
    label:"Очень плохо",
    cls:"bad"
  },

  {
    max:Infinity,
    label:"Крайне плохо",
    cls:"bad"
  }

];

const POLLUTANTS = {

  pm2_5:{
    label:"PM2.5",
    unit:"µg/m³",
    bands:[5,15,50,90,140]
  },

  pm10:{
    label:"PM10",
    unit:"µg/m³",
    bands:[15,45,120,195,270]
  },

  nitrogen_dioxide:{
    label:"NO₂",
    unit:"µg/m³",
    bands:[10,25,60,100,150]
  },

  ozone:{
    label:"O₃",
    unit:"µg/m³",
    bands:[60,100,120,160,180]
  },

  sulphur_dioxide:{
    label:"SO₂",
    unit:"µg/m³",
    bands:[20,40,125,190,275]
  }

};

function city(){
  return CITIES[state.city];
}

function esc(v){

  return String(v ?? "")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));

}

function num(v,dec=0){

  const n=Number(v);

  return Number.isFinite(n)
    ? n.toFixed(dec)
    : "—";

}

function weatherInfo(code){

  return WMO[code] || [
    "Неизвестно",
    "•"
  ];

}

function formatTime(iso){

  if(!iso) return "—";

  const d=new Date(iso);

  return Number.isNaN(d.getTime())

    ? String(iso).slice(11,16)

    : d.toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

}

function formatDate(iso){

  if(!iso) return "—";

  const d=new Date(
    iso+"T12:00:00"
  );

  return d.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}

function dayName(iso){

  const d=new Date(
    iso+"T12:00:00"
  );

  return d
    .toLocaleDateString(
      "ru-RU",
      {weekday:"short"}
    )
    .replace(".","");

}

function setStatus(text){

  document.getElementById(
    "status"
  ).textContent=text;

}

function showError(id,msg){

  document.getElementById(id).innerHTML=
    '<div class="error">'+
    esc(msg)+
    '</div>';

}

async function getJSON(url){

  const r=await fetch(
    url,
    {
      cache:"no-store"
    }
  );

  if(!r.ok){

    throw new Error(
      "HTTP "+r.status
    );

  }

  return r.json();

}

function weatherURL(c){

  const p=new URLSearchParams({

    latitude:c.lat,

    longitude:c.lon,

    timezone:"auto",

    forecast_days:"7",

    current:
      "temperature_2m,"+
      "relative_humidity_2m,"+
      "apparent_temperature,"+
      "weather_code,"+
      "pressure_msl,"+
      "wind_speed_10m,"+
      "wind_gusts_10m,"+
      "is_day",

    hourly:
      "temperature_2m,"+
      "apparent_temperature,"+
      "precipitation_probability,"+
      "precipitation,"+
      "rain,"+
      "snowfall,"+
      "weather_code,"+
      "wind_speed_10m,"+
      "wind_gusts_10m,"+
      "relative_humidity_2m",

    daily:
      "weather_code,"+
      "temperature_2m_max,"+
      "temperature_2m_min,"+
      "apparent_temperature_max,"+
      "apparent_temperature_min,"+
      "precipitation_sum,"+
      "rain_sum,"+
      "snowfall_sum,"+
      "precipitation_probability_max,"+
      "wind_speed_10m_max,"+
      "wind_gusts_10m_max,"+
      "uv_index_max,"+
      "sunrise,"+
      "sunset"

  });

  return (
    "https://api.open-meteo.com/v1/forecast?"+
    p
  );

}

function airURL(c){

  const p=new URLSearchParams({

    latitude:c.lat,

    longitude:c.lon,

    timezone:"auto",

    current:
      "european_aqi,"+
      "pm2_5,"+
      "pm10,"+
      "nitrogen_dioxide,"+
      "ozone,"+
      "sulphur_dioxide",

    hourly:
      "european_aqi,"+
      "pm2_5,"+
      "pm10,"+
      "nitrogen_dioxide,"+
      "ozone,"+
      "sulphur_dioxide"

  });

  return (
    "https://air-quality-api.open-meteo.com/v1/air-quality?"+
    p
  );

}

async function loadWeather(){

  try{

    state.weather=
      await getJSON(
        weatherURL(city())
      );

    renderWeather();

  }catch(e){

    showError(
      "weather",
      "Не удалось загрузить погоду. Проверьте интернет-соединение."
    );

  }

}

async function loadAir(){

  try{

    state.air=
      await getJSON(
        airURL(city())
      );

    renderAir();

  }catch(e){

    showError(
      "air",
      "Не удалось загрузить данные о качестве воздуха."
    );

  }

}

function parseKpRows(data){

  if(!Array.isArray(data))
    return [];

  const out=[];

  for(const row of data){

    let time=null;

    let kp=null;

    let observed=null;

    let scale=null;

    if(Array.isArray(row)){

      if(row.length>=2){

        time=row[0];

        kp=Number(row[1]);

        observed=row[2];

        scale=row[3];

      }

    }else if(
      row &&
      typeof row==="object"
    ){

      time=
        row.time_tag ??
        row.observation_time ??
        row.time ??
        row.valid_time ??
        null;

      kp=Number(
        row.kp ??
        row.kp_index ??
        row.planetary_k_index ??
        row.Kp
      );

      observed=row.observed;

      scale=
        row.noaa_scale ??
        row.scale ??
        null;

    }

    if(
      time &&
      Number.isFinite(kp)
    ){

      out.push({
        time,
        kp,
        observed,
        scale
      });

    }

  }

  return out.sort(
    (a,b)=>
      new Date(a.time) -
      new Date(b.time)
  );

}

function kpLevel(kp){

      "Экстремальная буря",
      "bad"

  if(kp>=8)

    return [
      "G4",
      "Очень сильная буря",
      "bad"
    ];

  if(kp>=7)

    return [
      "G3",
      "Сильная буря",
      "bad"
    ];

  if(kp>=6)

    return [
      "G2",
      "Умеренная буря",
      "warn"
    ];

  if(kp>=5)

    return [
      "G1",
      "Слабая магнитная буря",
      "warn"
    ];

  if(kp>=4)

    return [
      "Возмущение",
      "Возмущённая обстановка",
      "warn"
    ];

  return [
    "Спокойно",
    "Спокойная обстановка",
    "good"
  ];

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=6371;

  const rad=Math.PI/180;

  const p1=lat1*rad;

  const p2=lat2*rad;

  const dp=
    (lat2-lat1)*rad;

  const dl=
    (lon2-lon1)*rad;

  const a=
    Math.sin(dp/2)**2+
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dl/2)**2;

  return 2*R*
    Math.asin(
      Math.sqrt(a)
    );

}

async function loadQuakes(){

    const c=city();

    state.quakes=
      (data.features||[])
      .map(f=>{

        const [
          lon,
          lat,
          depth
        ]=
          f.geometry.coordinates;

        return {

          mag:Number(
            f.properties.mag
          ),

          place:
            f.properties.place ||
            "Неизвестно",

          time:
            f.properties.time,

          lat,

          lon,

          depth,

          distance:
            distanceKm(
              c.lat,
              c.lon,
              lat,
              lon
            ),

          url:
            f.properties.url

        };

      })

      .filter(q=>

        Number.isFinite(q.mag) &&
        q.distance<=500

      )

      .sort(
        (a,b)=>
          b.time-a.time
      )

      .slice(0,12);

    renderEarthquakes();

  }catch(e){

    showError(
      "seismo",
      "Не удалось загрузить землетрясения USGS."

}

function calculateMoon(
  date=new Date()
){

  const synodic=
    29.530588853;

  const known=
    new Date(
      Date.UTC(
        2000,
        0,
        6,
        18,
        14,
        0
      )
    );

  const age=
    (
      (date-known) /
      86400000
    ) %
    synodic;

  const a=
    (age+synodic) %
    synodic;

  const phase=
    a/synodic;

  let name;

  let icon;

  if(a<1.85){

    name="Новолуние";
    icon="🌑";

  }else if(a<7.38){

    name="Растущий серп";
    icon="🌒";

  }else if(a<9.22){

    name="Первая четверть";
    icon="🌓";

  }else if(a<14.76){

    name="Растущая Луна";
    icon="🌔";

  }else if(a<16.61){

    name="Полнолуние";
    icon="🌕";

  }else if(a<22.15){

    name="Убывающая Луна";
    icon="🌖";

  }else if(a<23.99){

    name="Последняя четверть";
    icon="🌗";

  }else{

    name="Убывающий серп";
    icon="🌘";

  }

  return {

    name,

    icon,

    age:a,

    illumination:
      (
        0.5*
        (
          1-
          Math.cos(
            2*Math.PI*phase
          )
        )
      )*100

  };

}
