<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>AURA GEO METEO</title>

<style>
:root{
--bg:#07090d;
--text:#f6f7fa;
--muted:#8993a3;
--line:#242b35;
--gold:#e8c969;
--blue:#5da8ff;
--cyan:#63d6ff;
--red:#ff7272;
--green:#63d58b
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
-webkit-text-size-adjust:100%
}

button{
font:inherit;
border:0;
background:none;
color:inherit;
cursor:pointer
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 50% -15%,rgba(232,201,105,.12),transparent 38%),
radial-gradient(circle at 100% 65%,rgba(72,117,180,.08),transparent 40%)
}

.app{
height:100dvh;
padding:env(safe-area-inset-top) 16px calc(66px + env(safe-area-inset-bottom));
overflow:hidden
}

.top{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.brand{
font-size:25px;
font-weight:900;
letter-spacing:-1px
}

.brand span{
color:var(--gold)
}

.updated{
color:var(--muted);
font-size:11px;
margin-top:4px
}

.cities{
display:flex;
gap:4px
}

.city{
padding:7px 11px;
border-radius:20px;
color:var(--muted);
font-size:12px;
font-weight:800
}

.city.active{
background:var(--gold);
color:#111
}

.screen{
height:calc(
100dvh -
65px -
66px -
env(safe-area-inset-top) -
env(safe-area-inset-bottom)
);
overflow:hidden
}

.page{
display:none;
height:100%;
overflow:hidden
}

.page.active{
display:block
}

.weather{
height:100%;
display:grid;
grid-template-rows:116px 34px 242px 1fr;
gap:0
}

.current{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.temp{
font-size:66px;
font-weight:900;
letter-spacing:-4px;
line-height:.85
}

.condition{
font-size:21px;
font-weight:850;
margin-top:8px
}

.feels{
font-size:14px;
color:var(--muted);
margin-top:4px
}

.meta{
text-align:right;
color:#bdc5d0;
font-size:14px;
line-height:1.8
}

.meta b{
color:#fff
}

.section-title{
display:flex;
align-items:end;
color:var(--muted);
font-size:12px;
font-weight:850;
letter-spacing:.08em;
text-transform:uppercase
}

.chart-area{
position:relative;
height:242px;
padding-top:4px
}

.chart-tabs{
height:30px;
display:flex;
gap:7px;
align-items:center
}

.chart-tab{
padding:5px 10px;
border-radius:16px;
color:var(--muted);
font-size:12px;
font-weight:800
}

.chart-tab.active{
background:#171d26;
color:#fff
}

.chart-box{
position:relative;
height:207px
}

.chart-svg{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none
}

.chart-read{
position:absolute;
top:8px;
left:8px;
padding:7px 9px;
border:1px solid #343e4c;
border-radius:10px;
background:rgba(7,9,13,.88);
backdrop-filter:blur(12px);
pointer-events:none;
font-size:12px;
line-height:1.35;
min-width:112px
}

.chart-read strong{
display:block;
color:var(--gold);
font-size:18px
}

.chart-range{
display:none
}

.days{
min-height:0;
display:grid;
grid-template-rows:repeat(7,1fr);
border-top:1px solid var(--line)
}

.day{
min-height:0;
width:100%;
display:grid;
grid-template-columns:69px 32px 1fr 72px 48px;
align-items:center;
text-align:left;
border-bottom:1px solid #1d242e
}

.day:last-child{
border-bottom:0
}

.day.selected{
background:linear-gradient(
90deg,
rgba(232,201,105,.09),
transparent
);
border-radius:7px
}

.dn{
font-size:14px;
font-weight:850
}

.dd{
font-size:10px;
color:var(--muted);
margin-top:2px
}

.di{
font-size:21px;
text-align:center
}

.dt{
text-align:right;
font-size:14px;
font-weight:850
}

.dr{
text-align:right;
color:var(--blue);
font-size:12px
}

.nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:calc(61px + env(safe-area-inset-bottom));
padding:3px 7px env(safe-area-inset-bottom);
display:grid;
grid-template-columns:repeat(5,1fr);
background:rgba(7,9,13,.96);
border-top:1px solid var(--line);
z-index:20
}

.nav button{
color:#7f8998;
font-size:11px;
font-weight:750
}

.nav button.active{
color:var(--gold)
}

.nav i{
display:block;
font-style:normal;
font-size:20px;
line-height:21px
}

.simple{
height:100%;
padding-top:5px
}

.title{
height:40px;
display:flex;
align-items:center;
justify-content:space-between;
font-size:21px;
font-weight:900;
border-bottom:1px solid var(--line)
}

.action{
color:var(--blue);
font-size:13px;
font-weight:800
}

.big{
display:flex;
align-items:center;
gap:18px;
padding:17px 0;
border-bottom:1px solid var(--line)
}

.big-num{
font-size:61px;
font-weight:900;
line-height:.8
}

.big-label{
font-size:21px;
font-weight:850
}

.muted{
color:var(--muted)
}

.polls{
display:grid;
grid-template-columns:repeat(5,1fr);
border-bottom:1px solid var(--line);
padding:14px 0
}

.poll{
padding:0 6px;
border-left:1px solid var(--line);
text-align:left
}

.poll:first-child{
border-left:0;
padding-left:0
}

.poll b{
font-size:14px
}

.poll small{
display:block;
color:var(--muted);
font-size:9px;
margin-top:3px
}

.rows{
display:grid
}

.row{
height:45px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #1d242e;
font-size:14px
}

.row b{
font-size:15px
}

.kp-main{
height:130px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.kp{
font-size:72px;
font-weight:900;
line-height:.8
}

.kp-right{
text-align:right
}

.kp-right b{
font-size:21px
}

.kp-right span{
display:block;
color:var(--muted);
font-size:13px;
margin-top:5px
}

.kp-grid{
display:grid;
grid-template-columns:repeat(4,1fr)
}

.kp-item{
text-align:center;
padding:13px 3px;
border-left:1px solid var(--line)
}

.kp-item:first-child{
border-left:0
}

.kp-item small{
display:block;
color:var(--muted);
font-size:10px
}

.kp-item b{
display:block;
margin-top:4px;
font-size:16px
}

.quake-main{
height:92px;
display:flex;
align-items:center;
gap:15px;
border-bottom:1px solid var(--line)
}

.qcount{
font-size:60px;
font-weight:900
}

.qrow{
height:47px;
display:grid;
grid-template-columns:1fr 45px 55px;
align-items:center;
border-bottom:1px solid #1d242e;
font-size:13px
}

.qrow span{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.qrow b{
text-align:right
}

.qrow small{
text-align:right;
color:var(--muted);
font-size:10px
}

.moon{
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.moon-icon{
font-size:92px
}

.moon-name{
font-size:27px;
font-weight:900;
margin-top:12px
}

.moon-data{
color:var(--muted);
font-size:15px;
line-height:1.7;
margin-top:6px
}

.modal{
position:fixed;
z-index:50;
inset:0;
display:none;
align-items:flex-end;
padding:10px;
background:rgba(0,0,0,.7)
}

.modal.show{
display:flex
}

.sheet{
width:100%;
background:#10151d;
border:1px solid #303a48;
border-radius:22px 22px 0 0;
padding:14px
}

.sheethead{
height:38px;
display:flex;
align-items:center;
justify-content:space-between
}

.sheet h2{
font-size:22px;
margin:0
}

.close{
width:36px;
height:36px;
border-radius:50%;
background:#202833;
color:#fff;
font-size:24px
}

.details{
display:grid;
grid-template-columns:repeat(2,1fr);
border-top:1px solid var(--line);
border-left:1px solid var(--line)
}

.detail{
padding:9px;
border-right:1px solid var(--line);
border-bottom:1px solid var(--line)
}

.detail small{
display:block;
color:var(--muted);
font-size:11px
}

.detail b{
display:block;
margin-top:3px;
font-size:16px
}

.guide{
display:grid
}

.guide div{
padding:10px 0;
border-bottom:1px solid var(--line);
font-size:14px
}

@media(max-width:430px){

.app{
padding-left:13px;
padding-right:13px
}

.top{
height:62px
}

.brand{
font-size:23px
}

.city{
font-size:11px;
padding:7px 9px
}

.screen{
height:calc(
100dvh -
62px -
66px -
env(safe-area-inset-top) -
env(safe-area-inset-bottom)
)
}

.weather{
grid-template-rows:108px 32px 238px 1fr
}

.temp{
font-size:60px
}

.condition{
font-size:20px
}

.feels{
font-size:13px
}

.meta{
font-size:13px
}

.chart-area{
height:238px
}

.chart-box{
height:205px
}

.day{
grid-template-columns:67px 30px 1fr 70px 46px
}

.dn{
font-size:13px
}

.dt{
font-size:13px
}

.dr{
font-size:11px
}

.di{
font-size:20px
}

.title{
font-size:20px
}

.big-num{
font-size:57px
}

.big-label{
font-size:20px
}

.kp{
font-size:64px
}

.kp-right b{
font-size:19px
}

.qcount{
font-size:55px
}

.moon-icon{
font-size:80px
}

}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div>
<div class="brand">AURA <span>GEO METEO</span></div>
<div id="status" class="updated">Синхронизация…</div>
</div>

<div class="cities">
<button class="city active" data-city="varna">ВАРНА</button>
<button class="city" data-city="odesa">ОДЕССА</button>
</div>

</header>

<main class="screen">

<section class="page active" id="page-weather">

<div class="weather">

<div class="current" id="current">
Загрузка…
</div>

<div class="section-title">
Почасовой прогноз
</div>

<div class="chart-area">

<div class="chart-tabs">

<button class="chart-tab active" data-metric="temp">
Температура
</button>

<button class="chart-tab" data-metric="rain">
Осадки
</button>

<button class="chart-tab" data-metric="wind">
Ветер
</button>

</div>

<div class="chart-box" id="chart">
Загрузка…
</div>

</div>

<div class="days" id="days"></div>

</div>

</section>

<section class="page" id="page-air">

<div class="simple">

<div class="title">
Воздух
<button class="action" onclick="openAirGuide()">AQI</button>
</div>

<div id="air">
Загрузка…
</div>

</div>

</section>

<section class="page" id="page-magnetic">

<div class="simple">

<div class="title">
Магнитные бури
<button class="action" onclick="openKpGuide()">Шкала</button>
</div>

<div id="magnetic">
Загрузка…
</div>

</div>

</section>

<section class="page" id="page-seismo">

<div class="simple">

<div class="title">
Землетрясения
<button class="action" onclick="loadQuakes()">Обновить</button>
</div>

<div id="seismo">
Загрузка…
</div>

</div>

</section>

<section class="page" id="page-moon">

<div class="simple">

<div class="moon" id="moon">
Загрузка…
</div>

</div>

</section>

</main>

</div>

<nav class="nav">

<button class="active" data-page="weather">
<i>☁</i>
Погода
</button>

<button data-page="air">
<i>◉</i>
Воздух
</button>

<button data-page="magnetic">
<i>⚡</i>
Магнитные
</button>

<button data-page="seismo">
<i>⌁</i>
Сейсмо
</button>

<button data-page="moon">
<i>☾</i>
Луна
</button>

</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

<div class="sheet">

<div class="sheethead">

<h2 id="modalTitle">
Подробно
</h2>

<button class="close" onclick="closeModal()">
×
</button>

</div>

<div id="modalBody"></div>

</div>

</div>

<script>
"use strict";

const CITIES={
varna:{
name:"Варна",
country:"Болгария",
lat:43.21,
lon:27.91
},

odesa:{
name:"Одесса",
country:"Украина",
lat:46.48,
lon:30.72
}
};

const WMO={
0:["Ясно","☀"],
1:["Преимущественно ясно","🌤"],
2:["Переменная облачность","⛅"],
3:["Пасмурно","☁"],
45:["Туман","🌫"],
48:["Туман","🌫"],
51:["Морось","🌦"],
53:["Морось","🌦"],
55:["Сильная морось","🌧"],
56:["Ледяная морось","🌧"],
57:["Ледяная морось","🌧"],
61:["Небольшой дождь","🌦"],
63:["Дождь","🌧"],
65:["Сильный дождь","🌧"],
66:["Ледяной дождь","🌧"],
67:["Сильный ледяной дождь","🌧"],
71:["Снег","🌨"],
73:["Снег","🌨"],
75:["Сильный снег","❄"],
77:["Снежные зерна","❄"],
80:["Ливни","🌦"],
81:["Сильные ливни","🌧"],
82:["Очень сильные ливни","⛈"],
85:["Снегопад","🌨"],
86:["Сильный снегопад","❄"],
95:["Гроза","⛈"],
96:["Гроза с градом","⛈"],
99:["Сильная гроза с градом","⛈"]
};

const AQI=[
{max:20,label:"Хорошо",cls:"good"},
{max:40,label:"Удовлетворительно",cls:"good"},
{max:60,label:"Умеренно",cls:"warn"},
{max:80,label:"Плохо",cls:"warn"},
{max:100,label:"Очень плохо",cls:"bad"},
{max:Infinity,label:"Крайне плохо",cls:"bad"}
];

const POLL={
pm2_5:["PM2.5","µg/m³"],
pm10:["PM10","µg/m³"],
nitrogen_dioxide:["NO₂","µg/m³"],
ozone:["O₃","µg/m³"],
sulphur_dioxide:["SO₂","µg/m³"]
};

const S={
city:"varna",
weather:null,
air:null,
kp:[],
kpf:[],
quakes:[],
day:0,
metric:"temp",
chartPoints:[]
};

function city(){
return CITIES[S.city];
}

function num(v,d=0){
const n=Number(v);
if(!Number.isFinite(n))return "—";
return n.toFixed(d).replace(".0","");
}

function esc(v){
return String(v)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

function setStatus(t){
document.getElementById("status").textContent=t;
}

async function getJSON(url){
const r=await fetch(url,{cache:"no-store"});
if(!r.ok)throw new Error("HTTP "+r.status);
return await r.json();
}

function weatherURL(c){

const p=new URLSearchParams({
latitude:c.lat,
longitude:c.lon,
current:[
"temperature_2m",
"relative_humidity_2m",
"apparent_temperature",
"weather_code",
"pressure_msl",
"wind_speed_10m",
"wind_gusts_10m",
"is_day"
].join(","),

hourly:[
"temperature_2m",
"apparent_temperature",
"precipitation_probability",
"precipitation",
"rain",
"snowfall",
"weather_code",
"wind_speed_10m",
"wind_gusts_10m",
"relative_humidity_2m"
].join(","),

daily:[
"weather_code",
"temperature_2m_max",
"temperature_2m_min",
"apparent_temperature_max",
"apparent_temperature_min",
"precipitation_sum",
"rain_sum",
"snowfall_sum",
"precipitation_probability_max",
"wind_speed_10m_max",
"wind_gusts_10m_max",
"uv_index_max",
"sunrise",
"sunset"
].join(","),

timezone:"auto",
forecast_days:"7"
});

return "https://api.open-meteo.com/v1/forecast?"+p;
}

function airURL(c){

const p=new URLSearchParams({
latitude:c.lat,
longitude:c.lon,

current:[
"european_aqi",
"pm2_5",
"pm10",
"nitrogen_dioxide",
"ozone",
"sulphur_dioxide"
].join(","),

timezone:"auto"
});

return "https://air-quality-api.open-meteo.com/v1/air-quality?"+p;
}

function time(v){

if(!v)return "—";

const d=new Date(v);

return d.toLocaleTimeString("ru-RU",{
hour:"2-digit",
minute:"2-digit"
});
}

function dateShort(v){

const d=new Date(v+"T12:00:00");

return d.toLocaleDateString("ru-RU",{
day:"2-digit",
month:"2-digit"
});
}

function dayName(v,i){

if(i===0)return "Сегодня";

if(i===1)return "Завтра";

return new Date(v+"T12:00:00")
.toLocaleDateString("ru-RU",{weekday:"short"})
.replace(".","")
.replace(/^./,x=>x.toUpperCase());
}

async function loadWeather(){

const d=await getJSON(weatherURL(city()));

S.weather=d;

renderWeather();

}

function renderWeather(){

const d=S.weather;
const c=d.current;
const w=WMO[c.weather_code]||["Неизвестно","•"];

document.getElementById("current").innerHTML=`

<div>

<div class="temp">
${num(c.temperature_2m)}°
</div>

<div class="condition">
${w[1]} ${w[0]}
</div>

<div class="feels">
Ощущается ${num(c.apparent_temperature)}° · ${esc(city().name)}
</div>

</div>

<div class="meta">

<div>Ветер <b>${num(c.wind_speed_10m)} км/ч</b></div>

<div>Порывы <b>${num(c.wind_gusts_10m)} км/ч</b></div>

<div>Влажность <b>${num(c.relative_humidity_2m)}%</b></div>

</div>

`;

const dd=d.daily;

document.getElementById("days").innerHTML=
dd.time.map((date,i)=>{

const wi=WMO[dd.weather_code[i]]||["","•"];

return `

<button
class="day ${i===S.day?"selected":""}"
onclick="selectDay(${i})"
>

<div>
<div class="dn">${dayName(date,i)}</div>
<div class="dd">${dateShort(date)}</div>
</div>

<div class="di">
${wi[1]}
</div>

<div></div>

<div class="dt">
${num(dd.temperature_2m_max[i])}° /
${num(dd.temperature_2m_min[i])}°
</div>

<div class="dr">
💧 ${num(dd.precipitation_probability_max[i])}%
</div>

</button>

`;

}).join("");

renderChart();

}

function hourlyForDay(day){

const h=S.weather.hourly;
const target=S.weather.daily.time[day];

const result=[];

for(let i=0;i<h.time.length;i++){

if(String(h.time[i]).startsWith(target)){
result.push(i);
}

}

return result;

}

function selectDay(i){

S.day=i;

document
.querySelectorAll(".day")
.forEach((b,n)=>{
b.classList.toggle("selected",n===i)
});

renderChart();

}

function renderChart(){

const h=S.weather?.hourly;

if(!h)return;

const rows=hourlyForDay(S.day);

if(!rows.length){

document.getElementById("chart").innerHTML=
'<div class="muted">Почасовые данные недоступны.</div>';

return;

}

const pts=rows.map(i=>({

i,

time:time(h.time[i]),

temp:Number(h.temperature_2m[i]),

feels:Number(h.apparent_temperature[i]),

rain:Number(h.precipitation_probability[i]??0),

precip:Number(h.precipitation[i]??0),

wind:Number(h.wind_speed_10m[i]??0),

gust:Number(h.wind_gusts_10m[i]??0),

code:Number(h.weather_code[i]??-1)

}));

S.chartPoints=pts;

const W=720;
const H=210;
const L=38;
const R=12;
const T=18;
const B=30;

const PW=W-L-R;
const PH=H-T-B;

const vals=
S.metric==="temp"
?pts.map(p=>p.temp)
:S.metric==="rain"
?pts.map(p=>p.rain)
:pts.map(p=>p.wind);

let min=Math.floor(Math.min(...vals));
let max=Math.ceil(Math.max(...vals));

if(min===max){
min-=1;
max+=1;
}

const x=i=>
L+
(
pts.length===1
?PW/2
:i*PW/(pts.length-1)
);

const y=v=>
T+
(max-v)*PH/(max-min);

const path=pts
.map((p,i)=>
(i?"L":"M")+
x(i).toFixed(1)+
" "+
y(vals[i]).toFixed(1)
)
.join(" ");

const area=
path+
" L "+
x(pts.length-1)+
" "+
(H-B)+
" L "+
x(0)+
" "+
(H-B)+
" Z";

const gid="g"+Date.now();

const grid=[
max,
Math.round((max+min)/2),
min
]
.map(v=>`

<line
x1="${L}"
y1="${y(v)}"
x2="${W-R}"
y2="${y(v)}"
stroke="#242d38"
/>

<text
x="${L-7}"
y="${y(v)+4}"
text-anchor="end"
fill="#8993a3"
font-size="13"
>
${num(v)}
</text>

`)
.join("");

const labels=pts
.map((p,i)=>
(i%4===0||i===pts.length-1)
?`

<text
x="${x(i)}"
y="${H-9}"
text-anchor="middle"
fill="#aeb7c4"
font-size="12"
>
${p.time}
</text>

`
:""
)
.join("");

const bars=
S.metric==="rain"

?pts.map((p,i)=>{

const bh=(p.rain/100)*PH;

return `

<rect
x="${x(i)-4}"
y="${H-B-bh}"
width="8"
height="${bh}"
rx="4"
fill="#5da8ff"
opacity=".55"
/>

`;

}).join("")

:S.metric==="wind"

?pts.map((p,i)=>{

const bh=
Math.min(
PH,
(p.wind/Math.max(1,max))*PH
);

return `

<rect
x="${x(i)-3}"
y="${H-B-bh}"
width="6"
height="${bh}"
rx="3"
fill="#63d6ff"
opacity=".45"
/>

`;

}).join("")

:"";

const dots=
S.metric==="temp"

?pts.map((p,i)=>`

<circle
class="chart-dot"
data-i="${i}"
cx="${x(i)}"
cy="${y(vals[i])}"
r="4.5"
fill="#e8c969"
stroke="#0b0e13"
stroke-width="2"
/>

`).join("")

:"";

const stroke=
S.metric==="rain"
?"#5da8ff"
:S.metric==="wind"
?"#63d6ff"
:"#e8c969";

document.getElementById("chart").innerHTML=`

<div class="chart-box">

<svg
id="weatherChart"
class="chart-svg"
viewBox="0 0 ${W} ${H}"
preserveAspectRatio="none"
>

${grid}

<defs>

<linearGradient
id="${gid}"
x1="0"
y1="0"
x2="0"
y2="1"
>

<stop
offset="0"
stop-color="#e8c969"
stop-opacity=".25"
/>

<stop
offset="1"
stop-color="#e8c969"
stop-opacity="0"
/>

</linearGradient>

</defs>

${
S.metric==="temp"
?
`<path d="${area}" fill="url(#${gid})"/>`
:""
}

<path
d="${path}"
fill="none"
stroke="${stroke}"
stroke-width="4"
stroke-linecap="round"
stroke-linejoin="round"
/>

${bars}

${dots}

${labels}

<line
id="chartMarker"
x1="${x(0)}"
y1="${T}"
x2="${x(0)}"
y2="${H-B}"
stroke="#fff"
stroke-width="1.5"
opacity=".75"
/>

</svg>

<div
class="chart-read"
id="chartRead"
></div>

</div>

`;

bindChart();

}

function bindChart(){

const svg=document.getElementById("weatherChart");
const read=document.getElementById("chartRead");
const marker=document.getElementById("chartMarker");
const pts=S.chartPoints;

if(!svg||!pts.length)return;

let active=0;

const show=i=>{

i=Math.max(
0,
Math.min(
pts.length-1,
Number(i)
)
);

active=i;

const p=pts[i];

const W=720;
const L=38;
const R=12;
const PW=W-L-R;

const left=
L+
(
pts.length===1
?PW/2
:i*PW/(pts.length-1)
);

marker.setAttribute("x1",left);
marker.setAttribute("x2",left);

svg
.querySelectorAll(".chart-dot")
.forEach((d,n)=>{
d.setAttribute(
"r",
n===i?8:4.5
);
});

let value=
S.metric==="temp"
?num(p.temp)+"°C"
:S.metric==="rain"
?num(p.rain)+"%"
:num(p.wind)+" км/ч";

read.innerHTML=`

<strong>
${esc(p.time)} · ${value}
</strong>

<br>

Ощущается ${num(p.feels)}°
· дождь ${num(p.precip,1)} мм
· порывы ${num(p.gust)} км/ч

`;

};

const pick=e=>{

const r=svg.getBoundingClientRect();

const px=Math.max(
0,
Math.min(
r.width,
e.clientX-r.left
)
);

const i=
Math.round(
px/r.width*(pts.length-1)
);

show(i);

};

svg.addEventListener(
"pointerdown",
e=>{

svg.setPointerCapture?.(e.pointerId);
pick(e);

}
);

svg.addEventListener(
"pointermove",
e=>{

if(e.buttons){
pick(e);
}

}
);

svg
.querySelectorAll(".chart-dot")
.forEach(d=>
d.addEventListener(
"click",
()=>show(d.dataset.i)
)
);

show(active);

}

function parseKp(a){

return Array.isArray(a)

?a
.map(x=>({

time:x.time_tag??x[0],

kp:Number(
x.kp??
x.Kp??
x[1]
),

observed:x.observed??x[2]

}))
.filter(
x=>x.time&&Number.isFinite(x.kp)
)
.sort(
(a,b)=>
new Date(a.time)-new Date(b.time)
)

:[];

}

async function loadKp(){

try{

const[a,b]=await Promise.all([

getJSON(
"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
),

getJSON(
"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"
)

]);

S.kp=parseKp(a);
S.kpf=parseKp(b);

renderKp();

}catch(e){

document.getElementById("magnetic").innerHTML=
'<div class="muted" style="padding-top:15px">NOAA недоступен.</div>';

}

${f.map(x=>`

${time(x.time)}
</small>

<b>
Kp ${num(x.kp,1)}
</b>

`).join("")}

</div>

`;

}

function dist(a,b,c,d){

const R=6371;

const r=Math.PI/180;

const p=a*r;
const q=c*r;

const dp=(c-a)*r;
const dl=(d-b)*r;

const x=
Math.sin(dp/2)**2+
Math.cos(p)*
Math.cos(q)*
Math.sin(dl/2)**2;

return 2*
R*
Math.asin(
Math.sqrt(x)
);

}

async function loadQuakes(){

try{

const d=await getJSON(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
);

const c=city();

S.quakes=
(d.features||[])
.map(f=>{

const[
lon,
lat,
depth
]=f.geometry.coordinates;

return{

mag:Number(f.properties.mag),

place:
f.properties.place||
"Неизвестно",

time:
f.properties.time,

depth,

distance:
dist(
c.lat,
c.lon,
lat,
lon
)

};

})
.filter(
q=>
Number.isFinite(q.mag)&&
q.distance<=500
)
.sort(
(a,b)=>b.time-a.time
)
.slice(0,8);

document.getElementById("seismo").innerHTML=`

${esc(q.place)}

M ${num(q.mag,1)}

}catch(e){

}

function moon(){

const syn=29.530588853;

const known=
new Date(
Date.UTC(
2000,
0,
6,
18,
14
)
);

const age=
(
(
new Date()-known
)/86400000
%syn+
syn
)%syn;

const p=age/syn;

let n,i;

if(age<1.85){
n="Новолуние";
i="🌑";
}
else if(age<7.38){
n="Растущий серп";
i="🌒";
}
else if(age<9.22){
n="Первая четверть";
i="🌓";
}
else if(age<14.76){
n="Растущая Луна";
i="🌔";
}
else if(age<16.61){
n="Полнолуние";
i="🌕";
}
else if(age<22.15){
n="Убывающая Луна";
i="🌖";
}
else if(age<23.99){
n="Последняя четверть";
i="🌗";
}
else{
n="Убывающий серп";
i="🌘";
}

return[
n,
i,
age,
.5*
(1-Math.cos(2*Math.PI*p))*
100
];

}
