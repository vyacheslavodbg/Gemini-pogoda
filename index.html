<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AURA GEO METEO</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11151d;
  --panel2:#181e28;
  --line:#303846;
  --text:#f4f6fa;
  --muted:#aeb7c5;
  --gold:#e7ca72;
  --blue:#79aaff;
  --green:#65d58a;
  --orange:#ffb45e;
  --red:#ff7373;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  overscroll-behavior:none;
}

button,
a{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100dvh;
  padding:
    env(safe-area-inset-top)
    12px
    calc(72px + env(safe-area-inset-bottom));
  overflow:hidden;
}

.header{
  height:125px;
  background:linear-gradient(145deg,#171c26,#0f131a);
  border:1px solid #343b48;
  border-radius:20px;
  padding:14px 16px;
  position:relative;
  overflow:hidden;
}

.header:after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-70px;
  bottom:-100px;
  border-radius:50%;
  background:rgba(231,202,114,.08);
  pointer-events:none;
}

.brand-icon{
  font-size:22px;
  line-height:1;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:clamp(28px,8.5vw,44px);
  line-height:1;
  letter-spacing:-1.2px;
  white-space:nowrap;
}

.gold{
  color:var(--gold);
}

.subtitle{
  margin-top:5px;
  color:#d6dce5;
  font-size:12px;
}

.status{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.city-tabs{
  position:absolute;
  right:12px;
  bottom:12px;
  display:flex;
  gap:6px;
  z-index:2;
}

.city-btn{
  border:1px solid #4b5361;
  background:#202631;
  color:#e5e9ef;
  padding:6px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.city-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111318;
}

.telegram{
  height:72px;
  margin-top:8px;
  padding:10px 13px;
  border:1px solid #2f3947;
  border-radius:16px;
  background:#10151d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.telegram-title{
  font-size:13px;
  font-weight:800;
}

.telegram-text{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.telegram-btn{
  flex:0 0 auto;
  display:block;
  padding:8px 10px;
  border-radius:9px;
  background:#2a75d6;
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

.screen{
  height:calc(
    100dvh -
    221px -
    env(safe-area-inset-top) -
    env(safe-area-inset-bottom)
  );
  margin-top:8px;
  min-height:0;
}

.page{
  display:none;
  width:100%;
  height:100%;
  min-height:0;
}

.page.active{
  display:block;
}

.card{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  overflow:hidden;
}

.card-head{
  height:28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.card-action{
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.muted{
  color:var(--muted);
}

.empty{
  color:var(--muted);
  font-size:11px;
  padding:10px 0;
}

.current{
  height:108px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.temp{
  font-size:50px;
  line-height:1;
  font-weight:800;
  letter-spacing:-2px;
}

.weather-main{
  margin-top:5px;
  font-size:15px;
  font-weight:700;
}

.weather-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.current-right{
  text-align:right;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}

.metric{
  min-width:0;
  background:var(--panel2);
  border-radius:11px;
  padding:8px;
}

.metric-label{
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
}

.metric-value{
  margin-top:3px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.forecast-title{
  margin:11px 0 5px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.forecast{
  height:88px;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.day{
  min-width:0;
  height:88px;
  border:1px solid #29313d;
  background:var(--panel2);
  border-radius:10px;
  color:var(--text);
  padding:6px 3px;
  text-align:center;
}

.day.active{
  border-color:var(--gold);
}

.day-name{
  font-size:9px;
  font-weight:800;
}

.day-date{
  margin-top:1px;
  color:var(--muted);
  font-size:7px;
}

.day-icon{
  margin:4px 0;
  font-size:19px;
}

.day-temp{
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}

.day-rain{
  margin-top:3px;
  color:var(--blue);
  font-size:7px;
}

.page-note{
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
}

.air-main{
  display:flex;
  align-items:center;
  gap:18px;
  height:80px;
}

.air-score{
  font-size:48px;
  line-height:1;
  font-weight:900;
}

.good{
  color:var(--green);
}

.warn{
  color:var(--orange);
}

.bad{
  color:var(--red);
}

.air-label{
  font-size:15px;
  font-weight:800;
}

.pollutants{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:5px;
  margin-top:9px;
}

.pollutant{
  min-width:0;
  border:0;
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:8px 2px;
}

.pollutant b{
  display:block;
  font-size:13px;
}

.pollutant span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:7px;
  line-height:1.05;
}

.air-bars{
  margin-top:10px;
  display:grid;
  gap:5px;
}

.air-bar{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--panel2);
  border-radius:9px;
  padding:0 9px;
  font-size:10px;
}

.air-aqi{
  margin-top:8px;
  display:grid;
  gap:4px;
}

.air-aqi-row{
  height:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  background:var(--panel2);
  border-radius:8px;
  font-size:9px;
}

.kp-main{
  height:112px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.kp-number{
  font-size:58px;
  line-height:1;
  font-weight:900;
}

.kp-status{
  text-align:right;
}

.kp-label{
  font-size:18px;
  font-weight:900;
}

.kp-help{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.kp-warning{
  margin-top:8px;
  padding:9px 10px;
  border:1px solid rgba(255,115,115,.35);
  background:rgba(255,115,115,.08);
  border-radius:10px;
  font-size:10px;
  line-height:1.3;
}

.section-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:4px 0 6px;
}

.kp-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
}

.kp-item{
  background:var(--panel2);
  border-radius:9px;
  padding:7px 3px;
  text-align:center;
}

.kp-item time{
  display:block;
  color:var(--muted);
  font-size:8px;
}

.kp-item b{
  display:block;
  margin-top:2px;
  font-size:12px;
}

.quake-summary{
  display:flex;
  align-items:center;
  gap:15px;
  height:82px;
}

.quake-count{
  font-size:46px;
  font-weight:900;
}

.quake-count-label{
  color:var(--muted);
  font-size:11px;
}

.quake-list{
  display:grid;
  gap:6px;
}

.quake{
  width:100%;
  min-width:0;
  height:40px;
  border:0;
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 9px;
  text-align:left;
}

.quake span{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:10px;
}

.quake b{
  flex:0 0 auto;
  font-size:13px;
}

.quake small{
  flex:0 0 auto;
  color:var(--muted);
  font-size:9px;
}

.moon-main{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.moon-icon{
  font-size:82px;
}

.moon-name{
  font-size:21px;
  font-weight:900;
}

.moon-data{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.bottom{
  position:fixed;
  z-index:20;
  left:0;
  bottom:0;
  width:100%;
  height:calc(66px + env(safe-area-inset-bottom));
  padding:5px 6px env(safe-area-inset-bottom);
  background:rgba(9,11,16,.96);
  border-top:1px solid #252c37;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  padding:3px 0;
}

.nav-icon{
  display:block;
  font-size:18px;
  line-height:20px;
}

.nav.active{
  color:var(--gold);
}

.modal{
  position:fixed;
  z-index:50;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.78);
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:520px;
  background:#11151d;
  border:1px solid #39414e;
  border-radius:18px;
  padding:15px;
  overflow:hidden;
}

.sheet-head{
  height:35px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sheet h2{
  margin:0;
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:1px solid #414957;
  border-radius:50%;
  background:#1b212b;
  color:#fff;
  font-size:20px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  margin-top:9px;
}

.detail{
  background:var(--panel2);
  border-radius:10px;
  padding:8px;
}

.detail small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.detail b{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.hour-title{
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

.hour-grid{
  margin-top:5px;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
}

.hour{
  background:var(--panel2);
  border-radius:8px;
  padding:5px 2px;
  text-align:center;
}

.hour-time{
  font-size:8px;
  color:var(--muted);
}

.hour-icon{
  font-size:16px;
  margin:2px 0;
}

.hour-temp{
  font-size:10px;
  font-weight:800;
}

.hour-rain{
  font-size:7px;
  color:var(--blue);
  margin-top:2px;
}

.hour-wind{
  font-size:7px;
  color:var(--muted);
  margin-top:2px;
}

.guide{
  display:grid;
  gap:6px;
  margin-top:9px;
}

.guide-item{
  background:var(--panel2);
  border-radius:10px;
  padding:9px;
  font-size:11px;
  line-height:1.35;
}

@media(max-width:430px){

  .app{
    padding-left:9px;
    padding-right:9px;
  }

  .header{
    height:119px;
    padding:13px;
  }

  h1{
    font-size:29px;
  }

  .subtitle{
    font-size:11px;
  }

  .status{
    font-size:10px;
  }

  .telegram{
    height:68px;
  }

  .screen{
    height:calc(
      100dvh -
      211px -
      env(safe-area-inset-top) -
      env(safe-area-inset-bottom)
    );
  }

  .card{
    padding:12px;
  }

  .temp{
    font-size:46px;
  }

  .current{
    height:101px;
  }

  .metrics{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .forecast{
    height:86px;
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .day{
    height:86px;
  }

  .day:nth-child(n+5){
    display:none;
  }

  .pollutants{
    gap:3px;
  }

  .pollutant b{
    font-size:12px;
  }

  .pollutant span{
    font-size:6.5px;
  }

  .kp-number{
    font-size:52px;
  }

  .kp-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .moon-main{
    height:125px;
  }

  .moon-icon{
    font-size:70px;
  }

}

@media(max-height:700px){

  .header{
    height:108px;
    padding:10px 13px;
  }

  .brand-icon{
    font-size:18px;
    margin-bottom:3px;
  }

  h1{
    font-size:26px;
  }

  .subtitle{
    margin-top:3px;
    font-size:10px;
  }

  .status{
    margin-top:3px;
    font-size:9px;
  }

  .city-tabs{
    bottom:9px;
  }

  .telegram{
    height:60px;
    margin-top:6px;
  }

  .screen{
    margin-top:6px;
    height:calc(
      100dvh -
      180px -
      env(safe-area-inset-top) -
      env(safe-area-inset-bottom)
    );
  }

  .current{
    height:86px;
  }

  .temp{
    font-size:40px;
  }

  .weather-main{
    font-size:13px;
  }

  .metrics{
    gap:4px;
  }

  .metric{
    padding:6px;
  }

  .forecast-title{
    margin-top:7px;
  }

  .forecast,
  .day{
    height:78px;
  }

  .day-icon{
    margin:2px 0;
    font-size:16px;
  }

  .moon-main{
    height:105px;
  }

  .moon-icon{
    font-size:60px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand-icon">☀</div>

  <h1>
    AURA <span class="gold">GEO METEO</span>
  </h1>

  <div class="subtitle">
    Premium геометеорологический мониторинг
  </div>

  <div id="status" class="status">
    Синхронизация...
  </div>

  <div class="city-tabs">

    <button class="city-btn active" data-city="varna">
      ВАРНА
    </button>

    <button class="city-btn" data-city="odesa">
      ОДЕССА
    </button>

  </div>

</header>

<section class="telegram">

  <div>

    <div class="telegram-title">
      Уведомления Telegram
    </div>

    <div class="telegram-text">
      Kp≥5 · сильная погода · землетрясения
    </div>

  </div>

  <a
    class="telegram-btn"
    href="#"
    id="telegramLink"
  >
    Подключить
  </a>

</section>

<main class="screen">

<section class="page active" id="page-weather">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Погода
      </div>

      <button
        class="card-action"
        onclick="refreshAll()"
      >
        Обновить
      </button>

    </div>

    <div id="weather">
      Загрузка...
    </div>

  </div>

</section>

<section class="page" id="page-air">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Воздух
      </div>

      <button
        class="card-action"
        onclick="openAirGuide()"
      >
        Что означает
      </button>

    </div>

    <div id="air">
      Загрузка...
    </div>

  </div>

</section>

<section class="page" id="page-magnetic">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Магнитные бури
      </div>

      <button
        class="card-action"
        onclick="openKpGuide()"
      >
        Шкала Kp
      </button>

    </div>

    <div id="magnetic">
      Загрузка...
    </div>

  </div>

</section>

<section class="page" id="page-seismo">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Землетрясения
      </div>

      <button
        class="card-action"
        onclick="loadQuakes()"
      >
        Обновить
      </button>

    </div>

    <div id="seismo">
      Загрузка...
    </div>

  </div>

</section>

<section class="page" id="page-moon">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Луна
      </div>

    </div>

    <div id="moon">
      Загрузка...
    </div>

  </div>

</section>

</main>

</div>

<nav class="bottom">

  <button class="nav active" data-page="weather">
    <span class="nav-icon">☁</span>
    Погода
  </button>

  <button class="nav" data-page="air">
    <span class="nav-icon">◉</span>
    Воздух
  </button>

  <button class="nav" data-page="magnetic">
    <span class="nav-icon">⚡</span>
    Магнитные
  </button>

  <button class="nav" data-page="seismo">
    <span class="nav-icon">⌁</span>
    Сейсмо
  </button>

  <button class="nav" data-page="moon">
    <span class="nav-icon">☾</span>
    Луна
  </button>

</nav>

<div
  class="modal"
  id="modal"
  onclick="if(event.target===this)closeModal()"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2 id="modalTitle">
        Подробно
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   CITY DATA
========================================================= */

const CITIES={
  varna:{
    name:"Варна",
    country:"Болгария",
    lat:43.21,
    lon:27.91
  },

  odesa:{
    name:"Одесса",
    country:"Украина",
    lat:46.48,
    lon:30.72
  }
};


/* =========================================================
   APPLICATION STATE
========================================================= */

const state={
  city:"varna",
  weather:null,
  air:null,
  kp:null,
  kpForecast:null,

function city(){
  return CITIES[state.city];
}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


function num(v,dec=0){

  const n=Number(v);

  return Number.isFinite(n)
    ?n.toFixed(dec)
    :"—";

}


function weatherInfo(code){

  return WMO[Number(code)] || ["Неизвестно","•"];

}


function formatTime(value){

  if(!value)
    return "—";

  const d=new Date(value);

  if(Number.isNaN(d.getTime()))
    return String(value).slice(11,16);

  return d.toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatDate(iso){

  if(!iso)
    return "—";

  const d=new Date(iso+"T12:00:00");

  if(Number.isNaN(d.getTime()))
    return "—";

  return d.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function dayName(iso){

  const d=new Date(iso+"T12:00:00");

  if(Number.isNaN(d.getTime()))
    return "—";

  return d
    .toLocaleDateString(
      "ru-RU",
      {weekday:"short"}
    )
    .replace(".","");

}


function setStatus(text){

  const el=document.getElementById("status");

  if(el)
    el.textContent=text;

}


function showError(id,msg){

  const el=document.getElementById(id);

  if(!el)
    return;

  el.innerHTML=
    '<div class="bad" style="padding:12px 0;font-size:11px">'+
    esc(msg)+
    "</div>";

}


async function getJSON(url){

  const response=await fetch(
    url,
    {
      cache:"no-store",
      headers:{
        Accept:"application/json"
      }
    }
  );

  if(!response.ok)
    throw new Error(
      "HTTP "+response.status
    );

  return await response.json();

}

/* =========================================================
   NOAA Kp
========================================================= */

function parseKpRows(data){

  if(!Array.isArray(data))
    return[];

  const rows=[];

  for(const row of data){

    let time=null;
    let kp=null;
    let observed=null;
    let scale=null;

    /*
      NEW NOAA OBJECT FORMAT
    */

    if(
      row &&
      typeof row==="object" &&
      !Array.isArray(row)
    ){

      time=
        row.time_tag ??
        row.observation_time ??
        row.time ??
        row.valid_time ??
        null;

      kp=Number(
        row.Kp ??
        row.kp ??
        row.kp_index ??
        row.planetary_k_index
      );

      observed=
        row.observed ??
        row.status ??
        null;

      scale=
        row.noaa_scale ??
        row.scale ??
        null;

    }

    /*
      OLD NOAA ARRAY FORMAT
    */

    else if(Array.isArray(row)){

      if(row.length>=2){

        time=row[0];

        kp=Number(row[1]);

        observed=row[2] ?? null;

        scale=row[3] ?? null;

      }

    }

    if(
      time &&
      Number.isFinite(kp)
    ){

      const d=new Date(time);

      if(!Number.isNaN(d.getTime())){

        rows.push({

          time,
          kp,
          observed,
          scale,
          timestamp:d.getTime()

        });

      }

    }

  }

  return rows.sort(
    (a,b)=>
      a.timestamp-b.timestamp
  );

}


async function loadKp(){

  try{

    const[
      currentData,
      forecastData
    ]=await Promise.all([

      getJSON(
        "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
      ),

      getJSON(

      )

    ]);

    state.kp=

  }catch(error){

    );

    showError(
      "magnetic",

    );

}


function kpLevel(kp){

  const n=Number(kp);

  if(n>=9)
    return[
      "G5",
      "Экстремальная буря",
      "bad"
    ];

  if(n>=8)
    return[
      "G4",
      "Очень сильная буря",
      "bad"
    ];

  if(n>=7)
    return[
      "G3",
      "Сильная буря",
      "bad"
    ];

  if(n>=6)
    return[
      "G2",
      "Умеренная буря",
      "warn"
    ];

  if(n>=5)
    return[
      "G1",
      "Магнитная буря",
      "warn"
    ];

  if(n>=4)
    return[
      "Kp 4",
      "Возмущённая обстановка",
      "warn"
    ];

  return[
    "Kp 0–3",
    "Спокойная обстановка",
    "good"
  ];

}


function currentKp(){

  if(
    !state.kp ||
    !state.kp.length
  )
    return null;

  return state.kp[
    state.kp.length-1
  ];

}


function futureKpForecast(){

  const now=Date.now();

  return(state.kpForecast||[])
    .filter(
      item=>
        item.timestamp>now &&
        item.observed!=="observed"
    )
    .sort(
      (a,b)=>
        a.timestamp-b.timestamp
    );

}


function renderMagnetic(){

  const el=
    document.getElementById(
      "magnetic"
    );

  const cur=currentKp();

  if(!cur){

    el.innerHTML=
      '<div class="empty">Kp сейчас недоступен.</div>';

    return;

  }

  const level=
    kpLevel(cur.kp);

  const forecast=
    futureKpForecast();

  const storms=
    forecast
      .filter(x=>x.kp>=5)
      .slice(0,8);

  const disturbances=

  const warning=
    Number(cur.kp)>=5
      ?`
        <div class="kp-warning">
          <b>ВНИМАНИЕ: магнитная буря</b><br>
          Текущий Kp ${num(cur.kp,1)} · ${level[0]}
        </div>
      `
      :"";

  el.innerHTML=`

    <div class="kp-main">

      <div>

        <div class="kp-number">
          ${num(cur.kp,1)}
        </div>

        <div
          class="muted"
          style="font-size:10px"
        >
          Kp сейчас ·
          ${formatTime(cur.time)}
        </div>

      </div>

      <div class="kp-status">

        <div
          class="kp-label ${level[2]}"
        >
          ${level[0]}
        </div>

        <div class="kp-help">
          ${level[1]}
        </div>

      </div>

    </div>

    ${warning}

    <div class="section-label">
      Прогноз Kp
    </div>

    <div class="kp-list">

      ${
        disturbances.length

        ?

        disturbances.map(
          x=>`

          <div class="kp-item">

            <time>
              ${formatTime(x.time)}
            </time>

            <b>
              Kp ${num(x.kp,1)}
            </b>

          </div>

        `
        ).join("")

        :

        '<div class="empty">'+
        'Ближайших возмущений Kp≥4 нет.'+
        '</div>'
      }

    </div>

    <div class="section-label">
      Бури Kp≥5
    </div>

    ${
      storms.length

      ?

      storms.slice(0,4).map(
        x=>`

        <div class="kp-item" style="margin-bottom:5px">

          <time>
            ${formatTime(x.time)}
          </time>

          <b class="warn">
            ${x.scale || "G1+"}
            · Kp ${num(x.kp,1)}
          </b>

        </div>

      `
      ).join("")

      :

      '<div class="empty">'+
      'В прогнозе Kp≥5 не обнаружено.'+
      '</div>'
    }

    <div class="page-note">
      NOAA Kp обновляется с интервалом 3 часа.
    </div>

  `;

}

      cls:""
    };

  return AQI_BANDS.find(

}

/* =========================================================
   EARTHQUAKES
========================================================= */

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=6371;
  const rad=Math.PI/180;

  const p1=lat1*rad;
  const p2=lat2*rad;

  const dp=(lat2-lat1)*rad;
  const dl=(lon2-lon1)*rad;

  const a=
    Math.sin(dp/2)**2+
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dl/2)**2;

  return(
    2*R*
    Math.asin(
      Math.sqrt(a)
    )
  );

}


async function loadQuakes(){

  try{

    const data=
      await getJSON(
        "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
      );

    const c=city();

    state.quakes=
      (data.features||[])
      .map(
        feature=>{

          const coords=
            feature.geometry?.coordinates||[];

          const lon=Number(coords[0]);
          const lat=Number(coords[1]);
          const depth=Number(coords[2]);

          const properties=
            feature.properties||{};

          return{

            mag:Number(properties.mag),

            place:
              properties.place||
              "Неизвестно",

            time:Number(
              properties.time
            ),

            lat,
            lon,
            depth,

            url:
              properties.url||
              null,

            distance:
              distanceKm(
                c.lat,
                c.lon,
                lat,
                lon
              )

          };

        }
      )

      .filter(
        q=>
          Number.isFinite(q.mag) &&
          Number.isFinite(q.time) &&
          Number.isFinite(q.distance) &&
          q.distance<=500
      )

      .sort(
        (a,b)=>
          b.time-a.time
      )

      .slice(0,8);

    renderEarthquakes();

  }catch(error){

    console.error(
      "USGS error:",
      error
    );

    showError(
      "seismo",
      "Не удалось загрузить данные USGS."
    );

  }

}

/* =========================================================
   MOON
========================================================= */

function calculateMoon(
  date=new Date()
){

  const synodic=29.530588853;

  const known=
    new Date(
      Date.UTC(
        2000,
        0,
        6,
        18,
        14,
        0
      )
    );

  const days=
    (date-known)/86400000;

  const age=
    ((days%synodic)+synodic)%synodic;

  const phase=
    age/synodic;

  let name;
  let icon;

  if(age<1.85){

    name="Новолуние";
    icon="🌑";

  }else if(age<7.38){

    name="Растущий серп";
    icon="🌒";

  }else if(age<9.22){

    name="Первая четверть";
    icon="🌓";

  }else if(age<14.76){

    name="Растущая Луна";
    icon="🌔";

  }else if(age<16.61){

    name="Полнолуние";
    icon="🌕";

  }else if(age<22.15){

    name="Убывающая Луна";
    icon="🌖";

  }else if(age<23.99){

    name="Последняя четверть";
    icon="🌗";

  }else{

    name="Убывающий серп";
    icon="🌘";

  }

  return{

    name,
    icon,
    age,

    illumination:
      0.5*
      (
        1-
        Math.cos(
          2*Math.PI*phase
        )
      )*
      100

  };

}


function renderMoon(){

  const m=
    calculateMoon();

  const el=
    document.getElementById(

  if(!el)

  el.innerHTML=`

/* =========================================================
   REFRESH
========================================================= */

async function refreshAll(){

  if(state.loading)
    return;

  state.loading=true;

  setStatus(
    "Синхронизация..."
  );

  try{

    await Promise.allSettled([

      loadWeather(),
      loadAir(),
      loadKp(),
      loadQuakes()

    ]);

    renderMoon();

    state.lastUpdate=
      new Date();

    setStatus(
      "Обновлено "+
      state.lastUpdate
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
    );

  }finally{

    state.loading=false;

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

function openPage(page){

  const target=
    document.getElementById(
      "page-"+page
    );

  if(!target)
    return;

  document
    .querySelectorAll(".page")
    .forEach(
      p=>
        p.classList.remove("active")
    );

  target.classList.add("active");

  document
    .querySelectorAll(".nav")
    .forEach(
      n=>
        n.classList.remove("active")
    );

  const button=
    document.querySelector(
      '.nav[data-page="'+page+'"]'
    );

  if(button)
    button.classList.add("active");

  closeModal();

}


/* =========================================================
   EVENT LISTENERS
========================================================= */

document
  .querySelectorAll(".nav")
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>{
          openPage(
            button.dataset.page
          );
        }
      );

    }
  );


document
  .querySelectorAll(".city-btn")
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        async()=>{

          if(
            button.dataset.city===
            state.city
          )
            return;

          document
            .querySelectorAll(".city-btn")
            .forEach(
              b=>
                b.classList.remove("active")
            );

          button.classList.add("active");

          state.city=
            button.dataset.city;

          closeModal();

          renderMoon();

          await refreshAll();

        }
      );

    }
  );

      alert(

    }
  );


document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape")
      closeModal();

  }
);


/* =========================================================
   START
========================================================= */

renderMoon();

refreshAll();

setInterval(
  refreshAll,
  15*60*1000
);

</script>
