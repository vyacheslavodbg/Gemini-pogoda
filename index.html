<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>AURA GEO METEO</title>

<style>
:root{
--bg:#08090c;
--panel:rgba(18,20,25,.78);
--line:rgba(255,255,255,.08);
--text:#f3f2ee;
--muted:#a0a3ac;
--gold:#c7a86b;
--gold2:#ead7a7;
--green:#75d5a4;
--red:#ef727c;
--blue:#8ca9ff;
--cyan:#76d7e8;
}

*{
box-sizing:border-box
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
-webkit-text-size-adjust:100%
}

body{
background:
radial-gradient(circle at 70% -10%,rgba(199,168,107,.09),transparent 34%),
linear-gradient(180deg,#08090c,#0b0d11 55%,#07080a)
}

button{
font:inherit;
color:inherit;
border:0;
background:none;
-webkit-tap-highlight-color:transparent
}

.ambient{
position:fixed;
width:320px;
height:320px;
filter:blur(100px);
opacity:.08;
pointer-events:none;
border-radius:50%
}

.ambient-a{
background:#b58a45;
top:10%;
right:-170px
}

.ambient-b{
background:#5369a8;
bottom:-170px;
left:-150px
}

.app{
width:100%;
height:100dvh;
padding:
env(safe-area-inset-top)
13px
calc(68px + env(safe-area-inset-bottom))
13px;
overflow:hidden
}

.topbar{
height:58px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--line)
}

.brand{
display:flex;
gap:11px;
align-items:center
}

.brand-mark{
display:grid;
place-items:center;
width:36px;
height:36px;
border:1px solid rgba(199,168,107,.55);
border-radius:11px;
color:var(--gold2);
font-size:17px;
font-weight:800
}

.brand-name{
font-weight:800;
font-size:18px;
letter-spacing:.15em
}

.brand-sub{
font-size:8px;
letter-spacing:.2em;
color:var(--muted);
margin-top:3px
}

.status{
display:flex;
align-items:center;
gap:7px;
font-size:10px;
color:#999ca5
}

.live{
width:7px;
height:7px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 11px var(--green)
}

.screen{
height:calc(
100dvh -
58px -
68px -
env(safe-area-inset-top) -
env(safe-area-inset-bottom)
);
overflow:hidden
}

.page{
display:none;
height:100%;
overflow:hidden
}

.page.active{
display:block
}

/* WEATHER */

.weather-page{
height:100%;
display:grid;
grid-template-rows:76px 112px 39px 202px 1fr
}

.hero{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.location-name{
font-size:28px;
font-weight:750;
letter-spacing:-.045em
}

.location-state{
font-size:9px;
letter-spacing:.17em;
color:var(--muted);
margin-top:5px
}

.city-switch{
display:flex;
padding:3px;
border:1px solid var(--line);
border-radius:14px;
background:rgba(255,255,255,.025)
}

.city{
padding:9px 11px;
border-radius:10px;
font-size:10px;
font-weight:700;
color:#858892
}

.city.active{
background:rgba(199,168,107,.14);
color:var(--gold2);
box-shadow:inset 0 0 0 1px rgba(199,168,107,.17)
}

.current{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.temp{
font-size:66px;
font-weight:750;
letter-spacing:-.075em;
line-height:.95
}

.condition{
font-size:16px;
font-weight:650;
margin-top:5px
}

.feels{
font-size:11px;
color:var(--muted);
margin-top:5px
}

.current-right{
text-align:right;
font-size:11px;
color:var(--muted);
line-height:2
}

.current-right strong{
color:#e1e0dd;
font-size:12px
}

.chart-head{
display:flex;
align-items:end;
justify-content:space-between
}

.chart-title{
font-size:10px;
letter-spacing:.16em;
color:var(--muted);
font-weight:700
}

.chart-tabs{
display:flex;
gap:4px
}

.chart-tab{
padding:5px 9px;
border-radius:9px;
font-size:10px;
color:#858892
}

.chart-tab.active{
background:rgba(199,168,107,.12);
color:var(--gold2)
}

.chart-box{
height:202px;
position:relative;
padding-top:2px
}

.chart-svg{
width:100%;
height:177px;
display:block;
touch-action:none;
overflow:visible
}

.chart-value{
font-size:14px;
font-weight:800;
fill:#f3f2ee;
paint-order:stroke;
stroke:#08090c;
stroke-width:4px;
stroke-linejoin:round;
pointer-events:none
}

.chart-marker{
pointer-events:none
}

.day-strip{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
align-items:stretch;
padding-top:4px
}

.day{
min-width:0;
border:1px solid var(--line);
border-radius:13px;
background:rgba(255,255,255,.018);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
padding:5px 2px
}

.day.selected{
border-color:rgba(199,168,107,.45);
background:rgba(199,168,107,.08)
}

.day-name{
font-size:10px;
font-weight:700;
color:#d2d1ce
}

.day-date{
font-size:8px;
color:#777a83
}

.day-icon{
font-size:19px;
line-height:21px
}

.day-temp{
font-size:9px;
font-weight:700
}

.day-rain{
font-size:8px;
color:var(--blue)
}

/* AIR */

.simple{
height:100%;
display:grid;
grid-template-rows:49px 1fr;
overflow:hidden
}

.page-title{
height:49px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.page-title h2{
margin:3px 0 0;
font-size:22px;
letter-spacing:-.035em
}

.kicker{
font-size:9px;
letter-spacing:.18em;
color:var(--muted)
}

.content{
height:100%;
overflow:hidden
}

.air-main{
height:100%;
display:grid;
grid-template-rows:112px 78px 1fr
}

.air-score{
display:flex;
align-items:center;
gap:18px;
border-bottom:1px solid var(--line)
}

.score{
font-size:62px;
font-weight:750;
letter-spacing:-.07em
}

.score small{
font-size:9px;
font-weight:500;
letter-spacing:.12em;
color:var(--muted)
}

.air-label{
font-size:18px;
font-weight:650
}

.air-sub{
font-size:11px;
color:var(--muted);
margin-top:5px
}

.pollutants{
display:grid;
grid-template-columns:repeat(5,1fr);
border-bottom:1px solid var(--line)
}

.pollutant{
display:flex;
flex-direction:column;
justify-content:center;
gap:5px;
padding-left:7px
}

.pollutant+.pollutant{
border-left:1px solid var(--line)
}

.pollutant span{
font-size:9px;
color:#858892;
letter-spacing:.08em
}

.pollutant strong{
font-size:15px
}

.pollutant small{
font-size:8px;
color:#777a83
}

.info-row{
height:45px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line);
font-size:12px
}

.info-row span{
color:var(--muted)
}

.info-row strong{
font-size:13px
}

/* MAGNETIC */

.kp-page{
height:100%;
display:grid;
grid-template-rows:108px 65px 1fr
}

.kp-hero{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line)
}

.kp-number{
font-size:64px;
font-weight:750;
letter-spacing:-.075em
}

.kp-label{
font-size:17px;
font-weight:650;
text-align:right
}

.kp-sub{
font-size:10px;
color:var(--muted);
margin-top:5px;
text-align:right
}

.kp-meter-wrap{
display:flex;
align-items:center
}

.kp-meter{
height:8px;
width:100%;
border-radius:99px;
background:linear-gradient(
90deg,
#536b78 0%,
#7f9271 45%,
#c19d58 65%,
#b96366 100%
);
overflow:hidden
}

.kp-fill{
height:100%;
width:0;
background:#fff;
box-shadow:0 0 12px #fff
}

.kp-list{
display:grid;
grid-template-rows:repeat(6,1fr);
border-top:1px solid var(--line)
}

.kp-row{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line);
font-size:12px
}

.kp-row span{
color:var(--muted)
}

.kp-row strong{
font-size:14px
}

/* EARTHQUAKES */

.quake-page{
height:100%;
display:grid;
grid-template-rows:88px 1fr
}

.quake-summary{
display:flex;
align-items:center;
gap:16px;
border-bottom:1px solid var(--line)
}

.quake-count{
font-size:60px;
font-weight:750;
letter-spacing:-.075em
}

.quake-summary-text{
font-size:14px;
font-weight:650
}

.quake-summary-sub{
font-size:10px;
color:var(--muted);
margin-top:5px
}

.quake-list{
display:grid;
grid-template-rows:repeat(8,1fr)
}

.quake{
display:grid;
grid-template-columns:55px 1fr 58px;
align-items:center;
gap:9px;
border-bottom:1px solid var(--line)
}

.mag{
font-size:17px;
font-weight:750;
color:var(--gold2)
}

.place{
font-size:11px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.qtime{
font-size:9px;
color:var(--muted);
margin-top:3px
}

.qdistance{
text-align:right;
font-size:10px;
color:var(--muted)
}

/* MOON */

.moon-page{
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.moon-icon{
font-size:92px;
line-height:1
}

.moon-name{
font-size:28px;
font-weight:750;
margin-top:20px
}

.moon-sub{
font-size:11px;
color:var(--muted);
margin-top:7px
}

.moon-data{
display:grid;
grid-template-columns:repeat(2,1fr);
width:100%;
max-width:320px;
margin-top:28px;
border-top:1px solid var(--line);
border-bottom:1px solid var(--line)
}

.moon-cell{
padding:15px
}

.moon-cell+.moon-cell{
border-left:1px solid var(--line)
}

.moon-cell span{
display:block;
font-size:8px;
color:var(--muted);
letter-spacing:.12em
}

.moon-cell strong{
display:block;
font-size:16px;
margin-top:6px
}

/* NAV */

.bottom-nav{
position:fixed;
z-index:50;
left:0;
right:0;
bottom:0;
height:calc(66px + env(safe-area-inset-bottom));
padding:
4px
7px
env(safe-area-inset-bottom);
display:grid;
grid-template-columns:repeat(5,1fr);
background:rgba(8,9,12,.95);
backdrop-filter:blur(18px);
border-top:1px solid var(--line)
}

.nav-btn{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#777a83;
font-size:10px;
font-weight:700
}

.nav-icon{
font-size:21px;
line-height:22px
}

.nav-btn.active{
color:var(--gold2)
}

.modal{
position:fixed;
z-index:100;
inset:0;
display:none;
align-items:flex-end;
padding:10px;
background:rgba(0,0,0,.7)
}

.modal.show{
display:flex
}

.sheet{
width:100%;
background:#111419;
border:1px solid var(--line);
border-radius:20px 20px 0 0;
padding:16px
}

.sheet-head{
display:flex;
align-items:center;
justify-content:space-between
}

.sheet-title{
font-size:21px;
font-weight:700
}

.close{
width:34px;
height:34px;
border-radius:50%;
background:#20242b;
font-size:21px
}

.sheet-row{
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid var(--line);
font-size:12px
}

.sheet-row span{
color:var(--muted)
}

@media(max-width:430px){

.app{
padding-left:12px;
padding-right:12px
}

.topbar{
height:56px
}

.brand-name{
font-size:17px
}

.weather-page{
grid-template-rows:73px 110px 38px 198px 1fr
}

.location-name{
font-size:27px
}

.temp{
font-size:63px
}

.condition{
font-size:15px
}

.current-right{
font-size:10px
}

.current-right strong{
font-size:11px
}

.chart-box{
height:198px
}

.chart-svg{
height:174px
}

.chart-value{
font-size:14px
}

.day-name{
font-size:9px
}

.day-temp{
font-size:8px
}

.day-rain{
font-size:7px
}

.page-title h2{
font-size:21px
}

}

@media(max-width:370px){

.city{
padding:8px 8px;
font-size:9px
}

.weather-page{
grid-template-rows:70px 104px 36px 190px 1fr
}

.temp{
font-size:57px
}

.location-name{
font-size:24px
}

.condition{
font-size:14px
}

.current-right{
font-size:9px
}

.day{
padding:4px 1px
}

.day-name{
font-size:8px
}

.day-date{
font-size:7px
}

.day-icon{
font-size:16px
}

.day-temp{
font-size:7px
}

.day-rain{
font-size:6px
}

.chart-value{
font-size:13px
}

}
</style>
</head>

<body>

<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>

<div class="app">

<header class="topbar">

<div class="brand">

<div class="brand-mark">
A
</div>

<div>
<div class="brand-name">
AURA
</div>

<div class="brand-sub">
GEO METEO
</div>
</div>

</div>

<div class="status">
<span class="live"></span>
<span>LIVE</span>
<span id="updated">—</span>
</div>

</header>

<main class="screen">

<!-- WEATHER -->

<section class="page active" id="page-weather">

<div class="weather-page">

<div class="hero">

<div>

<div class="location-name" id="locationName">
Варна
</div>

<div class="location-state">
ATMOSPHERIC CONDITIONS
</div>

</div>

<div class="city-switch">

<button class="city active" data-city="varna">
ВАРНА
</button>

<button class="city" data-city="odesa">
ОДЕССА
</button>

</div>

</div>

<div class="current" id="current">
Загрузка…
</div>

<div class="chart-head">

<div class="chart-title">
ПОЧАСОВОЙ ПРОГНОЗ
</div>

<div class="chart-tabs">

<button class="chart-tab active" data-metric="temp">
°C
</button>

<button class="chart-tab" data-metric="wind">
WIND
</button>

<button class="chart-tab" data-metric="humidity">
HUM
</button>

</div>

</div>

<div class="chart-box" id="chart">
Загрузка…
</div>

<div class="day-strip" id="days">
</div>

</div>

</section>

<!-- AIR -->

<section class="page" id="page-air">

<div class="simple">

<div class="page-title">

<div>
<div class="kicker">ATMOSPHERE</div>
<h2>Качество воздуха</h2>
</div>

<button onclick="openAirGuide()">
AQI
</button>

</div>

<div class="content">

<div class="air-main">

<div class="air-score" id="air-score">
Загрузка…

<div class="pollutants" id="pollutants">

<div id="air-info">

</div>

</div>

</div>

<!-- MAGNETIC -->

<section class="page" id="page-magnetic">

<div class="simple">

<div class="page-title">

Kp

<!-- EARTHQUAKES -->

<section class="page" id="page-seismo">

<div class="simple">

<div class="page-title">

<div>
<div class="kicker">SEISMIC MONITOR</div>

</div>

↻

<div class="quake-page">

<div class="quake-summary" id="quakeSummary">
Загрузка…
</div>

<div class="quake-list" id="quakeList">
</div>

</div>

</div>

</div>

</section>

<!-- MOON -->

<section class="page" id="page-moon">

<div class="moon-page" id="moon">
Загрузка…
</div>

</section>

</main>

</div>

<nav class="bottom-nav">

<button class="nav-btn active" data-page="weather">
<span class="nav-icon">☁</span>
<span>Погода</span>
</button>

<button class="nav-btn" data-page="air">
<span class="nav-icon">◉</span>
<span>Воздух</span>
</button>

<button class="nav-btn" data-page="magnetic">
<span class="nav-icon">ϟ</span>

</button>

<button class="nav-btn" data-page="seismo">
<span class="nav-icon">⌁</span>
<span>Сейсмо</span>
</button>

<span class="nav-icon">☾</span>
<span>Луна</span>
</button>

</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

<div class="sheet">

<div class="sheet-head">

<div class="sheet-title" id="modalTitle">
Подробно
</div>

<button class="close" onclick="closeModal()">
×

</div>

<div id="modalBody"></div>

</div>

</div>

<script>
"use strict";

const CITIES={
varna:{
name:"Варна",
lat:43.2141,
lon:27.9147,
tz:"Europe/Sofia"
},
odesa:{
name:"Одесса",
lat:46.4825,
lon:30.7233,
tz:"Europe/Kyiv"
}
};

const WMO={
0:["Ясно","☀️"],
1:["Преимущественно ясно","🌤️"],
2:["Переменная облачность","⛅"],
3:["Пасмурно","☁️"],
45:["Туман","🌫️"],
48:["Туман","🌫️"],
51:["Морось","🌦️"],
53:["Морось","🌦️"],
55:["Сильная морось","🌧️"],
56:["Ледяная морось","🌧️"],
57:["Ледяная морось","🌧️"],
61:["Небольшой дождь","🌦️"],
63:["Дождь","🌧️"],
65:["Сильный дождь","🌧️"],
66:["Ледяной дождь","🌧️"],
67:["Сильный ледяной дождь","🌧️"],
71:["Снег","🌨️"],
73:["Снег","🌨️"],
75:["Сильный снег","❄️"],
77:["Снежные зерна","❄️"],
80:["Ливни","🌦️"],
81:["Сильные ливни","🌧️"],
82:["Очень сильные ливни","⛈️"],
85:["Снегопад","🌨️"],
86:["Сильный снегопад","❄️"],
95:["Гроза","⛈️"],
96:["Гроза с градом","⛈️"],
99:["Сильная гроза с градом","⛈️"]
};

const S={
city:"varna",
weather:null,
air:null,
day:0,
metric:"temp",
points:[],
kp:[],
forecastKp:[],
quakes:[]
};

const $=id=>document.getElementById(id);

function city(){
return CITIES[S.city];
}

function n(v,d=0){

const x=Number(v);

return Number.isFinite(x)
?x.toFixed(d).replace(".0","")
:"—";
}

function time(v){

return new Date(v).toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);
}

function dateShort(v){

return new Date(v+"T12:00:00")
.toLocaleDateString(
"ru-RU",
{
day:"2-digit",

"ru-RU",
{
weekday:"short"
}
)
.replace(".","")
.replace(
/^./,
x=>x.toUpperCase()
);

async function json(url){

const r=await fetch(
url+
(url.includes("?")?"&":"?")+
"_="+Date.now(),
{
cache:"no-store"
}
);

if(!r.ok){
throw new Error("HTTP "+r.status);
}

return r.json();
}

function renderChart(){

const h=S.weather.hourly;
const ids=getHours();

if(!ids.length)return;

const pts=ids.map(i=>({

time:time(h.time[i]),

temp:Number(
h.temperature_2m[i]
),

feels:Number(
h.apparent_temperature[i]
),

rain:Number(
h.precipitation_probability[i]??0
),

precip:Number(
h.precipitation[i]??0
),

wind:Number(
h.wind_speed_10m[i]??0
),

gust:Number(
h.wind_gusts_10m[i]??0
),

humidity:Number(
h.relative_humidity_2m[i]??0
)

}));

S.points=pts;

const W=720;
const H=175;
const L=34;
const R=10;
const T=14;
const B=25;

const PW=W-L-R;
const PH=H-T-B;

const vals=
S.metric==="temp"
?pts.map(x=>x.temp)
:S.metric==="wind"
?pts.map(x=>x.wind)
:pts.map(x=>x.humidity);

let min=Math.floor(
Math.min(...vals)
);

let max=Math.ceil(
Math.max(...vals)
);

if(min===max){
min--;
max++;
}

const x=i=>
L+
(
pts.length===1
?PW/2
:i*PW/(pts.length-1)
);

const y=v=>
T+
(max-v)*PH/(max-min);

const path=pts
.map(
(p,i)=>
(i?"L":"M")+
x(i).toFixed(1)+
" "+
y(vals[i]).toFixed(1)
)
.join(" ");

const area=
path+
` L ${x(pts.length-1)} ${H-B}
L ${x(0)} ${H-B} Z`;

const grid=[
max,
Math.round((max+min)/2),
min
]
.map(v=>`

<line
x1="${L}"
y1="${y(v)}"
x2="${W-R}"
y2="${y(v)}"
stroke="rgba(255,255,255,.07)"
/>

<text
x="${L-6}"
y="${y(v)+3}"
text-anchor="end"
fill="#858892"
font-size="11"
>
${n(v)}
</text>

`)
.join("");

const labels=pts
.map(
(p,i)=>
(i%4===0||
i===pts.length-1)
?`

<text
x="${x(i)}"
y="${H-5}"
text-anchor="middle"
fill="#858892"
font-size="10"
>
${p.time}
</text>

`
:""
)
.join("");

const stroke=
S.metric==="temp"
?"#ead7a7"
:S.metric==="wind"
?"#76d7e8"
:"#75d5a4";

$("chart").innerHTML=`

<svg
id="weatherChart"
class="chart-svg"
viewBox="0 0 ${W} ${H}"
preserveAspectRatio="none"
>

<defs>

<linearGradient
id="chartGradient"
x1="0"
y1="0"
x2="0"
y2="1"
>

<stop
offset="0"
stop-color="#c7a86b"
stop-opacity=".23"
/>

<stop
offset="1"
stop-color="#c7a86b"
stop-opacity="0"
/>

</linearGradient>

</defs>

${grid}

${
S.metric==="temp"
?`<path
d="${area}"
fill="url(#chartGradient)"
/>`
:""
}

<path
d="${path}"
fill="none"
stroke="${stroke}"
stroke-width="3.5"
stroke-linecap="round"
stroke-linejoin="round"
/>

${pts.map(
(p,i)=>`

<circle
class="dot"
data-i="${i}"
cx="${x(i)}"
cy="${y(vals[i])}"
r="4"
fill="${stroke}"
stroke="#0a0c10"
stroke-width="2"
/>

`
).join("")}

<line
id="marker"
class="chart-marker"
x1="${x(0)}"
y1="${T}"
x2="${x(0)}"
y2="${H-B}"
stroke="#ffffff"
stroke-width="1"
opacity=".65"
/>

<text
id="chartValue"
class="chart-value"
x="${x(0)}"
y="${Math.max(T+14,y(vals[0])-10)}"
text-anchor="middle"
>
</text>

${labels}

</svg>
`;

bindChart();
}

function getChartValue(point){

if(!point){
return"—";
}

if(S.metric==="temp"){
return n(point.temp)+"°";
}

if(S.metric==="wind"){
return n(point.wind)+" км/ч";
}

return n(point.humidity)+"%";
}

function bindChart(){

const svg=$("weatherChart");
const marker=$("marker");
const valueLabel=$("chartValue");

if(!svg||!S.points.length)return;

function show(i){

i=Math.max(
0,
Math.min(
S.points.length-1,
Number(i)
)
);

const W=720;
const H=175;
const L=34;
const R=10;
const T=14;
const B=25;
const PW=W-L-R;
const PH=H-T-B;

const vals=
S.metric==="temp"
?S.points.map(x=>x.temp)
:S.metric==="wind"
?S.points.map(x=>x.wind)
:S.points.map(x=>x.humidity);

let min=Math.floor(
Math.min(...vals)
);

let max=Math.ceil(
Math.max(...vals)
);

if(min===max){
min--;
max++;
}

const xx=
L+
(
S.points.length===1
?PW/2
:i*PW/(S.points.length-1)
);

const yy=
T+
(max-vals[i])*PH/(max-min);

marker.setAttribute("x1",xx);
marker.setAttribute("x2",xx);

valueLabel.setAttribute("x",xx);

valueLabel.setAttribute(
"y",
Math.max(
T+14,
yy-10
)
);

valueLabel.textContent=
getChartValue(S.points[i]);

svg.querySelectorAll(".dot")
.forEach((d,n)=>{
d.setAttribute(
"r",
n===i?7:4
);
});
}

function pick(e){

const r=
svg.getBoundingClientRect();

const px=Math.max(
0,
Math.min(
r.width,
e.clientX-r.left
)
);

const i=Math.round(
px/r.width*
(S.points.length-1)
);

show(i);
}

svg.addEventListener(
"pointerdown",
e=>{
svg.setPointerCapture?.(
e.pointerId
);
pick(e);
}
);

svg.addEventListener(
"pointermove",
e=>{
if(e.buttons){
pick(e);
}
}
);

svg.querySelectorAll(".dot")
.forEach(d=>
d.addEventListener(
"click",
()=>show(d.dataset.i)
)
);

show(0);
}

x[0],

x.kp??
x.Kp??
x[1]
),

observed:

x[2],

scale:
x.noaa_scale

}))
.filter(

x.time&&
Number.isFinite(x.kp)
)
.sort(
(a,b)=>
new Date(a.time)-
new Date(b.time)
);
}

function distance(
lat1,
lon1,
lat2,
lon2
){

const R=6371;
const r=Math.PI/180;

const a=
Math.sin(
(lat2-lat1)*r/2
)**2+
Math.cos(lat1*r)*
Math.cos(lat2*r)*
Math.sin(
(lon2-lon1)*r/2
)**2;

return 2*R*
Math.asin(
Math.sqrt(a)
);
}

/* NAVIGATION */

function openPage(page){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);

$("page-"+page)
.classList.add("active");

document
.querySelectorAll(".nav-btn")
.forEach(x=>
x.classList.toggle(
"active",
x.dataset.page===page
)
);
}

document
.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.onclick=()=>
openPage(btn.dataset.page);

});

/* CITY */

document
.querySelectorAll(".city")
.forEach(btn=>{

btn.onclick=async()=>{

document
.querySelectorAll(".city")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

S.city=btn.dataset.city;
S.day=0;

await refresh();

};

});

/* CHART */

document
.querySelectorAll(".chart-tab")
.forEach(btn=>{

btn.onclick=()=>{

S.metric=btn.dataset.metric;

document
.querySelectorAll(".chart-tab")
.forEach(x=>
x.classList.toggle(
"active",
x===btn
)
);

renderChart();

};

});

/* MODAL */

function openModal(){
$("modal").classList.add("show");
}

function closeModal(){
$("modal").classList.remove("show");
}

/* REFRESH */

async function refresh(){

$("updated").textContent=
"обновление…";

await Promise.allSettled([

loadWeather(),
loadAir(),
loadKp(),
loadQuakes()

]);

renderMoon();

$("updated").textContent=
new Date().toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);
}

renderMoon();

refresh();

setInterval(
refresh,
15*60*1000
);

</script>
