<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AURA GEO METEO</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11151d;
  --panel2:#181e28;
  --line:#303846;
  --text:#f4f6fa;
  --muted:#aeb7c5;
  --gold:#e7ca72;
  --blue:#79aaff;
  --green:#65d58a;
  --orange:#ffb45e;
  --red:#ff7373;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

button,a{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  width:100%;
  height:100dvh;
  padding:env(safe-area-inset-top) 12px calc(72px + env(safe-area-inset-bottom));
  overflow:hidden;
}

.header{
  height:125px;
  background:linear-gradient(145deg,#171c26,#0f131a);
  border:1px solid #343b48;
  border-radius:20px;
  padding:14px 16px;
  position:relative;
  overflow:hidden;
}

.header:after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-70px;
  bottom:-100px;
  border-radius:50%;
  background:rgba(231,202,114,.08);
}

.brand-icon{
  font-size:22px;
  line-height:1;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:clamp(28px,8.5vw,44px);
  line-height:1;
  letter-spacing:-1.2px;
  white-space:nowrap;
}

.gold{
  color:var(--gold)
}

.subtitle{
  margin-top:5px;
  color:#d6dce5;
  font-size:12px;
}

.status{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.city-tabs{
  position:absolute;
  right:12px;
  bottom:12px;
  display:flex;
  gap:6px;
  z-index:2;
}

.city-btn{
  border:1px solid #4b5361;
  background:#202631;
  color:#e5e9ef;
  padding:6px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.city-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111318;
}

.telegram{
  height:72px;
  margin-top:8px;
  padding:10px 13px;
  border:1px solid #2f3947;
  border-radius:16px;
  background:#10151d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.telegram-title{
  font-size:13px;
  font-weight:800;
}

.telegram-text{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.telegram-btn{
  flex:0 0 auto;
  display:block;
  padding:8px 10px;
  border-radius:9px;
  background:#2a75d6;
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

.screen{
  height:calc(
    100dvh -
    221px -
    env(safe-area-inset-top) -
    env(safe-area-inset-bottom)
  );
  margin-top:8px;
  min-height:0;
}

.page{
  display:none;
  width:100%;
  height:100%;
  min-height:0;
}

.page.active{
  display:block;
}

.card{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  overflow:hidden;
}

.card-head{
  height:28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.card-action{
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.current{
  height:108px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.temp{
  font-size:50px;
  line-height:1;
  font-weight:800;
  letter-spacing:-2px;
}

.weather-main{
  margin-top:5px;
  font-size:15px;
  font-weight:700;
}

.weather-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.current-right{
  text-align:right;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}

.metric{
  min-width:0;
  background:var(--panel2);
  border-radius:11px;
  padding:8px;
}

.metric-label{
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
}

.metric-value{
  margin-top:3px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.forecast-title{
  margin:11px 0 5px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.forecast{
  height:88px;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.day{
  min-width:0;
  height:88px;
  border:1px solid #29313d;
  background:var(--panel2);
  border-radius:10px;
  color:var(--text);
  padding:6px 3px;
  text-align:center;
}

.day.active{
  border-color:var(--gold)
}

.day-name{
  font-size:9px;
  font-weight:800;
}

.day-date{
  margin-top:1px;
  color:var(--muted);
  font-size:7px;
}

.day-icon{
  margin:4px 0;
  font-size:19px;
}

.day-temp{
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}

.day-rain{
  margin-top:3px;
  color:var(--blue);
  font-size:7px;
}

.page-note{
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
}

.air-main{
  display:flex;
  align-items:center;
  gap:18px;
  height:80px;
}

.air-score{
  font-size:48px;
  line-height:1;
  font-weight:900;
}

.good{
  color:var(--green)
}

.warn{
  color:var(--orange)
}

.bad{
  color:var(--red)
}

.air-label{
  font-size:15px;
  font-weight:800;
}

.pollutants{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:5px;
  margin-top:9px;
}

.pollutant{
  min-width:0;
  border:0;
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:8px 2px;
}

.pollutant b{
  display:block;
  font-size:13px;
}

.pollutant span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:7px;
  line-height:1.05;
}

.air-bars{
  margin-top:10px;
  display:grid;
  gap:5px;
}

.air-bar{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--panel2);
  border-radius:9px;
  padding:0 9px;
  font-size:10px;
}

.kp-main{
  height:112px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.kp-number{
  font-size:58px;
  line-height:1;
  font-weight:900;
}

.kp-status{
  text-align:right;
}

.kp-label{
  font-size:18px;
  font-weight:900;
}

.kp-help{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.section-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:4px 0 6px;
}

.kp-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
}

.kp-item{
  background:var(--panel2);
  border-radius:9px;
  padding:7px 3px;
  text-align:center;
}

.kp-item time{
  display:block;
  color:var(--muted);
  font-size:8px;
}

.kp-item b{
  display:block;
  margin-top:2px;
  font-size:12px;
}

.quake-summary{
  display:flex;
  align-items:center;
  gap:15px;
  height:82px;
}

.quake-count{
  font-size:46px;
  font-weight:900;
}

.quake-count-label{
  color:var(--muted);
  font-size:11px;
}

.quake-list{
  display:grid;
  gap:6px;
}

.quake{
  width:100%;
  min-width:0;
  height:40px;
  border:0;
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 9px;
  text-align:left;
}

.quake span{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:10px;
}

.quake b{
  flex:0 0 auto;
  font-size:13px;
}

.quake small{
  flex:0 0 auto;
  color:var(--muted);
  font-size:9px;
}

.moon-main{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.moon-icon{
  font-size:82px;
}

.moon-name{
  font-size:21px;
  font-weight:900;
}

.moon-data{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.bottom{
  position:fixed;
  z-index:20;
  left:0;
  bottom:0;
  width:100%;
  height:calc(66px + env(safe-area-inset-bottom));
  padding:5px 6px env(safe-area-inset-bottom);
  background:rgba(9,11,16,.96);
  border-top:1px solid #252c37;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  padding:3px 0;
}

.nav-icon{
  display:block;
  font-size:18px;
  line-height:20px;
}

.nav.active{
  color:var(--gold)
}

.modal{
  position:fixed;
  z-index:50;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.78);
}

.modal.show{
  display:flex
}

.sheet{
  width:100%;
  max-width:520px;
  max-height:calc(100dvh - 24px);
  overflow:hidden;
  background:#11151d;
  border:1px solid #39414e;
  border-radius:18px;
  padding:15px;
}

.sheet-head{
  height:35px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sheet h2{
  margin:0;
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:1px solid #414957;
  border-radius:50%;
  background:#1b212b;
  color:#fff;
  font-size:20px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  margin-top:9px;
}

.detail{
  background:var(--panel2);
  border-radius:10px;
  padding:8px;
}

.detail small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.detail b{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.hour-title{
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

.hour-grid{
  margin-top:5px;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
}

.hour{
  background:var(--panel2);
  border-radius:8px;
  padding:5px 2px;
  text-align:center;
}

.hour-time{
  font-size:8px;
  color:var(--muted);
}

.hour-icon{
  font-size:16px;
  margin:2px 0;
}

.hour-temp{
  font-size:10px;
  font-weight:800;
}

.hour-rain{
  font-size:7px;
  color:var(--blue);
  margin-top:2px;
}

.guide{
  display:grid;
  gap:6px;
  margin-top:9px;
}

.guide-item{
  background:var(--panel2);
  border-radius:10px;
  padding:9px;
  font-size:11px;
  line-height:1.35;
}

@media(max-width:430px){

  .app{
    padding-left:9px;
    padding-right:9px;
  }

  .header{
    height:119px;
    padding:13px;
  }

  h1{
    font-size:29px;
  }

  .subtitle{
    font-size:11px;
  }

  .status{
    font-size:10px;
  }

  .telegram{
    height:68px;
  }

  .screen{
    height:calc(
      100dvh -
      211px -
      env(safe-area-inset-top) -
      env(safe-area-inset-bottom)
    );
  }

  .card{
    padding:12px;
  }

  .temp{
    font-size:46px;
  }

  .current{
    height:101px;
  }

  .metrics{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .forecast{
    height:86px;
  }

  .day{
    height:86px;
  }

  .day:nth-child(n+5){
    display:none;
  }

  .forecast{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .pollutants{
    gap:3px;
  }

  .pollutant b{
    font-size:12px;
  }

  .pollutant span{
    font-size:6.5px;
  }

  .kp-number{
    font-size:52px;
  }

  .kp-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .moon-main{
    height:125px;
  }

  .moon-icon{
    font-size:70px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand-icon">☀</div>

  <h1>
    AURA <span class="gold">GEO METEO</span>
  </h1>

  <div class="subtitle">
    Premium геометеорологический мониторинг
  </div>

  <div id="status" class="status">
    Синхронизация...
  </div>

  <div class="city-tabs">

    <button class="city-btn active" data-city="varna">
      ВАРНА
    </button>

    <button class="city-btn" data-city="odesa">
      ОДЕССА
    </button>

  </div>

</header>

<section class="telegram">

  <div>

    <div class="telegram-title">
      Уведомления Telegram
    </div>

    <div class="telegram-text">
      Kp≥5 · сильная погода · землетрясения
    </div>

  </div>

  <a class="telegram-btn"
     href="#"
     id="telegramLink">
    Подключить
  </a>

</section>

<main class="screen">

<section class="page active"
         id="page-weather">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Погода
      </div>

      <button class="card-action"
              onclick="refreshAll()">
        Обновить
      </button>

    </div>

    <div id="weather">
      Загрузка...
    </div>

  </div>

</section>

<section class="page"
         id="page-air">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Воздух
      </div>

      <button class="card-action"
              onclick="openAirGuide()">
        Что означает
      </button>

    </div>

    <div id="air">
      Загрузка...
    </div>

  </div>

</section>

<section class="page"
         id="page-magnetic">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Магнитные бури
      </div>

      <button class="card-action"
              onclick="openKpGuide()">
        Шкала Kp
      </button>

    </div>

    <div id="magnetic">
      Загрузка...
    </div>

  </div>

</section>

<section class="page"
         id="page-seismo">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Землетрясения
      </div>

      <button class="card-action"
              onclick="loadQuakes()">
        Обновить
      </button>

    </div>

    <div id="seismo">
      Загрузка...
    </div>

  </div>

</section>

<section class="page"
         id="page-moon">

  <div class="card">

    <div class="card-head">

      <div class="card-title">
        Луна
      </div>

    </div>

    <div id="moon">
      Загрузка...
    </div>

  </div>

</section>

</main>

</div>

<nav class="bottom">

  <button class="nav active"
          data-page="weather">

    <span class="nav-icon">☁</span>
    Погода

  </button>

  <button class="nav"
          data-page="air">

    <span class="nav-icon">◉</span>
    Воздух

  </button>

  <button class="nav"
          data-page="magnetic">

    <span class="nav-icon">⚡</span>
    Магнитные

  </button>

  <button class="nav"
          data-page="seismo">

    <span class="nav-icon">⌁</span>
    Сейсмо

  </button>

  <button class="nav"
          data-page="moon">

    <span class="nav-icon">☾</span>
    Луна

  </button>

</nav>

<div class="modal"
     id="modal"
     onclick="if(event.target===this)closeModal()">

  <div class="sheet">

    <div class="sheet-head">

      <h2 id="modalTitle">
        Подробно
      </h2>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<script>
"use strict";

const CITIES={

  varna:{
    name:"Варна",
    country:"Болгария",
    lat:43.21,
    lon:27.91
  },

  odesa:{
    name:"Одесса",
    country:"Украина",
    lat:46.48,
    lon:30.72
  }

};

const state={

  city:"varna",

  weather:null,

  air:null,

  kp:null,

  kpForecast:null,

  quakes:[],

  lastUpdate:null

};

const WMO={

  0:["Ясно","☀"],
  1:["Преимущественно ясно","🌤"],
  2:["Переменная облачность","⛅"],
  3:["Пасмурно","☁"],
  45:["Туман","🌫"],
  48:["Изморозь/туман","🌫"],
  51:["Морось","🌦"],
  53:["Морось","🌦"],
  55:["Сильная морось","🌧"],
  56:["Ледяная морось","🌧"],
  57:["Ледяная морось","🌧"],
  61:["Небольшой дождь","🌦"],
  63:["Дождь","🌧"],
  65:["Сильный дождь","🌧"],
  66:["Ледяной дождь","🌧"],
  67:["Сильный ледяной дождь","🌧"],
  71:["Небольшой снег","🌨"],
  73:["Снег","🌨"],
  75:["Сильный снег","❄"],
  77:["Снежные зерна","❄"],
  80:["Ливни","🌦"],
  81:["Сильные ливни","🌧"],
  82:["Очень сильные ливни","⛈"],
  85:["Снегопад","🌨"],
  86:["Сильный снегопад","❄"],
  95:["Гроза","⛈"],
  96:["Гроза с градом","⛈"],
  99:["Сильная гроза с градом","⛈"]

};

const AQI_BANDS=[

  {
    max:20,
    label:"Хорошо",
    cls:"good"
  },

  {
    max:40,
    label:"Удовлетворительно",
    cls:"good"
  },

  {
    max:60,
    label:"Умеренно",
    cls:"warn"
  },

  {
    max:80,
    label:"Плохо",
    cls:"warn"
  },

  {
    max:100,
    label:"Очень плохо",
    cls:"bad"
  },

  {
    max:Infinity,
    label:"Крайне плохо",
    cls:"bad"
  }

];

const POLLUTANTS={

  pm2_5:{
    label:"PM2.5",
    unit:"µg/m³"
  },

  pm10:{
    label:"PM10",
    unit:"µg/m³"
  },

  nitrogen_dioxide:{
    label:"NO₂",
    unit:"µg/m³"
  },

  ozone:{
    label:"O₃",
    unit:"µg/m³"
  },

function city(){

  return CITIES[state.city];

function esc(v){

  return String(v??"")
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}

function num(v,dec=0){

  const n=Number(v);

  return Number.isFinite(n)
    ?n.toFixed(dec)
    :"—";

}

function weatherInfo(code){

  return WMO[code]||
    ["Неизвестно","•"];

}

function formatTime(iso){

  if(!iso)
    return"—";

  const d=new Date(iso);

  return Number.isNaN(d.getTime())

    ?String(iso).slice(11,16)

    :d.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

function formatDate(iso){

  if(!iso)
    return"—";

  return new Date(
    iso+"T12:00:00"
  ).toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}

function dayName(iso){

  return new Date(
    iso+"T12:00:00"
  ).toLocaleDateString(
    "ru-RU",
    {
      weekday:"short"
    }
  ).replace(".","");

}

}

function parseKpRows(data){

  if(!Array.isArray(data))
    return[];

  const out=[];

  for(const row of data){

    let time=null;
    let kp=null;
    let observed=null;
    let scale=null;

    if(Array.isArray(row)){

      if(row.length>=2){

        time=row[0];

        kp=Number(row[1]);

        observed=row[2];

        scale=row[3];

      }

    }else if(
      row &&
      typeof row==="object"
    ){

      time=
        row.time_tag??
        row.observation_time??
        row.time??
        row.valid_time??
        null;

      kp=Number(
        row.kp??
        row.kp_index??
        row.planetary_k_index??
        row.Kp
      );

      observed=row.observed;

      scale=
        row.noaa_scale??
        row.scale??
        null;

    }

    if(
      time &&
      Number.isFinite(kp)
    ){

      out.push({
        time,
        kp,
        observed,
        scale
      });

    }

  }

  return out.sort(
    (a,b)=>
      new Date(a.time)-
      new Date(b.time)
  );

}

async function loadKp(){

  try{

    const[
      current,
      forecast
    ]=await Promise.all([

      getJSON(
        "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
      ),

      getJSON(
        "https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"
      )

    ]);

    state.kp=
      parseKpRows(current);

    state.kpForecast=
      parseKpRows(forecast);

    renderMagnetic();

  }catch(e){

    showError(
      "magnetic",
      "Данные Kp NOAA сейчас недоступны."
    );

  }

}

function kpLevel(kp){

  if(kp>=9)
    return[
      "G5",
      "Экстремальная буря",
      "bad"
    ];

  if(kp>=8)
    return[
      "G4",
      "Очень сильная буря",
      "bad"
    ];

  if(kp>=7)
    return[
      "G3",
      "Сильная буря",
      "bad"
    ];

  if(kp>=6)
    return[
      "G2",
      "Умеренная буря",
      "warn"
    ];

  if(kp>=5)
    return[
      "G1",
      "Магнитная буря",
      "warn"
    ];

  if(kp>=4)
    return[
      "Kp 4",
      "Возмущённая обстановка",
      "warn"
    ];

  return[
    "Kp 0–3",
    "Спокойная обстановка",
    "good"
  ];

}

function currentKp(){
