<style>

.header{height:120px;background:linear-gradient(145deg,#181e28,#0f131a);border:1px solid #343b48;border-radius:22px;padding:13px 15px;position:relative;overflow:hidden}.header:after{content:"";position:absolute;width:190px;height:190px;right:-85px;bottom:-120px;border-radius:50%;background:rgba(231,202,114,.09)}
.brand-icon{font-size:21px;line-height:1;margin-bottom:4px}h1{margin:0;font-size:clamp(29px,8.4vw,42px);line-height:1;letter-spacing:-1.4px;white-space:nowrap}.gold{color:var(--gold)}.subtitle{margin-top:5px;color:#d6dce5;font-size:14px}.status{margin-top:4px;color:var(--muted);font-size:13px}
.city-tabs{position:absolute;right:12px;bottom:11px;display:flex;gap:6px;z-index:2}.city-btn{border:1px solid #4b5361;background:#202631;color:#e5e9ef;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800}.city-btn.active{background:var(--gold);border-color:var(--gold);color:#111318}

.screen{height:calc(100dvh - 212px - env(safe-area-inset-top) - env(safe-area-inset-bottom));margin-top:8px;min-height:0}.page{display:none;width:100%;height:100%;min-height:0}.page.active{display:block}.card{width:100%;height:100%;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:14px;overflow:hidden}.card-head{height:30px;display:flex;justify-content:space-between;align-items:center;gap:8px}.card-title{font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.card-action{border:0;background:transparent;color:var(--blue);font-size:14px;font-weight:700}
.current{height:106px;display:flex;align-items:center;justify-content:space-between;gap:10px}.temp{font-size:52px;line-height:1;font-weight:850;letter-spacing:-2px}.weather-main{margin-top:5px;font-size:19px;font-weight:750}.weather-sub{margin-top:4px;color:var(--muted);font-size:14px}.current-right{text-align:right;color:var(--muted);font-size:13px;line-height:1.8}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric{min-width:0;background:var(--panel2);border-radius:11px;padding:8px}.metric-label{color:var(--muted);font-size:12px;white-space:nowrap}.metric-value{margin-top:4px;font-size:17px;font-weight:800;white-space:nowrap}
.forecast-title{margin:12px 0 6px;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.forecast{height:286px;display:grid;grid-template-rows:repeat(7,1fr);gap:2px}.day{width:100%;height:40px;border:0;border-bottom:1px solid #252d39;background:transparent;color:var(--text);padding:0 4px;display:grid;grid-template-columns:72px 42px 1fr 92px 62px;align-items:center;text-align:left}.day:last-child{border-bottom:0}.day.active{background:rgba(231,202,114,.08);border-radius:10px}.day-name{font-size:15px;font-weight:850}.day-date{margin-top:2px;color:var(--muted);font-size:12px}.day-icon{font-size:25px;text-align:center}.day-temp{font-size:15px;font-weight:800;text-align:right;white-space:nowrap}.day-rain{margin-top:0;color:var(--blue);font-size:13px;text-align:right;white-space:nowrap}.page-note{margin-top:9px;color:var(--muted);font-size:14px;line-height:1.35}
.air-main{display:flex;align-items:center;gap:18px;height:82px}.air-score{font-size:50px;line-height:1;font-weight:900}.good{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.air-label{font-size:20px;font-weight:850}.pollutants{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:9px}.pollutant{min-width:0;border:0;background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 2px}.pollutant b{display:block;font-size:15px}.pollutant span{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:1.05}.air-bars{margin-top:11px;display:grid;gap:6px}.air-bar{height:29px;display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:9px;padding:0 10px;font-size:13px}.section-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:5px 0 7px}
.kp-main{height:116px;display:flex;align-items:center;justify-content:space-between}.kp-number{font-size:62px;line-height:1;font-weight:900}.kp-status{text-align:right}.kp-label{font-size:21px;font-weight:900}.kp-help{color:var(--muted);font-size:13px;margin-top:5px}.kp-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.kp-item{background:var(--panel2);border-radius:9px;padding:8px 3px;text-align:center}.kp-item time{display:block;color:var(--muted);font-size:10px}.kp-item b{display:block;margin-top:3px;font-size:15px}.kp-warning{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,115,115,.10);border:1px solid rgba(255,115,115,.28);color:#ffd2d2;font-size:13px;font-weight:750}
.quake-summary{display:flex;align-items:center;gap:15px;height:84px}.quake-count{font-size:48px;font-weight:900}.quake-count-label{color:var(--muted);font-size:13px}.quake-list{display:grid;gap:6px}.quake{width:100%;min-width:0;height:42px;border:0;background:var(--panel2);color:var(--text);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;text-align:left}.quake span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.quake b{flex:0 0 auto;font-size:16px}.quake small{flex:0 0 auto;color:var(--muted);font-size:11px}
.moon-main{height:150px;display:flex;align-items:center;justify-content:center;gap:22px}.moon-icon{font-size:84px}.moon-name{font-size:25px;font-weight:900}.moon-data{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.65}
.bottom{position:fixed;z-index:20;left:0;bottom:0;width:100%;height:calc(66px + env(safe-area-inset-bottom));padding:5px 6px env(safe-area-inset-bottom);background:rgba(9,11,16,.97);border-top:1px solid #252c37;display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:3px 0}.nav-icon{display:block;font-size:21px;line-height:21px}.nav.active{color:var(--gold)}
.modal{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.78)}.modal.show{display:flex}.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#151b25,#10141b);border:1px solid #394352;border-radius:25px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.sheet-head{height:43px;display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet h2{margin:0;font-size:27px;line-height:1.1}.close{width:40px;height:40px;border:1px solid #485365;border-radius:50%;background:#202733;color:#fff;font-size:26px;line-height:1}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:11px}.detail{background:#1b222d;border:1px solid #222b38;border-radius:13px;padding:9px 11px}.detail small{display:block;color:#aeb7c5;font-size:14px}.detail b{display:block;margin-top:4px;font-size:20px;line-height:1.1}.chart-title{margin:13px 0 6px;color:#aeb7c5;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.chart-wrap{position:relative;width:100%;min-width:0}.chart-point{cursor:pointer;touch-action:manipulation}.chart-point.selected .chart-dot{stroke-width:5;filter:drop-shadow(0 0 5px rgba(231,202,114,.65))}.chart-tooltip{position:absolute;z-index:3;max-width:86%;padding:11px 13px;border:1px solid #4a5668;border-radius:14px;background:rgba(9,11,16,.97);color:#f4f6fa;font-size:15px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}.chart-tooltip b{font-size:18px;color:#e7ca72}.chart-hint{margin-top:6px;color:#b4bdca;font-size:13px;text-align:center}.chart-slider{width:100%;height:28px;margin:4px 0 0;accent-color:#e7ca72;touch-action:pan-x}.chart-selected{margin-top:5px;padding:10px 12px;border-radius:13px;background:#1b222d;border:1px solid #2b3543;font-size:15px;line-height:1.4}.chart-selected b{font-size:18px;color:#e7ca72}.temp-chart{width:100%;height:205px;display:block;background:linear-gradient(180deg,#18202b,#141a23);border:1px solid #273140;border-radius:17px}.chart-caption{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:#aeb7c5;font-size:13px}.chart-caption b{color:#f4f6fa;font-size:15px}.guide{display:grid;gap:7px;margin-top:11px}.guide-item{background:#1b222d;border:1px solid #222b38;border-radius:12px;padding:10px 11px;font-size:14px;line-height:1.35}.empty{color:var(--muted);padding:12px 0;font-size:14px}.muted{color:var(--muted);font-size:inherit}
@media(max-width:430px){.app{padding-left:9px;padding-right:9px}.header{height:118px;padding:12px 13px}h1{font-size:29px}.subtitle{font-size:14px}.status{font-size:13px}.telegram{height:67px}.telegram-title{font-size:16px}.telegram-text{font-size:13px}.screen{height:calc(100dvh - 209px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}.card{padding:12px}.card-title{font-size:20px}.card-action{font-size:15px}.temp{font-size:52px}.weather-main{font-size:20px}.weather-sub{font-size:15px}.current{height:105px}.current-right{font-size:14px;line-height:1.9}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metric{padding:9px}.metric-label{font-size:13px}.metric-value{font-size:18px}.forecast{height:286px}.day{grid-template-columns:72px 42px 1fr 88px 60px;height:40px}.day-name{font-size:15px}.day-date{font-size:12px}.day-icon{font-size:25px}.day-temp{font-size:14px}.day-rain{font-size:12px}.pollutants{gap:4px}.pollutant b{font-size:15px}.pollutant span{font-size:10px}.kp-number{font-size:58px}.kp-label{font-size:22px}.kp-help{font-size:14px}.moon-main{height:125px}.moon-icon{font-size:70px}.moon-name{font-size:27px}.moon-data{font-size:15px}.sheet{padding:14px;border-radius:22px}.sheet h2{font-size:27px}.detail{padding:9px}.detail small{font-size:13px}.detail b{font-size:19px}.temp-chart{height:220px}.chart-caption{font-size:13px}.chart-hint{font-size:13px}.chart-selected{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="brand-icon">☀</div>
<h1>AURA <span class="gold">GEO METEO</span></h1>
<div class="subtitle">Геометеорологический мониторинг</div>
<div id="status" class="status">Синхронизация...</div>
<div class="city-tabs">
<button class="city-btn active" data-city="varna">ВАРНА</button>
<button class="city-btn" data-city="odesa">ОДЕССА</button>
</div>
</header>

<section class="telegram">
<div>
<div class="telegram-title">Уведомления Telegram</div>
<div class="telegram-text">Kp≥5 · сильная погода · землетрясения</div>
</div>
<a class="telegram-btn" href="#" id="telegramLink">Подключить</a>
</section>

<main class="screen">
<section class="page active" id="page-weather">
<div class="card">
<div class="card-head">
<div class="card-title">Погода</div>
<button class="card-action" onclick="refreshAll()">Обновить</button>
</div>
<div id="weather">Загрузка...</div>
</div>
</section>

<section class="page" id="page-air">
<div class="card">
<div class="card-head">
<div class="card-title">Воздух</div>
<button class="card-action" onclick="openAirGuide()">Что означает</button>
</div>
<div id="air">Загрузка...</div>
</div>
</section>

<section class="page" id="page-magnetic">
<div class="card">
<div class="card-head">
<div class="card-title">Магнитные бури</div>
<button class="card-action" onclick="openKpGuide()">Шкала Kp</button>
</div>
<div id="magnetic">Загрузка...</div>
</div>
</section>

<section class="page" id="page-seismo">
<div class="card">
<div class="card-head">
<div class="card-title">Землетрясения</div>
<button class="card-action" onclick="loadQuakes()">Обновить</button>
</div>
<div id="seismo">Загрузка...</div>
</div>
</section>

<section class="page" id="page-moon">
<div class="card">
<div class="card-head">
<div class="card-title">Луна</div>
</div>
<div id="moon">Загрузка...</div>
</div>
</section>
</main>
</div>

<nav class="bottom">
<button class="nav active" data-page="weather"><span class="nav-icon">☁</span>Погода</button>
<button class="nav" data-page="air"><span class="nav-icon">◉</span>Воздух</button>
<button class="nav" data-page="magnetic"><span class="nav-icon">⚡</span>Магнитные</button>
<button class="nav" data-page="seismo"><span class="nav-icon">⌁</span>Сейсмо</button>
<button class="nav" data-page="moon"><span class="nav-icon">☾</span>Луна</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="sheet-head">
<h2 id="modalTitle">Подробно</h2>
<button class="close" onclick="closeModal()">×</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>
"use strict";

const CITIES={
varna:{name:"Варна",country:"Болгария",lat:43.21,lon:27.91},
odesa:{name:"Одесса",country:"Украина",lat:46.48,lon:30.72}
};

const state={
city:"varna",
weather:null,
air:null,
kp:null,
kpForecast:null,
quakes:[],
lastUpdate:null
};

const WMO={
0:["Ясно","☀"],
1:["Преимущественно ясно","🌤"],
2:["Переменная облачность","⛅"],
3:["Пасмурно","☁"],
45:["Туман","🌫"],
48:["Изморозь/туман","🌫"],
51:["Морось","🌦"],
53:["Морось","🌦"],
55:["Сильная морось","🌧"],
56:["Ледяная морось","🌧"],
57:["Ледяная морось","🌧"],
61:["Небольшой дождь","🌦"],
63:["Дождь","🌧"],
65:["Сильный дождь","🌧"],
66:["Ледяной дождь","🌧"],
67:["Сильный ледяной дождь","🌧"],
71:["Небольшой снег","🌨"],
73:["Снег","🌨"],
75:["Сильный снег","❄"],
77:["Снежные зерна","❄"],
80:["Ливни","🌦"],
81:["Сильные ливни","🌧"],
82:["Очень сильные ливни","⛈"],
85:["Снегопад","🌨"],
86:["Сильный снегопад","❄"],
95:["Гроза","⛈"],
96:["Гроза с градом","⛈"],
99:["Сильная гроза с градом","⛈"]
};

const AQI_BANDS=[
{max:20,label:"Хорошо",cls:"good"},
{max:40,label:"Удовлетворительно",cls:"good"},
{max:60,label:"Умеренно",cls:"warn"},
{max:80,label:"Плохо",cls:"warn"},
{max:100,label:"Очень плохо",cls:"bad"},
{max:Infinity,label:"Крайне плохо",cls:"bad"}
];

const POLLUTANTS={
pm2_5:{label:"PM2.5",unit:"µg/m³"},
pm10:{label:"PM10",unit:"µg/m³"},
nitrogen_dioxide:{label:"NO₂",unit:"µg/m³"},
ozone:{label:"O₃",unit:"µg/m³"},
sulphur_dioxide:{label:"SO₂",unit:"µg/m³"}
};

function city(){
return CITIES[state.city];
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[m]));
}

function num(v,dec=0){
const n=Number(v);
return Number.isFinite(n)?n.toFixed(dec):"—";
}

function weatherInfo(code){
return WMO[code]||["Неизвестно","•"];
}

function formatTime(iso){
const m=String(iso??"").match(/T(\d{2}):(\d{2})/);
return m?m[1]+":"+m[2]:"—";
}

function formatDate(iso){
if(!iso)return"—";
return new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}

function dayName(iso){
return new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","");
}

function setStatus(t){
document.getElementById("status").textContent=t;
}

function showError(id,msg){
document.getElementById(id).innerHTML='<div class="bad empty">'+esc(msg)+"</div>";
}

async function getJSON(url){
const r=await fetch(url,{cache:"no-store"});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}

function weatherURL(c){
const p=new URLSearchParams({
latitude:c.lat,
longitude:c.lon,
timezone:"auto",
forecast_days:"7",
current:"temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m,wind_gusts_10m,is_day",
hourly:"temperature_2m,apparent_temperature,precipitation_probability,precipitation,rain,snowfall,weather_code,wind_speed_10m,wind_gusts_10m,relative_humidity_2m",
daily:"weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,rain_sum,snowfall_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset"
});
return"https://api.open-meteo.com/v1/forecast?"+p;
}

function airURL(c){
const p=new URLSearchParams({
latitude:c.lat,
longitude:c.lon,
timezone:"auto",
current:"european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide",
hourly:"european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide"
});
return"https://air-quality-api.open-meteo.com/v1/air-quality?"+p;
}

async function loadWeather(){
try{
state.weather=await getJSON(weatherURL(city()));
renderWeather();
}catch(e){
showError("weather","Не удалось загрузить погоду.");
}
}

async function loadAir(){
try{
state.air=await getJSON(airURL(city()));
renderAir();
}catch(e){
showError("air","Не удалось загрузить данные о воздухе.");
}
}

function parseKpRows(data){
if(!Array.isArray(data))return[];

return data.map(row=>{
let time=null,kp=null,observed=null,scale=null;

if(Array.isArray(row)){
time=row[0];
kp=Number(row[1]);
observed=row[2];
scale=row[3];
}else if(row&&typeof row==="object"){
time=row.time_tag??row.observation_time??row.time??row.valid_time??null;
kp=Number(row.kp??row.kp_index??row.planetary_k_index??row.Kp);
observed=row.observed;
scale=row.noaa_scale??row.scale??null;
}

return time&&Number.isFinite(kp)
?{time,kp,observed,scale}
:null;
}).filter(Boolean).sort((a,b)=>new Date(a.time)-new Date(b.time));
}

async function loadKp(){
try{
const[current,forecast]=await Promise.all([
getJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
getJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json")
]);

state.kp=parseKpRows(current);
state.kpForecast=parseKpRows(forecast);
renderMagnetic();

}catch(e){
showError("magnetic","Данные Kp NOAA сейчас недоступны.");
}
}

function kpLevel(kp){
if(kp>=9)return["G5","Экстремальная буря","bad"];
if(kp>=8)return["G4","Очень сильная буря","bad"];
if(kp>=7)return["G3","Сильная буря","bad"];
if(kp>=6)return["G2","Умеренная буря","warn"];
if(kp>=5)return["G1","Магнитная буря","warn"];
if(kp>=4)return["Kp 4","Возмущённая обстановка","warn"];
return["Kp 0–3","Спокойная обстановка","good"];
}

function currentKp(){
return state.kp?.length?state.kp[state.kp.length-1]:null;
}

function renderMagnetic(){
const el=document.getElementById("magnetic");

function buildTempChart(h,rows){

const points=rows.map(j=>({
temp:Number(h.temperature_2m?.[j]),
feels:Number(h.apparent_temperature?.[j]),
time:formatTime(h.time?.[j]),
rain:Number(h.precipitation_probability?.[j]??0),
precip:Number(h.precipitation?.[j]??0),
wind:Number(h.wind_speed_10m?.[j]??0),
gust:Number(h.wind_gusts_10m?.[j]??0),
code:Number(h.weather_code?.[j]??-1)
})).filter(p=>Number.isFinite(p.temp));

if(!points.length)
return'<div class="empty">Почасовые данные недоступны.</div>';

const W=720;
const H=280;
const L=54;
const R=18;
const T=30;
const B=50;
const PW=W-L-R;
const PH=H-T-B;

const minT=Math.floor(Math.min(...points.map(p=>p.temp))-1);
const maxT=Math.ceil(Math.max(...points.map(p=>p.temp))+1);
const range=Math.max(1,maxT-minT);

const x=i=>L+(points.length===1?PW/2:i*PW/(points.length-1));
const y=t=>T+(maxT-t)*PH/range;

const path=points.map((p,i)=>
(i?'L':'M')+
x(i).toFixed(1)+' '+
y(p.temp).toFixed(1)
).join(' ');

const area=
path+
' L '+x(points.length-1).toFixed(1)+' '+(H-B)+
' L '+x(0).toFixed(1)+' '+(H-B)+
' Z';

const mid=Math.round((maxT+minT)/2);

const grid=[maxT,mid,minT].map(t=>
'<line x1="'+L+'" y1="'+y(t)+'" x2="'+(W-R)+'" y2="'+y(t)+'" stroke="#2b3543"/>'+
'<text x="'+(L-9)+'" y="'+(y(t)+5)+'" text-anchor="end" fill="#d7dee8" font-size="16">'+t+'°</text>'
).join('');

const every=points.length>=18?4:points.length>=10?2:1;

const labels=points.map((p,i)=>
(i%every===0||i===points.length-1)?
'<text x="'+x(i)+'" y="'+(H-17)+'" text-anchor="middle" fill="#d7dee8" font-size="15">'+esc(p.time)+'</text>'
:''
).join('');

const bars=points.map((p,i)=>{
const bh=Math.max(0,Math.min(30,p.rain*.30));
return bh?
'<rect x="'+(x(i)-3)+'" y="'+(H-B-bh)+'" width="6" height="'+bh+'" rx="3" fill="#79aaff" opacity=".55"/>'
:'';
}).join('');

const marks=points.map((p,i)=>
'<g class="chart-point" data-chart-index="'+i+'" tabindex="0" role="button" aria-label="'+esc(p.time+' '+num(p.temp)+'°C')+'">'+
'<circle cx="'+x(i)+'" cy="'+y(p.temp)+'" r="12" fill="transparent"/>'+
'<circle class="chart-dot" cx="'+x(i)+'" cy="'+y(p.temp)+'" r="6" fill="#e7ca72" stroke="#10141b" stroke-width="3"/>'+
'</g>'+
(i===0||i===Math.floor(points.length/2)||i===points.length-1?
'<text x="'+x(i)+'" y="'+(y(p.temp)-16)+'" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">'+num(p.temp)+'°</text>'
:'')
).join('');

const uid=
'chart_'+
Date.now()+
'_'+
Math.random().toString(36).slice(2,8);

const payload=encodeURIComponent(JSON.stringify(points));

return
'<div class="chart-wrap" data-chart-id="'+uid+'" data-chart-points="'+payload+'">'+

'<svg class="temp-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-label="Интерактивный график почасовой температуры">'+

'<defs>'+
'<linearGradient id="'+uid+'_fill" x1="0" y1="0" x2="0" y2="1">'+
'<stop offset="0%" stop-color="#e7ca72" stop-opacity=".24"/>'+
'<stop offset="100%" stop-color="#e7ca72" stop-opacity="0"/>'+
'</linearGradient>'+
'</defs>'+

grid+
bars+

'<path d="'+area+'" fill="url(#'+uid+'_fill)"/>'+
'<path d="'+path+'" fill="none" stroke="#e7ca72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+
marks+
labels+

'</svg>'+

'<div class="chart-tooltip" hidden></div>'+

'<input class="chart-slider" type="range" min="0" max="'+
(points.length-1)+
'" value="0" step="1" aria-label="Выбор часа на графике">'+

'<div class="chart-selected"></div>'+

'<div class="chart-caption">'+
'<span>Осадки <b>'+num(Math.max(...points.map(p=>p.rain)))+'%</b></span>'+
'<span>Макс. ветер <b>'+num(Math.max(...points.map(p=>p.wind)))+' км/ч</b></span>'+
'</div>'+

'<div class="chart-hint">Нажми на точку или проведи ползунок по часам</div>'+

'</div>';
}

function bindCharts(){

document.querySelectorAll('.chart-wrap').forEach(wrap=>{

if(wrap.dataset.bound==="1")return;

wrap.dataset.bound="1";

const tooltip=wrap.querySelector('.chart-tooltip');
const selected=wrap.querySelector('.chart-selected');
const slider=wrap.querySelector('.chart-slider');

const points=JSON.parse(
decodeURIComponent(
wrap.dataset.chartPoints||"%5B%5D"
)
);

const show=i=>{

const p=points[i];

if(!p)return;

slider.value=i;

selected.innerHTML=
'<b>'+
esc(p.time)+
' · '+
num(p.temp)+
'°C</b><br>'+
'Ощущается '+
num(p.feels)+
'°C · осадки '+
num(p.rain)+
'% ('+
num(p.precip,1)+
' мм)<br>'+
'Ветер '+
num(p.wind)+
' км/ч · порывы '+
num(p.gust)+
' км/ч · '+
weatherInfo(p.code)[0];

tooltip.innerHTML=
'<b>'+
esc(p.time)+
'</b><br>'+
num(p.temp)+
'°C';

tooltip.hidden=false;

const svg=wrap.querySelector('svg');
const c=svg.getBoundingClientRect();

const cx=
(
54+
(i/Math.max(1,points.length-1))*
(720-72)
)/
720*
c.width;

tooltip.style.left=
Math.max(
4,
Math.min(
wrap.clientWidth-tooltip.offsetWidth-4,
cx-tooltip.offsetWidth/2
)
)+'px';

tooltip.style.top='8px';

wrap.querySelectorAll('.chart-point').forEach(
(el,n)=>
el.classList.toggle(
'selected',
n===i
)
);
};

wrap.querySelectorAll('.chart-point').forEach((el,i)=>{

el.addEventListener(
'click',
()=>show(i)
);

el.addEventListener(
'touchend',
e=>{
e.preventDefault();
show(i);
},
{passive:false}
);

el.addEventListener(
'keydown',
e=>{
if(e.key==="Enter"||e.key===" "){
e.preventDefault();
show(i);
}
}
);

});

slider.addEventListener(
'input',
()=>show(Number(slider.value))
);

show(0);

});
}

function distanceKm(lat1,lon1,lat2,lon2){

const R=6371;
const rad=Math.PI/180;

const p1=lat1*rad;
const p2=lat2*rad;

const dp=(lat2-lat1)*rad;
const dl=(lon2-lon1)*rad;

const a=
Math.sin(dp/2)**2+
Math.cos(p1)*
Math.cos(p2)*
Math.sin(dl/2)**2;

return 2*R*Math.asin(Math.sqrt(a));
}

async function loadQuakes(){

try{

const data=
await getJSON(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
);

const c=city();

state.quakes=
(data.features||[])
.map(f=>{

const[lon,lat,depth]=f.geometry.coordinates;

return{
mag:Number(f.properties.mag),
place:f.properties.place||"Неизвестно",
time:f.properties.time,
lat,
lon,
depth,
distance:distanceKm(c.lat,c.lon,lat,lon),
url:f.properties.url
};

})
.filter(q=>Number.isFinite(q.mag)&&q.distance<=500)
.sort((a,b)=>b.time-a.time)
.slice(0,8);

renderEarthquakes();

}catch(e){

showError(
"seismo",
"Не удалось загрузить данные USGS."
);

}
}

function calculateMoon(date=new Date()){

const synodic=29.530588853;
const known=new Date(Date.UTC(2000,0,6,18,14));

const age=((date-known)/86400000)%synodic;
const a=(age+synodic)%synodic;
const phase=a/synodic;

let name;
let icon;

if(a<1.85){
name="Новолуние";
icon="🌑";
}
else if(a<7.38){
name="Растущий серп";
icon="🌒";
}
else if(a<9.22){
name="Первая четверть";
icon="🌓";
}
else if(a<14.76){
name="Растущая Луна";
icon="🌔";
}
else if(a<16.61){
name="Полнолуние";
icon="🌕";
}
else if(a<22.15){
name="Убывающая Луна";
icon="🌖";
}
else if(a<23.99){
name="Последняя четверть";
icon="🌗";
}
else{
name="Убывающий серп";
icon="🌘";
}

return{
name,
icon,
age:a,
illumination:.5*(1-Math.cos(2*Math.PI*phase))*100
};
}

let refreshing=false;

async function refreshAll(){

if(refreshing)return;

refreshing=true;

setStatus("Синхронизация...");

try{

await Promise.allSettled([
loadWeather(),
loadAir(),
loadKp(),
loadQuakes()
]);

renderMoon();

state.lastUpdate=new Date();

setStatus(
"Обновлено "+
state.lastUpdate.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
)
);

}finally{

refreshing=false;

}
}
