<!DOCTYPE html>
<html lang="ru">
<head>

<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#181e28;--line:#303846;--text:#f4f6fa;--muted:#aeb7c5;--gold:#e7ca72;--blue:#79aaff;--green:#65d58a;--orange:#ffb45e;--red:#ff7373}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}button,a{font:inherit}button{cursor:pointer}
.app{width:100%;height:100dvh;padding:env(safe-area-inset-top) 10px calc(72px + env(safe-area-inset-bottom));overflow:hidden}
.header{height:120px;background:linear-gradient(145deg,#181e28,#0f131a);border:1px solid #343b48;border-radius:22px;padding:13px 15px;position:relative;overflow:hidden}.header:after{content:"";position:absolute;width:190px;height:190px;right:-85px;bottom:-120px;border-radius:50%;background:rgba(231,202,114,.09)}
.brand-icon{font-size:21px;line-height:1;margin-bottom:4px}h1{margin:0;font-size:clamp(29px,8.4vw,42px);line-height:1;letter-spacing:-1.4px;white-space:nowrap}.gold{color:var(--gold)}.subtitle{margin-top:5px;color:#d6dce5;font-size:12px}.status{margin-top:4px;color:var(--muted);font-size:11px}
.city-tabs{position:absolute;right:12px;bottom:11px;display:flex;gap:6px;z-index:2}.city-btn{border:1px solid #4b5361;background:#202631;color:#e5e9ef;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800}.city-btn.active{background:var(--gold);border-color:var(--gold);color:#111318}
.telegram{height:68px;margin-top:8px;padding:9px 12px;border:1px solid #2f3947;border-radius:16px;background:#10151d;display:flex;align-items:center;justify-content:space-between;gap:9px}.telegram-title{font-size:13px;font-weight:800}.telegram-text{color:var(--muted);font-size:10px;margin-top:3px}.telegram-btn{display:block;flex:0 0 auto;padding:8px 10px;border-radius:9px;background:#2a75d6;color:#fff;text-decoration:none;font-size:11px;font-weight:800}
.screen{height:calc(100dvh - 212px - env(safe-area-inset-top) - env(safe-area-inset-bottom));margin-top:8px;min-height:0}.page{display:none;width:100%;height:100%;min-height:0}.page.active{display:block}.card{width:100%;height:100%;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:14px;overflow:hidden}.card-head{height:30px;display:flex;justify-content:space-between;align-items:center;gap:8px}.card-title{font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.card-action{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700}
.current{height:106px;display:flex;align-items:center;justify-content:space-between;gap:10px}.temp{font-size:52px;line-height:1;font-weight:850;letter-spacing:-2px}.weather-main{margin-top:5px;font-size:16px;font-weight:750}.weather-sub{margin-top:4px;color:var(--muted);font-size:12px}.current-right{text-align:right;color:var(--muted);font-size:11px;line-height:1.8}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric{min-width:0;background:var(--panel2);border-radius:11px;padding:8px}.metric-label{color:var(--muted);font-size:10px;white-space:nowrap}.metric-value{margin-top:4px;font-size:15px;font-weight:800;white-space:nowrap}
.forecast-title{margin:11px 0 6px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.forecast{height:92px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-width:0;height:92px;border:1px solid #29313d;background:var(--panel2);border-radius:11px;color:var(--text);padding:6px 3px;text-align:center}.day.active{border-color:var(--gold)}.day-name{font-size:9px;font-weight:800}.day-date{margin-top:2px;color:var(--muted);font-size:8px}.day-icon{margin:4px 0;font-size:20px}.day-temp{font-size:10px;font-weight:800;white-space:nowrap}.day-rain{margin-top:3px;color:var(--blue);font-size:8px}.page-note{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.3}
.air-main{display:flex;align-items:center;gap:18px;height:82px}.air-score{font-size:50px;line-height:1;font-weight:900}.good{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.air-label{font-size:17px;font-weight:850}.pollutants{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:9px}.pollutant{min-width:0;border:0;background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 2px}.pollutant b{display:block;font-size:13px}.pollutant span{display:block;margin-top:4px;color:var(--muted);font-size:8px;line-height:1.05}.air-bars{margin-top:11px;display:grid;gap:6px}.air-bar{height:27px;display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:9px;padding:0 10px;font-size:11px}.section-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:5px 0 7px}
.kp-main{height:116px;display:flex;align-items:center;justify-content:space-between}.kp-number{font-size:62px;line-height:1;font-weight:900}.kp-status{text-align:right}.kp-label{font-size:19px;font-weight:900}.kp-help{color:var(--muted);font-size:11px;margin-top:5px}.kp-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.kp-item{background:var(--panel2);border-radius:9px;padding:8px 3px;text-align:center}.kp-item time{display:block;color:var(--muted);font-size:9px}.kp-item b{display:block;margin-top:3px;font-size:13px}.kp-warning{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,115,115,.10);border:1px solid rgba(255,115,115,.28);color:#ffd2d2;font-size:11px;font-weight:750}
.quake-summary{display:flex;align-items:center;gap:15px;height:84px}.quake-count{font-size:48px;font-weight:900}.quake-count-label{color:var(--muted);font-size:11px}.quake-list{display:grid;gap:6px}.quake{width:100%;min-width:0;height:42px;border:0;background:var(--panel2);color:var(--text);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;text-align:left}.quake span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.quake b{flex:0 0 auto;font-size:14px}.quake small{flex:0 0 auto;color:var(--muted);font-size:9px}
.moon-main{height:150px;display:flex;align-items:center;justify-content:center;gap:22px}.moon-icon{font-size:84px}.moon-name{font-size:22px;font-weight:900}.moon-data{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.65}
.bottom{position:fixed;z-index:20;left:0;bottom:0;width:100%;height:calc(66px + env(safe-area-inset-bottom));padding:5px 6px env(safe-area-inset-bottom);background:rgba(9,11,16,.97);border-top:1px solid #252c37;display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:3px 0}.nav-icon{display:block;font-size:19px;line-height:21px}.nav.active{color:var(--gold)}
.modal{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.78)}.modal.show{display:flex}.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#151b25,#10141b);border:1px solid #394352;border-radius:25px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.sheet-head{height:43px;display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet h2{margin:0;font-size:24px;line-height:1.1}.close{width:40px;height:40px;border:1px solid #485365;border-radius:50%;background:#202733;color:#fff;font-size:26px;line-height:1}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:11px}.detail{background:#1b222d;border:1px solid #222b38;border-radius:13px;padding:9px 11px}.detail small{display:block;color:#aeb7c5;font-size:10px}.detail b{display:block;margin-top:4px;font-size:16px;line-height:1.1}.chart-title{margin:13px 0 6px;color:#aeb7c5;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.temp-chart{width:100%;height:185px;display:block;background:linear-gradient(180deg,#18202b,#141a23);border:1px solid #273140;border-radius:17px}.chart-caption{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:#aeb7c5;font-size:11px}.chart-caption b{color:#f4f6fa;font-size:13px}.guide{display:grid;gap:7px;margin-top:11px}.guide-item{background:#1b222d;border:1px solid #222b38;border-radius:12px;padding:10px 11px;font-size:12px;line-height:1.35}.empty{color:var(--muted);padding:12px 0;font-size:12px}.muted{color:var(--muted)}
@media(max-width:430px){.app{padding-left:9px;padding-right:9px}.header{height:118px;padding:12px 13px}h1{font-size:29px}.subtitle{font-size:11px}.status{font-size:10px}.telegram{height:67px}.screen{height:calc(100dvh - 209px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}.card{padding:12px}.temp{font-size:48px}.current{height:101px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.forecast{height:87px;grid-template-columns:repeat(4,minmax(0,1fr))}.day{height:87px}.day:nth-child(n+5){display:none}.pollutants{gap:4px}.pollutant b{font-size:12px}.pollutant span{font-size:7px}.kp-number{font-size:54px}.kp-list{grid-template-columns:repeat(4,minmax(0,1fr))}.moon-main{height:125px}.moon-icon{font-size:70px}.sheet{padding:14px;border-radius:22px}.sheet h2{font-size:22px}.detail{padding:8px 9px}.detail b{font-size:15px}.temp-chart{height:165px}.chart-caption{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand-icon">☀</div><h1>AURA <span class="gold">GEO METEO</span></h1><div class="subtitle">Геометеорологический мониторинг</div><div id="status" class="status">Синхронизация...</div><div class="city-tabs"><button class="city-btn active" data-city="varna">ВАРНА</button><button class="city-btn" data-city="odesa">ОДЕССА</button></div></header>
<section class="telegram"><div><div class="telegram-title">Уведомления Telegram</div><div class="telegram-text">Kp≥5 · сильная погода · землетрясения</div></div><a class="telegram-btn" href="#" id="telegramLink">Подключить</a></section>
<main class="screen">
<section class="page active" id="page-weather"><div class="card"><div class="card-head"><div class="card-title">Погода</div><button class="card-action" onclick="refreshAll()">Обновить</button></div><div id="weather">Загрузка...</div></div></section>
<section class="page" id="page-air"><div class="card"><div class="card-head"><div class="card-title">Воздух</div><button class="card-action" onclick="openAirGuide()">Что означает</button></div><div id="air">Загрузка...</div></div></section>
<section class="page" id="page-magnetic"><div class="card"><div class="card-head"><div class="card-title">Магнитные бури</div><button class="card-action" onclick="openKpGuide()">Шкала Kp</button></div><div id="magnetic">Загрузка...</div></div></section>
<section class="page" id="page-seismo"><div class="card"><div class="card-head"><div class="card-title">Землетрясения</div><button class="card-action" onclick="loadQuakes()">Обновить</button></div><div id="seismo">Загрузка...</div></div></section>
<section class="page" id="page-moon"><div class="card"><div class="card-head"><div class="card-title">Луна</div></div><div id="moon">Загрузка...</div></div></section>
</main></div>
<nav class="bottom"><button class="nav active" data-page="weather"><span class="nav-icon">☁</span>Погода</button><button class="nav" data-page="air"><span class="nav-icon">◉</span>Воздух</button><button class="nav" data-page="magnetic"><span class="nav-icon">⚡</span>Магнитные</button><button class="nav" data-page="seismo"><span class="nav-icon">⌁</span>Сейсмо</button><button class="nav" data-page="moon"><span class="nav-icon">☾</span>Луна</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">Подробно</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
"use strict";
const CITIES={varna:{name:"Варна",country:"Болгария",lat:43.21,lon:27.91},odesa:{name:"Одесса",country:"Украина",lat:46.48,lon:30.72}};
const state={city:"varna",weather:null,air:null,kp:null,kpForecast:null,quakes:[],lastUpdate:null};
const WMO={0:["Ясно","☀"],1:["Преимущественно ясно","🌤"],2:["Переменная облачность","⛅"],3:["Пасмурно","☁"],45:["Туман","🌫"],48:["Изморозь/туман","🌫"],51:["Морось","🌦"],53:["Морось","🌦"],55:["Сильная морось","🌧"],56:["Ледяная морось","🌧"],57:["Ледяная морось","🌧"],61:["Небольшой дождь","🌦"],63:["Дождь","🌧"],65:["Сильный дождь","🌧"],66:["Ледяной дождь","🌧"],67:["Сильный ледяной дождь","🌧"],71:["Небольшой снег","🌨"],73:["Снег","🌨"],75:["Сильный снег","❄"],77:["Снежные зерна","❄"],80:["Ливни","🌦"],81:["Сильные ливни","🌧"],82:["Очень сильные ливни","⛈"],85:["Снегопад","🌨"],86:["Сильный снегопад","❄"],95:["Гроза","⛈"],96:["Гроза с градом","⛈"],99:["Сильная гроза с градом","⛈"]};
const AQI_BANDS=[{max:20,label:"Хорошо",cls:"good"},{max:40,label:"Удовлетворительно",cls:"good"},{max:60,label:"Умеренно",cls:"warn"},{max:80,label:"Плохо",cls:"warn"},{max:100,label:"Очень плохо",cls:"bad"},{max:Infinity,label:"Крайне плохо",cls:"bad"}];
const POLLUTANTS={pm2_5:{label:"PM2.5",unit:"µg/m³"},pm10:{label:"PM10",unit:"µg/m³"},nitrogen_dioxide:{label:"NO₂",unit:"µg/m³"},ozone:{label:"O₃",unit:"µg/m³"},sulphur_dioxide:{label:"SO₂",unit:"µg/m³"}};
function city(){return CITIES[state.city]}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function num(v,dec=0){const n=Number(v);return Number.isFinite(n)?n.toFixed(dec):"—"}
function weatherInfo(code){return WMO[code]||["Неизвестно","•"]}
function formatTime(iso){const m=String(iso??"").match(/T(\d{2}):(\d{2})/);return m?m[1]+":"+m[2]:"—"}
function formatDate(iso){if(!iso)return"—";return new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})}
function dayName(iso){return new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}
function setStatus(t){document.getElementById("status").textContent=t}
function showError(id,msg){document.getElementById(id).innerHTML='<div class="bad empty">'+esc(msg)+"</div>"}
async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function weatherURL(c){const p=new URLSearchParams({latitude:c.lat,longitude:c.lon,timezone:"auto",forecast_days:"7",current:"temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m,wind_gusts_10m,is_day",hourly:"temperature_2m,apparent_temperature,precipitation_probability,precipitation,rain,snowfall,weather_code,wind_speed_10m,wind_gusts_10m,relative_humidity_2m",daily:"weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,rain_sum,snowfall_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset"});return"https://api.open-meteo.com/v1/forecast?"+p}
function airURL(c){const p=new URLSearchParams({latitude:c.lat,longitude:c.lon,timezone:"auto",current:"european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide",hourly:"european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide"});return"https://air-quality-api.open-meteo.com/v1/air-quality?"+p}
async function loadWeather(){try{state.weather=await getJSON(weatherURL(city()));renderWeather()}catch(e){showError("weather","Не удалось загрузить погоду.")}}
async function loadAir(){try{state.air=await getJSON(airURL(city()));renderAir()}catch(e){showError("air","Не удалось загрузить данные о воздухе.")}}
function parseKpRows(data){if(!Array.isArray(data))return[];return data.map(row=>{let time=null,kp=null,observed=null,scale=null;if(Array.isArray(row)){time=row[0];kp=Number(row[1]);observed=row[2];scale=row[3]}else if(row&&typeof row==="object"){time=row.time_tag??row.observation_time??row.time??row.valid_time??null;kp=Number(row.kp??row.kp_index??row.planetary_k_index??row.Kp);observed=row.observed;scale=row.noaa_scale??row.scale??null}return time&&Number.isFinite(kp)?{time,kp,observed,scale}:null}).filter(Boolean).sort((a,b)=>new Date(a.time)-new Date(b.time))}
async function loadKp(){try{const [current,forecast]=await Promise.all([getJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),getJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json")]);state.kp=parseKpRows(current);state.kpForecast=parseKpRows(forecast);renderMagnetic()}catch(e){showError("magnetic","Данные Kp NOAA сейчас недоступны.")}}
function kpLevel(kp){if(kp>=9)return["G5","Экстремальная буря","bad"];if(kp>=8)return["G4","Очень сильная буря","bad"];if(kp>=7)return["G3","Сильная буря","bad"];if(kp>=6)return["G2","Умеренная буря","warn"];if(kp>=5)return["G1","Магнитная буря","warn"];if(kp>=4)return["Kp 4","Возмущённая обстановка","warn"];return["Kp 0–3","Спокойная обстановка","good"]}
function currentKp(){return state.kp?.length?state.kp[state.kp.length-1]:null}
function renderMagnetic(){const el=document.getElementById("magnetic"),cur=currentKp();if(!cur){el.innerHTML='<div class="empty">Kp сейчас недоступен.</div>';return}const level=kpLevel(cur.kp),future=(state.kpForecast||[]).filter(x=>new Date(x.time)>new Date()&&x.observed!=="observed").slice(0,8);el.innerHTML='<div class="kp-main"><div><div class="kp-number">'+num(cur.kp,1)+'</div><div class="muted" style="font-size:11px">Kp сейчас · '+formatTime(cur.time)+'</div></div><div class="kp-status"><div class="kp-label '+level[2]+'">'+level[0]+'</div><div class="kp-help">'+level[1]+'</div></div></div><div class="section-label">Прогноз Kp</div><div class="kp-list">'+(future.length?future.map(x=>'<div class="kp-item"><time>'+formatTime(x.time)+'</time><b>Kp '+num(x.kp,1)+'</b></div>').join(""):'<div class="empty">В ближайшем прогнозе Kp≥4 нет.</div>')+'</div>'+(cur.kp>=5?'<div class="kp-warning">Внимание: текущий Kp достиг уровня магнитной бури G1 или выше.</div>':'<div class="page-note">Kp 5 и выше соответствует геомагнитной буре.</div>')}
function renderWeather(){const w=state.weather;if(!w?.current){showError("weather","Нет данных о погоде.");return}const c=w.current,d=w.daily,info=weatherInfo(c.weather_code),days=d.time.map((date,i)=>'<button class="day '+(i===0?"active":"")+'" onclick="openDay('+i+')"><div class="day-name">'+(i===0?"Сегодня":i===1?"Завтра":dayName(date))+'</div><div class="day-date">'+formatDate(date)+'</div><div class="day-icon">'+weatherInfo(d.weather_code[i])[1]+'</div><div class="day-temp">'+num(d.temperature_2m_max[i])+'° / '+num(d.temperature_2m_min[i])+'°</div><div class="day-rain">Осадки '+num(d.precipitation_probability_max[i])+'%</div></button>').join("");document.getElementById("weather").innerHTML='<div class="current"><div><div class="temp">'+num(c.temperature_2m)+'°</div><div class="weather-main">'+info[1]+' '+esc(info[0])+'</div><div class="weather-sub">Ощущается '+num(c.apparent_temperature)+'° · '+city().name+'</div></div><div class="current-right"><div>Ветер '+num(c.wind_speed_10m)+' км/ч</div><div>Порывы '+num(c.wind_gusts_10m)+' км/ч</div><div>Влажность '+num(c.relative_humidity_2m)+'%</div></div></div><div class="metrics"><div class="metric"><div class="metric-label">Давление</div><div class="metric-value">'+num(c.pressure_msl)+' hPa</div></div><div class="metric"><div class="metric-label">UV</div><div class="metric-value">'+num(d.uv_index_max[0],1)+'</div></div><div class="metric"><div class="metric-label">Восход</div><div class="metric-value">'+formatTime(d.sunrise[0])+'</div></div><div class="metric"><div class="metric-label">Закат</div><div class="metric-value">'+formatTime(d.sunset[0])+'</div></div></div><div class="forecast-title">7 дней · нажми на день</div><div class="forecast">'+days+'</div>'}
function buildTempChart(h,rows){const points=rows.map(j=>({temp:Number(h.temperature_2m?.[j]),time:formatTime(h.time?.[j]),rain:Number(h.precipitation_probability?.[j]??0),wind:Number(h.wind_speed_10m?.[j]??0)})).filter(p=>Number.isFinite(p.temp));if(!points.length)return'<div class="empty">Почасовые данные недоступны.</div>';const W=720,H=250,L=46,R=18,T=26,B=42,PW=W-L-R,PH=H-T-B,minT=Math.floor(Math.min(...points.map(p=>p.temp))-1),maxT=Math.ceil(Math.max(...points.map(p=>p.temp))+1),range=Math.max(1,maxT-minT),x=i=>L+(points.length===1?PW/2:i*PW/(points.length-1)),y=t=>T+(maxT-t)*PH/range,path=points.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.temp).toFixed(1)).join(" "),area=path+" L "+x(points.length-1).toFixed(1)+" "+(H-B)+" L "+x(0).toFixed(1)+" "+(H-B)+" Z",mid=Math.round((maxT+minT)/2),grid=[maxT,mid,minT].map(t=>'<line x1="'+L+'" y1="'+y(t)+'" x2="'+(W-R)+'" y2="'+y(t)+'" stroke="#2b3543"/><text x="'+(L-9)+'" y="'+(y(t)+4)+'" text-anchor="end" fill="#aeb7c5" font-size="13">'+t+'°</text>').join(""),every=points.length>=18?4:points.length>=10?2:1,labels=points.map((p,i)=>(i%every===0||i===points.length-1)?'<text x="'+x(i)+'" y="'+(H-15)+'" text-anchor="middle" fill="#aeb7c5" font-size="12">'+esc(p.time)+'</text>':"").join(""),marks=points.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.temp)+'" r="5" fill="#e7ca72" stroke="#10141b" stroke-width="3"/>'+(i===0||i===Math.floor(points.length/2)||i===points.length-1?'<text x="'+x(i)+'" y="'+(y(p.temp)-12)+'" text-anchor="middle" fill="#f4f6fa" font-size="14" font-weight="700">'+num(p.temp)+'°</text>':"")).join("");return'<svg class="temp-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-label="График температуры"><defs><linearGradient id="tempFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7ca72" stop-opacity=".22"/><stop offset="100%" stop-color="#e7ca72" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#tempFill)"/><path d="'+path+'" fill="none" stroke="#e7ca72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+marks+labels+'</svg><div class="chart-caption"><span>Осадки <b>'+num(Math.max(...points.map(p=>p.rain)))+'%</b></span><span>Макс. ветер <b>'+num(Math.max(...points.map(p=>p.wind)))+' км/ч</b></span></div>'}
function openDay(i){const d=state.weather?.daily,h=state.weather?.hourly;if(!d||!h)return;const date=d.time[i],rows=[];for(let j=0;j<h.time.length;j++)if(String(h.time[j]).slice(0,10)===date)rows.push(j);document.getElementById("modalTitle").textContent=i===0?"Погода сегодня":i===1?"Погода завтра":"Погода "+formatDate(date);document.getElementById("modalBody").innerHTML='<div class="detail-grid"><div class="detail"><small>Максимум</small><b>'+num(d.temperature_2m_max[i])+'°</b></div><div class="detail"><small>Минимум</small><b>'+num(d.temperature_2m_min[i])+'°</b></div><div class="detail"><small>Ощущается до</small><b>'+num(d.apparent_temperature_max[i])+'°</b></div><div class="detail"><small>Осадки</small><b>'+num(d.precipitation_probability_max[i])+'%</b></div><div class="detail"><small>Дождь</small><b>'+num(d.rain_sum[i],1)+' мм</b></div><div class="detail"><small>Снег</small><b>'+num(d.snowfall_sum[i],1)+' см</b></div><div class="detail"><small>Ветер</small><b>'+num(d.wind_speed_10m_max[i])+' км/ч</b></div><div class="detail"><small>Порывы</small><b>'+num(d.wind_gusts_10m_max[i])+' км/ч</b></div></div><div class="chart-title">Температура по часам</div>'+buildTempChart(h,rows);openModal()}
function aqiInfo(aqi){return AQI_BANDS.find(x=>aqi<=x.max)||AQI_BANDS[AQI_BANDS.length-1]}
function renderAir(){const a=state.air?.current;if(!a){showError("air","Нет данных о воздухе.");return}const band=aqiInfo(Number(a.european_aqi)),vals=Object.keys(POLLUTANTS);document.getElementById("air").innerHTML='<div class="air-main"><div class="air-score '+band.cls+'">'+num(a.european_aqi)+'</div><div><div class="air-label">'+band.label+'</div><div class="muted" style="font-size:10px;margin-top:4px">European AQI · '+city().name+'</div></div></div><div class="pollutants">'+vals.map(k=>'<button class="pollutant" onclick="openPollutant(\''+k+'\')"><b>'+num(a[k],1)+'</b><span>'+POLLUTANTS[k].label+'<br>'+POLLUTANTS[k].unit+'</span></button>').join("")+'</div><div class="section-label" style="margin-top:13px">Основные показатели</div><div class="air-bars">'+vals.map(k=>'<div class="air-bar"><span>'+POLLUTANTS[k].label+'</span><b>'+num(a[k],1)+' µg/m³</b></div>').join("")+'</div>'}
function openPollutant(k){const p=POLLUTANTS[k],a=state.air?.current?.[k];if(!p)return;document.getElementById("modalTitle").textContent=p.label;document.getElementById("modalBody").innerHTML='<div class="air-main"><div class="air-score">'+num(a,1)+'</div><div class="air-label">'+p.unit+'</div></div><div class="guide"><div class="guide-item">Текущее содержание '+p.label+': <b>'+num(a,1)+' '+p.unit+'</b>.</div><div class="guide-item">European AQI оценивает качество воздуха по концентрациям загрязнителей.</div></div>';openModal()}
function openAirGuide(){document.getElementById("modalTitle").textContent="European AQI";document.getElementById("modalBody").innerHTML='<div class="guide"><div class="guide-item"><b class="good">0–20 · Хорошо</b></div><div class="guide-item"><b class="good">21–40 · Удовлетворительно</b></div><div class="guide-item"><b class="warn">41–60 · Умеренно</b></div><div class="guide-item"><b class="warn">61–80 · Плохо</b></div><div class="guide-item"><b class="bad">81–100 · Очень плохо</b></div><div class="guide-item"><b class="bad">&gt;100 · Крайне плохо</b></div></div>';openModal()}
function openKpGuide(){document.getElementById("modalTitle").textContent="Шкала Kp";document.getElementById("modalBody").innerHTML='<div class="guide"><div class="guide-item"><b>Kp 0–3</b><br>Спокойная геомагнитная обстановка.</div><div class="guide-item"><b>Kp 4</b><br>Возмущённая обстановка.</div><div class="guide-item"><b>Kp 5–6</b><br>G1–G2 · магнитная буря.</div><div class="guide-item"><b>Kp 7–8</b><br>G3–G4 · сильная и очень сильная буря.</div><div class="guide-item"><b>Kp 9</b><br>G5 · экстремальная буря.</div></div>';openModal()}
function distanceKm(lat1,lon1,lat2,lon2){const R=6371,rad=Math.PI/180,p1=lat1*rad,p2=lat2*rad,dp=(lat2-lat1)*rad,dl=(lon2-lon1)*rad,a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
async function loadQuakes(){try{const data=await getJSON("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"),c=city();state.quakes=(data.features||[]).map(f=>{const [lon,lat,depth]=f.geometry.coordinates;return{mag:Number(f.properties.mag),place:f.properties.place||"Неизвестно",time:f.properties.time,lat,lon,depth,distance:distanceKm(c.lat,c.lon,lat,lon),url:f.properties.url}}).filter(q=>Number.isFinite(q.mag)&&q.distance<=500).sort((a,b)=>b.time-a.time).slice(0,8);renderEarthquakes()}catch(e){showError("seismo","Не удалось загрузить данные USGS.")}}
function renderEarthquakes(){document.getElementById("seismo").innerHTML='<div class="quake-summary"><div class="quake-count">'+state.quakes.length+'</div><div><div class="quake-count-label">событий за 24 часа</div><div class="muted" style="font-size:10px;margin-top:4px">в радиусе 500 км от '+city().name+'</div></div></div><div class="section-label">Последние события</div><div class="quake-list">'+(state.quakes.length?state.quakes.map((q,i)=>'<button class="quake" onclick="openEarthquake('+i+')"><span>'+esc(q.place)+'</span><b>M '+num(q.mag,1)+'</b><small>'+num(q.distance)+' км</small></button>').join(""):'<div class="empty">Значимых событий в радиусе 500 км за последние 24 часа нет.</div>')+'</div>'}
function openEarthquake(i){const q=state.quakes[i];if(!q)return;document.getElementById("modalTitle").textContent="Землетрясение";document.getElementById("modalBody").innerHTML='<div class="detail-grid"><div class="detail"><small>Магнитуда</small><b>M '+num(q.mag,1)+'</b></div><div class="detail"><small>Расстояние</small><b>'+num(q.distance)+' км</b></div><div class="detail"><small>Глубина</small><b>'+num(q.depth,1)+' км</b></div><div class="detail"><small>Время</small><b>'+new Date(q.time).toLocaleString("ru-RU")+'</b></div></div><div class="guide"><div class="guide-item">'+esc(q.place)+'</div></div>';openModal()}
function calculateMoon(date=new Date()){const synodic=29.530588853,known=new Date(Date.UTC(2000,0,6,18,14)),age=((date-known)/86400000)%synodic,a=(age+synodic)%synodic,phase=a/synodic;let name,icon;if(a<1.85){name="Новолуние";icon="🌑"}else if(a<7.38){name="Растущий серп";icon="🌒"}else if(a<9.22){name="Первая четверть";icon="🌓"}else if(a<14.76){name="Растущая Луна";icon="🌔"}else if(a<16.61){name="Полнолуние";icon="🌕"}else if(a<22.15){name="Убывающая Луна";icon="🌖"}else if(a<23.99){name="Последняя четверть";icon="🌗"}else{name="Убывающий серп";icon="🌘"}return{name,icon,age:a,illumination:.5*(1-Math.cos(2*Math.PI*phase))*100}}
function renderMoon(){const m=calculateMoon();document.getElementById("moon").innerHTML='<div class="moon-main"><div class="moon-icon">'+m.icon+'</div><div><div class="moon-name">'+m.name+'</div><div class="moon-data">Возраст: '+num(m.age,1)+' суток<br>Освещённость: '+num(m.illumination,0)+'%<br>'+city().name+'</div></div></div><div class="page-note">Фаза Луны рассчитывается по синодическому месяцу.</div>'}
function openModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
let refreshing=false;async function refreshAll(){if(refreshing)return;refreshing=true;setStatus("Синхронизация...");try{await Promise.allSettled([loadWeather(),loadAir(),loadKp(),loadQuakes()]);renderMoon();state.lastUpdate=new Date();setStatus("Обновлено "+state.lastUpdate.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}))}finally{refreshing=false}}
function openPage(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));const target=document.getElementById("page-"+page);if(target)target.classList.add("active");document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));const nav=document.querySelector('.nav[data-page="'+page+'"]');if(nav)nav.classList.add("active");closeModal()}
document.querySelectorAll(".nav").forEach(btn=>btn.addEventListener("click",()=>openPage(btn.dataset.page)));
document.querySelectorAll(".city-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".city-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");state.city=btn.dataset.city;refreshAll()}));
document.getElementById("telegramLink").addEventListener("click",e=>{e.preventDefault();alert("Ссылка на Telegram-бота будет добавлена отдельно.")});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});renderMoon();refreshAll();setInterval(refreshAll,15*60*1000);
</script>
</body>
