name: AURA Meteo Telegram Alert Bot

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим отправки'
        type: choice
        options:
          - daily
          - alerts
        default: daily

permissions:
  contents: read

concurrency:
  group: aura-telegram
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Alert Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 17 * * *' && 'daily' || 'alerts') }}
        run: |
          if [ "$REPORT_MODE" = "daily" ]; then
            python daily_digest.py
          else
            python bot.py
          fi

